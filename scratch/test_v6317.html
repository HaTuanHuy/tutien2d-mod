<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Suite v0.63.17 - Khô Máu Thú Xổng & Thương Đội</title>
</head>
<body>
  <div id="logs"></div>
  <script>
    window.testResults = { passed: 0, failed: 0, logs: [] };
    function log(msg, pass) {
      var d = document.createElement('div');
      d.textContent = (pass === true ? '[PASS] ' : pass === false ? '[FAIL] ' : '[INFO] ') + msg;
      document.getElementById('logs').appendChild(d);
      if (pass === true) window.testResults.passed++;
      if (pass === false) { window.testResults.failed++; window.testResults.logs.push(msg); }
      console.log(d.textContent);
    }
  </script>

  <script>
    window.PNTT = {};
  </script>

  <script src="../src/core/utils.f3a5ec533e9c.js"></script>
  <script src="../src/world/mapdata.430a546fd419.js"></script>
  <script src="../src/world/map_tamgioi.c3a33f0e9b23.js"></script>
  <script src="../src/entities/enemy.7739f83bfc3f.js"></script>
  <script src="../src/systems/formations.b88e901817ed.js"></script>

  <script>
    var P = window.PNTT;
    P.CONFIG = P.CONFIG || {};
    P.CONFIG.TILE = 32;
    P.CONFIG.PLAYER = { HITBOX_W: 24, HITBOX_H: 32 };
    P.CONFIG.THUNDER = { MP_COST: 5, RANGE: 180, RADIUS: 50 };
    P.HauKy = { TQ_LOAI: 'thach_quy' };
    P.VetNut = {
      MAP: 'khong_gian_vet_nut',
      VE: 'toai_khong_phu',
      laMap: function(m) { return m === 'khong_gian_vet_nut' || m === 'vet_nut'; }
    };
    P.VetNutUI = { trangThai: function() { return { tt: 'CHO' }; } };
    P.Progress = { realmId: 'truc_co_1', hacThi: { giamDen: 0 }, stones: 50000 };
    P.Game = { time: 100 };
    P.Pathfinder = { route: function (x1, y1, x2, y2) { return { path: [{ x: x2, y: y2 }] }; } };
    P.Input = {
      pressAutoToggle: function () { },
      setRun: function () { },
      pressMeditate: function () { window._meditated = true; }
    };
    P.KhuUI = { isOpen: function () { return false; }, close: function () { } };
    P.Gateway = {
      send: function () { return true; },
      selfId: 'player_test',
      socket: { readyState: 1, send: function () {} }
    };

    var fakePlayer = {
      id: 'player_test',
      name: 'memooo',
      x: 200, y: 300,
      hp: 1000, hpMax: 1000,
      mp: 500, mpMax: 500,
      path: [],
      target: null,
      Progress: P.Progress,
      canMeditate: true,
      state: 'idle'
    };
    var fakeMap = {
      data: { id: 'thon_da_do', name: 'Thôn Dã Đỏ' },
      isPassable: function () { return true; }
    };
    var fakeSw = {
      player: fakePlayer,
      enemies: [],
      drops: [],
      map: fakeMap,
      mapId: 'thon_da_do',
      findEnemy: function () { return null; },
      approach: { key: 'foe:1' },
      autoOn: true
    };
    P.SceneWorld = fakeSw;
    P.Game.scene = P.SceneWorld;
    P.HUD = { setCaption: function () {}, showToast: function () {} };
    P.Chat = { line: function () {} };
    P.Player = {
      meleeDamage: function() { return 100; },
      reach: function() { return 26; },
      castSpell: function() { return true; },
      castThunder: function() { return true; }
    };

    var dummySkills = [
      { id: 'kiem_khi', name: 'Kiếm Khí', mp: 10, range: 150, cooldown: 1, lastCast: 0, coef: 2.0 },
      { id: 'hoa_cau', name: 'Hỏa Cầu', mp: 25, range: 120, cooldown: 3, lastCast: 0, coef: 3.5 }
    ];
    P.Skills = {
      autoRotation: function() { return dummySkills; },
      learned: function() { return dummySkills; },
      spellCost: function(me, def) { return { mp: (def && def.mp) || 0, sp: 0 }; },
      dmgOf: function(def) { return ((def && def.coef) || 1) * 100; },
      coolLeft: function(me, def) { return 0; },
      ready: function(me, def) { return true; },
      effectOf: function() { return null; },
      blastTargets: function() { return []; }
    };
    P.Talismans = {
      defOf: function(id) { return { id: id, name: id }; },
      canUse: function(me, def, P) { return { ok: true }; }
    };
    P.TalismanBar = {
      use: function(id) { window._lastTalisman = id; return true; }
    };
  </script>

  <!-- Tampermonkey environment mocks -->
  <script>
    window.GM_getValue = function (k, d) { return d; };
    window.GM_setValue = function () { };
    window.GM_xmlhttpRequest = function () { };
    window.unsafeWindow = window;
  </script>

  <script src="../tutien2d-helper.user.js"></script>

  <script>
    try {
      log('--- 1. TEST VERSION v0.63.17 ---', null);
      var TB = window.TTBot || window._ttbot;
      log('TTBot dev interface ready', !!(TB && TB.dev && TB.dev.eval));
      var v = TB.dev.eval('VERSION');
      log('Version is 0.63.17: ' + v, v === '0.63.17');

      log('--- 2. TEST ESCAPED BEAST & CARAVAN MOB IDENTIFICATION ---', null);
      var beastTypes = [
        'bach_ho_tuyet', 'xich_nhan_nguu', 'xich_ma', 'ngan_mao_hong',
        'yl_hac_tien', 'thach_quy_bd', 'xuyen_son_giap_bd', 'thach_mach_vuong',
        'u_minh_cu_mang', 'xich_mang_vuong', 'xong_chuong_tuyet'
      ];
      var allBeastsMatch = beastTypes.every(function(tp) {
        return TB.dev.eval('isLastHitOnly({ type: "' + tp + '", def: { type: "' + tp + '" } })') === true;
      });
      log('All 11 Escaped Beast types matched by isLastHitOnly: ' + allBeastsMatch, allBeastsMatch);

      var nameMatchBeast = TB.dev.eval('isLastHitOnly({ name: "Yêu Thú Xổng Chuồng Cấp 3" })');
      log('Beast matched by name "Yêu Thú Xổng Chuồng": ' + nameMatchBeast, nameMatchBeast === true);

      var normalMobNoMatch = TB.dev.eval('isLastHitOnly({ type: "lon_rung", def: { type: "lon_rung" } })');
      log('Normal mob (lon_rung) is NOT lastHitOnly: ' + (normalMobNoMatch === false), normalMobNoMatch === false);

      var tdTypes = ['tieu_su', 'kiep_tac', 'thuong_nhan', 'tieu_xa'];
      var allTdMatch = tdTypes.every(function(tp) {
        return TB.dev.eval('isTdMob({ type: "' + tp + '", def: { type: "' + tp + '" } })') === true;
      });
      log('All 4 Caravan types matched by isTdMob: ' + allTdMatch, allTdMatch);

      var tdOanHon = TB.dev.eval('isTdMob({ def: { hon: "oan_hon" } })');
      log('Caravan mob with oan_hon matched: ' + tdOanHon, tdOanHon === true);

      var tdName = TB.dev.eval('isTdMob({ name: "Tiêu Sư Áp Tải" })');
      log('Caravan mob matched by name "Tiêu Sư": ' + tdName, tdName === true);

      log('--- 3. TEST BURST TARGET DEFINITION ---', null);
      var dummyBeast = { id: 101, type: 'bach_ho_tuyet', hp: 50000, hpMax: 50000, x: 210, y: 310, def: { type: 'bach_ho_tuyet', contactDmg: 10 } };
      var dummyTdMob = { id: 102, type: 'tieu_su', hp: 30000, hpMax: 30000, x: 210, y: 310, def: { type: 'tieu_su', contactDmg: 10 } };
      var dummyNormal = { id: 103, type: 'lon_rung', hp: 200, hpMax: 200, x: 210, y: 310, def: { type: 'lon_rung', contactDmg: 10 } };

      fakeSw.enemies = [dummyBeast, dummyTdMob, dummyNormal];
      TB.dev.eval('st.farmTarget = fakeSw.enemies[0];'); // dummyBeast
      var bt1 = TB.dev.eval('burstTarget(game())');
      log('burstTarget recognizes Escaped Beast: ' + (bt1 === dummyBeast), bt1 === dummyBeast);

      TB.dev.eval('st.farmTarget = fakeSw.enemies[1];'); // dummyTdMob
      var bt2 = TB.dev.eval('burstTarget(game())');
      log('burstTarget recognizes Caravan Mob: ' + (bt2 === dummyTdMob), bt2 === dummyTdMob);

      TB.dev.eval('st.farmTarget = fakeSw.enemies[2];'); // dummyNormal
      var bt3 = TB.dev.eval('burstTarget(game())');
      log('burstTarget rejects normal mob: ' + (bt3 === null), bt3 === null);

      log('--- 4. TEST CHOOSE() BURST / KHÔ MÁU MODE & NO-OVERKILL BYPASS ---', null);
      // Giả lập nhân vật MP cạn kiệt (5% MP): bình thường rơi vào 'save'
      fakePlayer.mp = 25; // 25 / 500 = 5% < mpReserve (20%)
      TB.dev.eval('cfg.noOverkill = true;');

      // Case A: Quái thường, MP 5% => phải rơi vào mode = 'save'
      TB.dev.eval('st.xc = null; st.td = null; st.bh = null;');
      var cNormal = TB.dev.eval('choose(game(), fakeSw.enemies[2], 50)');
      log('Normal mob with 5% MP triggers mode "save": ' + cNormal.mode, cNormal.mode === 'save');

      // Case B: Thú xổng chuồng (dummyBeast), MP 5% => BẮT BUỘC KHÔ MÁU mode = 'dmg'
      var cBeast = TB.dev.eval('choose(game(), fakeSw.enemies[0], 50)');
      log('Escaped beast with 5% MP FORCES mode "dmg": ' + cBeast.mode, cBeast.mode === 'dmg');
      log('Escaped beast has isBurstTarget === true: ' + cBeast.isBurstTarget, cBeast.isBurstTarget === true);
      log('Why explains Khô máu dồn DPS: ' + cBeast.why, cBeast.why.indexOf('Khô máu dồn DPS') >= 0);

      // Case C: Quái Thương đội (dummyTdMob), MP 5% => BẮT BUỘC KHÔ MÁU mode = 'dmg'
      var cTd = TB.dev.eval('choose(game(), fakeSw.enemies[1], 50)');
      log('Caravan mob with 5% MP FORCES mode "dmg": ' + cTd.mode, cTd.mode === 'dmg');
      log('Caravan mob has isBurstTarget === true: ' + cTd.isBurstTarget, cTd.isBurstTarget === true);

      // Case D: Khi st.xc đang bật (dù quái bất kỳ trong hoạt động thú xổng)
      TB.dev.eval('st.xc = { id: 1 };');
      var cStXc = TB.dev.eval('choose(game(), fakeSw.enemies[2], 50)');
      log('While st.xc is active, mode is FORCED "dmg" even for any target: ' + cStXc.mode, cStXc.mode === 'dmg');
      TB.dev.eval('st.xc = null;');

      // Case E: Khi st.td đang bật
      TB.dev.eval('st.td = { id: 1 };');
      var cStTd = TB.dev.eval('choose(game(), fakeSw.enemies[2], 50)');
      log('While st.td is active, mode is FORCED "dmg": ' + cStTd.mode, cStTd.mode === 'dmg');
      TB.dev.eval('st.td = null;');

      // Case F: noOverkill check: Máu thú xổng <= melee (100)
      dummyBeast.hp = 80; // <= melee (100)
      fakePlayer.mp = 500; // full MP
      var cOverkillBeast = TB.dev.eval('choose(game(), fakeSw.enemies[0], 50)');
      log('noOverkill does NOT cancel skill for Escaped Beast (best !== null): ' + (cOverkillBeast.best !== null), cOverkillBeast.best !== null);

      // So sánh với quái thường: Máu <= melee (100) => noOverkill sẽ hủy best (đánh thường)
      dummyNormal.hp = 80;
      var cOverkillNormal = TB.dev.eval('choose(game(), fakeSw.enemies[2], 50)');
      log('noOverkill DOES cancel skill for Normal Mob (best === null): ' + (cOverkillNormal.best === null), cOverkillNormal.best === null);

      log('--- 5. TEST TALISMAN USAGE (THANH TÂM PHÙ THRESHOLD) ---', null);
      window._lastTalisman = null;
      TB.dev.eval('cfg.autoMpTal = true;');
      fakePlayer.mp = 150; // 150 / 500 = 30% (< 35% nhưng > 15%)
      TB.dev.eval('st.farmTarget = fakeSw.enemies[0];'); // Escaped beast
      TB.dev.eval('talLastAt = -1e9;');
      TB.dev.eval('tickTalismans(game());');
      log('Thanh Tâm Phù used for Escaped Beast when MP < 35%: ' + (window._lastTalisman === 'thanh_tam'), window._lastTalisman === 'thanh_tam');

      window._lastTalisman = null;
      fakeSw.enemies = [dummyNormal];
      TB.dev.eval('st.farmTarget = fakeSw.enemies[0];'); // Only Normal mob exists in zone
      TB.dev.eval('talLastAt = -1e9;');
      TB.dev.eval('tickTalismans(game());');
      log('Thanh Tâm Phù NOT used for Normal mob when MP is 30% (> 15%): ' + (window._lastTalisman === null), window._lastTalisman === null);
      fakeSw.enemies = [dummyBeast, dummyTdMob, dummyNormal];

      log('--- 6. TEST NO MEDITATION (THIỀN) DURING BURST TARGETS ---', null);
      TB.dev.eval('cfg.bossNoSit = true; cfg.healSit = true;');
      TB.dev.eval('st.healing = true;');
      fakePlayer.state = 'sit';
      window._meditated = false;

      // Đang nhắm Thú Xổng Chuồng => Không được thiền
      TB.dev.eval('st.farmTarget = fakeSw.enemies[0];');
      TB.dev.eval('tickHeal(game());');
      var healingCancelled = TB.dev.eval('st.healing === false');
      log('tickHealing cancels meditation during Escaped Beast hunt: ' + healingCancelled, healingCancelled);
      log('pressMeditate triggered to stand up: ' + window._meditated, window._meditated === true);

      log('=== TOTAL: ' + window.testResults.passed + ' passed, ' + window.testResults.failed + ' failed. ===');
    } catch (err) {
      log('Test exception: ' + err.message + ' ' + err.stack, false);
    }
  </script>
</body>
</html>
