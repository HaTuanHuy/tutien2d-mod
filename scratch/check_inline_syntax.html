  function recordPacketHistory(dir, op, p) {
    var item = {
      t: Date.now(),
      dir: dir,
      op: op,
      summary: op

    if (op === 'tin' || op === 'bao' || op === 'toast' || op === 'world_chat') {
      item.summary = p.text || (p.name ? (p.name + ': ' + (p.text || '')) : op);
    } else if (op === 'bosses') {
      item.summary = 'Lịch ' + (p.boards ? p.boards.length : 0) + ' bảng';
    } else if (op === 'spawn') {
      item.summary = 'Sinh: ' + (p.e ? (p.e.t || p.e.id) : '?');
    } else if (op === 'kill') {
      item.summary = 'Hạ ' + p.id + (p.exp ? (' +' + p.exp + ' exp') : '');
    } else if (op === 'loot') {
      item.summary = 'Rơi ' + (p.l ? p.l.length : (p.items ? p.items.length : 0)) + ' món';
    } else if (op === 'khu') {
      item.summary = (p.mapId || '') + ' (' + (p.ds ? p.ds.length : 0) + ' khu)';
    } else if (op === 'map') {
      item.summary = (p.mapId || '') + ' k' + (p.khu || 1);

    netState.history.unshift(item);
    if (netState.history.length > netState.historyMax) netState.history.pop();

  function handleServerData(data, wsInstance) {
    if (wsInstance) netState.activeSocket = wsInstance;

      var packet;
      try { packet = JSON.parse(data); } catch (e) { return; }
      if (!packet || typeof packet !== 'object') return;
      var op = packet.op || (packet.cmd ? ('cmd_' + packet.cmd) : 'unknown');

      ServerBus.emit(op, packet, data, false);
    }
  }

      var items = Array.isArray(p) ? p : (p && (p.l || p.items));

      var G = g.P.Gateway, L = g.P.Loot, pl = g.me;

      // Sắp xếp theo giá trị giảm dần: nhặt vật phẩm xịn nhất trước!
      var sorted = items.slice().sort(function (a, b) {

        var idB = b && (b.item || b.itemId);
        return gradeScore(g.P, idB) - gradeScore(g.P, idA);

      sorted.forEach(function (it) {
        if (!it || it.id == null || it.ht) return;
        var itemId = it.item || it.itemId;
        var lid = it.id != null ? it.id : it.lootId;
        var d = dist(pl.x, pl.y, it.x, it.y);

          if (!lootFilterOk(g.P, itemId)) return;

          }
        }
      });

    ServerBus.on('ack', function (p) {
      if (p && p.ok === false && p.why) {
        if (/khong du|het luot|qua xa|that bai/i.test(p.why)) {
          klog('[Mạng] Máy chủ từ chối: ' + p.why);
        }
      }
    });
  }

  // Khởi động hook mạng ngay lập tức
  installNetHooks();
  initServerPacketListeners();

  /* ================= Bản đồ cổng ================= */
  function mapGraph(P) {
    P = P || (typeof window !== 'undefined' && (window.PNTT || (typeof unsafeWindow !== 'undefined' && unsafeWindow.PNTT)));
    var MD = (P && P.MapData) || {};
    var mdKeys = Object.keys(MD);
    if (st.graph && Object.keys(st.graph).length >= mdKeys.length && mdKeys.length > 0) return st.graph;
    var out = {};
    mdKeys.forEach(function (k) {
      var m = MD[k];
      if (m && typeof m === 'object' && typeof m.id === 'string' && Array.isArray(m.portals) && !out[m.id]) {
        out[m.id] = { id: m.id, name: m.name || m.id, portals: m.portals.slice() };
      }
    });
    // Không tính Truyền Tống Trận vào đường đi: trận đang không chuyển được, chỉ đi qua cổng thường.
    // (Vẫn né trận trong portalZones để khỏi đứng lên.)
    if (Object.keys(out).length) st.graph = out;
    return st.graph || out;
  }

  function mapName(id) {
    var P = window.PNTT, node = P && mapGraph(P)[id];
    return node ? node.name : id;
  }

  // BFS theo số lần qua cổng; trả về map kế tiếp phải bước sang.
  function nextHop(graph, from, to) {
    if (from === to) return to;
    var prev = {}, q = [from];
    prev[from] = null;
    while (q.length) {
      var cur = q.shift(), node = graph[cur];
      if (!node) continue;
      for (var i = 0; i < node.portals.length; i++) {
        var nx = node.portals[i].toMap;
        if (!nx || nx in prev) continue;
        prev[nx] = cur;
        if (nx === to) {
          var step = to;
          while (prev[step] !== from) step = prev[step];
          return step;
        }
        q.push(nx);
      }
    }
    return null;
  }

  /* ================= Đi bộ ================= */
  function walkTo(g, x, y) {
    var me = g.me;
    var same = st.routeTo && dist(st.routeTo.x, st.routeTo.y, x, y) < 8;
    if (same && me.path && me.path.length && now() - st.lastRoute < 2500) return true;
    var C = g.P.CONFIG.PLAYER;
    var path = g.P.Pathfinder.route(g.sw.map, me.x, me.y, x, y, C.HITBOX_W / 2, C.HITBOX_H);
    st.lastRoute = now();
    st.routeTo = { x: x, y: y };
    if (!path || !path.length) return false;
    if (me.state === 'sit') g.P.Player.stand(me);
    me.setPath(path);
    return true;
  }

  function portalTarget(g, toMap) {
    var T = g.P.CONFIG.TILE, me = g.me, list = [];
    var node = mapGraph(g.P)[g.mapId];
    (node ? node.portals : g.sw.map.data.portals || []).forEach(function (p) {
      if (p.toMap !== toMap) return;
      var x = (p.tx + 0.5) * T, y = (p.ty + 0.5) * T;
      list.push({ x: x, y: y, d: dist(me.x, me.y, x, y), pad: !!p.pad });
    });
    list.sort(function (a, b) { return a.d - b.d; });
    return list;
  }

  function startTravel(map, x, y, why, khu) {
    var sw0 = window.PNTT && window.PNTT.SceneWorld;
    if (sw0 && (sw0.fishing || sw0.fishingAuto) && sw0.stopFishing) sw0.stopFishing(); // đang câu thì không đi được: thôi câu
    st.travel = { map: map, x: x, y: y, khu: khu || 0, fails: 0 };
    st.lastMoveAt = now();
    st.routeTo = null;
    say(why || 'Đi tới ' + mapName(map));
  }

  function stopTravel(msg) {
    var t = st.travel;
    st.travel = null;
    st.routeTo = null;
    if (msg) say(msg);
    if (msg && t && /Không|Kẹt/.test(msg)) klog('[Đi đường] ' + msg + ' (đang đi tới ' + mapName(t.map) + ')');
  }

  function tickTravel(g) {
    var t = st.travel;
    if (!t) return false;
    var me = g.me;
    if (g.P.Input.hasManualMove()) { stopTravel('Bạn tự điều khiển → huỷ đi đường'); return false; }
    if (now() < (st.wbLootUntil || 0) && g.mapId === (st.wbLootPos && st.wbLootPos.map)) {
      // Đang trong 25s chờ bốc thăm quà boss thế giới: giữ chân ở map boss
      return false;
    }
    if (g.mapId !== t.map && !t.rush && lootBeforeLeave(g)) { st.lastMoveAt = now(); st.routeTo = null; return true; }

    // Đứng yên quá lâu thì tính lại đường; ba lần liền vẫn kẹt thì bỏ.
    if (!st.lastPos || dist(st.lastPos.x, st.lastPos.y, me.x, me.y) > 4) {
      st.lastPos = { x: me.x, y: me.y };
      st.lastMoveAt = now();
    } else if (now() - st.lastMoveAt > 4000) {
      st.lastMoveAt = now();
      st.routeTo = null;
      if (++t.fails >= 3) { stopTravel('Kẹt đường, dừng (có thể map bị khoá cảnh giới)'); return false; }
    }

    setAuto(g, false);
    if (g.mapId === t.map) {
      if (t.x == null || dist(me.x, me.y, t.x, t.y) <= 40) { stopTravel('Đã tới nơi'); return false; }
      if (!walkTo(g, t.x, t.y)) { stopTravel('Không tìm được đường tới điểm đích'); return false; }
      return true;
    }
    var hop = nextHop(mapGraph(g.P), g.mapId, t.map);
    if (!hop) { stopTravel('Không có đường cổng từ map này tới ' + mapName(t.map)); return false; }
    var targets = portalTarget(g, hop);
    if (targets && targets.pad && targets.d < 24) {
      // Đang đứng trên trận, chờ game đếm xong — không tính là kẹt.
      st.lastMoveAt = now();
      return true;
    }
    for (var i = 0; i < targets.length; i++) {
      if (walkTo(g, targets[i].x, targets[i].y)) return true;
    }
    stopTravel('Không tới được cổng sang ' + mapName(hop));
    return false;
  }

  // Về chỗ cũ sau một việc (đánh boss, săn hồn, chăm vườn, Dược Công). Đi về một lần là chưa đủ: gục
  // rồi gượng dậy (hồi sinh xoá đường đi), kẹt đường, bị quái chen ngang… thì vẫn đi lại tới khi tới nơi.
  // Đồng thời tự động ghi nhớ và đổi về đúng số Khu cũ (nếu map có chia nhiều khu).
  var BACK_RETRY_MS = 3000, BACK_TRIES = 8, BACK_NEAR = 80;
  function goBack(map, x, y, why, kind, khu) {
    if (!map || (cfg.planRun && enabled)) return; // lịch tự về chỗ farm khi xong hết việc
    if (map && typeof map === 'object') {
      khu = map.khu;
      why = x;
      kind = y;
      y = map.y;
      x = map.x;
      map = map.map;
    }
    var targetKhu = khu || (st.back && st.back.khu) || 0;
    st.back = {
      map: map, x: x, y: y, khu: targetKhu, why: why, kind: kind || '',
      tries: 1, retryAt: now() + BACK_RETRY_MS,
      khuWant: 0, khuAt: 0, touches: 0, touchAt: 0, routeAt: 0, khuDone: false, khuFail: false
    };
    startTravel(map, x, y, why, targetKhu);
  }
  // Việc mới bắt đầu giữa đường về: nhận luôn chỗ cũ làm chỗ về của việc mới (kèm số Khu).
  function takeBack(g) {
    var b = st.back;
    st.back = null;
    g = g || game();
    var curMap = (g && g.mapId) || '';
    var curX = (g && g.me && g.me.x != null) ? g.me.x : 0;
    var curY = (g && g.me && g.me.y != null) ? g.me.y : 0;
    var k = (cfg.farm && cfg.farm.map === curMap && cfg.farm.khu) ? cfg.farm.khu : (g && g.P ? gaKhu(g.P) : 1);
    return b ? { map: b.map, x: b.x, y: b.y, khu: b.khu || k } : { map: curMap, x: curX, y: curY, khu: k };
  }
  function tickGoBack(g) {
    var b = st.back;
    if (!b || st.bh || st.bd || st.xc || st.td || st.hon || st.fa || st.dc || st.ga || now() < (st.wbLootUntil || 0)) return false;
    if (g.P.Input.hasManualMove()) { st.back = null; say('Bạn tự điều khiển → thôi về chỗ cũ'); return false; }

    var P = g.P;
    var soKhu = gaSoKhu(P);
    var curKhu = gaKhu(P);

    // 1) Khi đã về tới đúng map đích: kiểm tra số khu nếu cần đổi lại khu cũ
    if (g.mapId === b.map) {
      if (b.khuWant && curKhu === b.khu) {
        b.khuDone = true;
        b.khuWant = 0;
        klog('[Về chỗ] Đã đổi sang khu ' + b.khu + ' thành công');
      }
      var needKhu = b.khu && b.khu > 0 && soKhu > 1 && curKhu !== b.khu && !b.khuDone && !b.khuFail;
      if (needKhu) {
        if (st.travel) stopTravel();
        b.khuWant = b.khu;
        var busyKhu = khuGo(g, b, '[Về chỗ]');
        if (busyKhu) return true;
        // khuGo đã xong hoặc không tìm được Bảng Khu / lỗi
        if (gaKhu(P) === b.khu) {
          b.khuDone = true;
          b.khuWant = 0;
          klog('[Về chỗ] Đã đổi sang khu ' + b.khu + ' thành công');
        } else {
          b.khuFail = true;
          b.khuWant = 0;
          klog('[Về chỗ] Không sang được khu ' + b.khu + ' (bảng lỗi / khu đầy) → ở lại khu ' + curKhu + ' farm tiếp');
        }
      }

      // 2) Đã đúng khu (hoặc map chỉ 1 khu / đã thử đổi xong): kiểm tra cự ly bãi farm
      var d = (b.x != null && b.y != null) ? dist(g.me.x, g.me.y, b.x, b.y) : 0;
      if (d <= BACK_NEAR) {
        var finK = gaKhu(P);
        st.back = null;
        if (st.travel) stopTravel();
        say('Đã về chỗ farm' + (soKhu > 1 ? ' khu ' + finK : '') + ' → farm tiếp');
        klog('[Về chỗ] Đã về đúng bãi farm ' + mapName(b.map) + (soKhu > 1 ? ' khu ' + finK : '') + ' (' + Math.round(g.me.x) + ', ' + Math.round(g.me.y) + ')');
        setAuto(g, true);
        return false;
      }
    }

    // 3) Chưa tới map hoặc đang ở map nhưng còn cách bãi farm > BACK_NEAR (sau khi đổi khu)
    if (!st.travel || st.travel.map !== b.map) {
      if (now() < b.retryAt) return true;
      if (++b.tries > BACK_TRIES) { st.back = null; say('Về chỗ farm ' + BACK_TRIES + ' lần không được → ở lại đây'); return false; }
      b.retryAt = now() + BACK_RETRY_MS;
      startTravel(b.map, b.x, b.y, b.why + ' (thử lại lần ' + b.tries + ')', b.khu);
    }
    tickTravel(g);
    return true;
  }

  // Việc đang dở (kể cả lúc phần riêng của việc đó đang chờ / tạm nghỉ trong nhịp này): Giữ bãi và "về chỗ farm" của
  // Lịch không được kéo nhân vật về bãi, nếu không hai bên giành nhau (chạy ra Bảng Khu đổi khu, đi câu, đi Vết Nứt…).
  function jobBusy(g) {
    return st.fk ? 'đổi khu' : st.fish ? 'câu cá' : st.fa ? 'chăm vườn' : st.dc ? 'Dược Công' : st.ga ? 'nhặt nguyên liệu' : st.hon ? 'săn hồn' :
      st.td ? 'Thương Đội' : st.bd ? 'biến dị' : st.xc ? 'xổng chuồng' : st.bh ? 'boss' : st.vn ? 'Vết Nứt' : st.ll || st.llOpen ? 'Lãm Làng' :
        st.ht ? 'Sỹ Sách Điện' : st.tl ? 'Tam Lộ' : st.vt || vtActive(g) ? 'Vận Tiêu' : st.sn ? 'NV tông môn' : st.honBuy ? 'mua đồ Hồn Phiên' :
          st.ct ? 'cướp tiêu' : st.tq ? 'Giai đoạn 36' : st.hl || (g.P.ChienTruong && g.mapId === g.P.ChienTruong.MAP) ? 'Chiến Trường' : st.contest ? 'tranh đồ' : st.looting ? 'nhặt đồ' : st.back ? 'đang về chỗ cũ' : st.dd ? 'điểm danh' : st.gc ? 'Tàng Kinh' : st.harvest ? 'thu hái' : '';
  }
  function tickStayFarm(g) {
    var f = cfg.farm;
    if (!cfg.stayFarm || !f || st.travel || cfg.dcRun || cfg.gatherRun || jobBusy(g) || (cfg.planRun && st.plan && st.plan.job)) return;

    // Người chơi vừa tự điều khiển (trong 15s): không giật ngược lại bãi
    var manualRecent = (now() - (st.lastManualAt || 0)) < 15000;
    if (manualRecent) return;

    // Người chơi chủ động sang map khác (hoặc bấm Đi bộ tới): tạm ngưng giữ bãi cũ để người chơi tự do
    if (g.mapId !== f.map) {
      if ((now() - (st.lastManualAt || 0)) < 45000 || st.travelManual) {
        if (!st.stayFarmPaused) {
          st.stayFarmPaused = true;
          say('Bạn vừa di chuyển sang ' + mapName(g.mapId) + ' → tạm dừng giữ bãi cũ. Bấm "Lưu chỗ này" nếu muốn đổi bãi farm.');
          klog('Tạm ngưng giữ bãi ' + f.name + ' do người chơi tự sang ' + mapName(g.mapId));
        }
        return;
      }
      if (st.stayFarmPaused) return;
      startTravel(f.map, f.x, f.y, 'Quay về bãi ' + f.name, f.khu);
      return;
    }

    // Đang ở đúng map: nếu đã quay về trong phạm vi bãi thì tự động mở lại giữ bãi
    var d = dist(g.me.x, g.me.y, f.x, f.y);
    if (d <= cfg.farmRadius) {
      st.stayFarmPaused = false;
      st.travelManual = false;
    }
    if (st.stayFarmPaused) return;

    if (f.khu && gaSoKhu(g.P) > 1 && gaKhu(g.P) !== f.khu && !st.fk) {
      fkStart('sai khu bãi farm');
      if (st.fk) st.fk.want = f.khu;
    }
    else if (d > cfg.farmRadius) startTravel(f.map, f.x, f.y, 'Ra khỏi bãi → quay lại', f.khu);
  }

  /* ================= Né chiêu ================= */
  // Vùng nổ có hình báo trước trong VFX.list (game vẽ elip R × R/2 → đo trục dọc nhân 2).
  var DODGE_FX = { luutinhbao: 'Lưu tinh', tahoabao: 'Tà hoả', nhentobao: 'Phún Tơ (trói 10s)' };
  // Chiêu boss báo trước bằng điểm rơi (Tà Hoả, Lưu Tinh / Ngọc Châm Vũ / Tử Diễm, Phún Tơ của Nhện Bạch Ngọc…):
  var fxHaz = [];
  // circle: vùng tròn đủ bán kính (chưa rõ máy chủ xét elip hay tròn thì lấy tròn cho chắc — Yên Lãng).
  function fxNote(pts, sec, r, what, circle) {
    if (!Array.isArray(pts) || !(r > 0)) return;
    var until = now() + Math.max(0.3, +sec || 1.5) * 1000;
    pts.forEach(function (p) { if (p && isFinite(p.x) && isFinite(p.y)) fxHaz.push({ x: +p.x, y: +p.y, R: +r, until: until, what: what, circ: !!circle }); });
    if (fxHaz.length > 80) fxHaz.splice(0, fxHaz.length - 80);
  }
  function hookBossFx(P) {
    var V = P.VFX, B = P.BossBiTich;
    function wrap(o, k, what, unitMs) {
      if (!o || typeof o[k] !== 'function' || o[k]._tt) return;
      var f = o[k];
      o[k] = function (pts, w, r) { try { fxNote(pts, unitMs ? w / 1000 : w, r, what); } catch (e) { } return f.apply(this, arguments); };
      o[k]._tt = true;
    }
    wrap(V, 'spawnTaHoaBao', 'Tà hoả');
    wrap(V, 'spawnLongLuuTinh', 'Lưu tinh');
    wrap(V, 'spawnNhenTo', 'Phún Tơ (trói 10s)');
    wrap(B, 'vong', 'Chiêu boss', true);
    // Kim Quang Cự Kiếm (Tà Soái Lãm Làng) khoá đúng mình: chạy không thoát, phải đỡ bằng giáp.
    var K = P.KimKiemFX;
    if (K && typeof K.spawn === 'function' && !K.spawn._tt) {
      var ks = K.spawn;
      K.spawn = function (from, to, o) {
        try { if (o && o.ghost === false) st.kimKiemAt = now(); } catch (e) { }
        return ks.apply(this, arguments);
      };
      K.spawn._tt = true;
    }
  }

  var BODY_R = 12;   // nửa thân người, cộng vào bán kính trúng đạn
  var BOLT_DY = 14;  // đạn bay ngang ngực, bóng dưới đất thấp hơn chừng này

  // Mọi vùng chiêu sắp trúng. Mỗi vùng là đoạn thẳng (x,y)→(x2,y2) dày r; vùng tròn có hai đầu
  // trùng nhau. t = giây còn lại tới lúc nổ (nếu biết), what = tên đòn để ghi log.
  function hazards(g) {
    var out = [];
    function add(x, y, r, x2, y2, t, what, ex) {
      if (!isFinite(x) || !isFinite(y) || !(r > 0)) return;
      if (!isFinite(x2) || !isFinite(y2)) { x2 = x; y2 = y; }
      var h = { x: +x, y: +y, x2: +x2, y2: +y2, r: r + cfg.dodgeMargin, core: r, t: t, what: what };
      if (ex) { if (ex.sy) h.sy = ex.sy; if (ex.hole > 0) h.hole = ex.hole; }
      out.push(h);
    }
    (g.sw.enemies || []).forEach(function (e) {
      var d = e && !e.dead && e.def;
      if (!d) return;
      var who = d.name ? ' của ' + d.name.split('·')[0].trim() : '';
      if (e.novaWind > 0 && d.fireNova) {
        var isWb = isWorldBoss(g, e);
        // Boss World (như Xích Long) phun Hỏa trận liên tục mỗi 2.4s (chỉ 90 dmg): không né để dồn 100% DPS
        if (!isWb || (d.fireNova.dmg || 0) > 300) {
          add(e.novaX, e.novaY, d.fireNova.radius, null, null, e.novaWind, 'Hoả trận' + who);
        }
      }
      if (e.tcWind > 0 && d.tuyetChieu) add(e.tcX, e.tcY, d.tuyetChieu.radius, null, null, e.tcWind, (d.tuyetChieu.ten || 'Tuyệt chiêu') + who);
      if (e.pounceWind > 0 && d.pounce) add(e.pounceX, e.pounceY, d.pounce.radius, null, null, e.pounceWind, 'Vồ' + who);
    });
    bossTacticHazards(g, add);
    var fx = g.P.VFX && g.P.VFX.list;
    if (fx) fx.forEach(function (f) { if (f && DODGE_FX[f.type] && f.life > 0) add(f.x, f.y, f.R, null, null, f.life, DODGE_FX[f.type], { sy: 2 }); });
    var tn = now();
    fxHaz = fxHaz.filter(function (h) { return h.until > tn; });
    fxHaz.forEach(function (h) { add(h.x, h.y, h.R, null, null, (h.until - tn) / 1000, h.what, h.circ ? null : { sy: 2 }); });
    if (cfg.dodgePlayers) playerHazards(g, add);
    return out;
  }

  // Chiêu người khác: chỉ lấy chiêu chưa nổ, không nhắm vào quái.
  // Chiêu khoá mục tiêu vào chính mình thì đi đâu cũng bám theo nên bỏ qua.
  function playerHazards(g, add) {
    var S = g.P.Skills, me = g.me;
    if (!S) return;
    var mobs = g.sw.enemies || [];
    function aimedAtMob(t) { return !!t && mobs.indexOf(t) >= 0; }
    (S.grounds || []).forEach(function (r) {
      if (!r || !r.ghost || r.fired || r.waiting || !r.def) return;
      if (r.target === me || aimedAtMob(r.target)) return;
      add(r.x, r.y, r.def.blastR, null, null, (r.delay || 0) - (r.t || 0), r.def.short || r.def.name);
    });
    (S.auras || []).forEach(function (r) {
      if (!r || !r.ghost || r.fired || !r.def || aimedAtMob(r.target)) return;
      var o = r.owner || r;
      add(o.x, o.y, r.def.blastR, null, null, (r.delay || 0) - (r.t || 0), r.def.short || r.def.name);
    });
    (S.bolts || []).forEach(function (b) {
      if (!b || !b.ghost || !b.def || aimedAtMob(b.target)) return;
      if (b.guided && b.target === me) return;
      var v = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (!(v > 0)) return;
      var left = Math.max(0, (b.maxTravel || b.def.range || 0) - (b.travel || 0));
      var x = b.x, y = b.y + BOLT_DY;
      add(x, y, (b.def.hitR || 8) + (b.def.blastR || 0) + BODY_R, x + b.vx / v * left, y + b.vy / v * left,
        dist(x, y, me.x, me.y) / v, b.def.short || b.def.name);
    });
  }

  // sy: vùng vẽ nghiêng (game đo trục dọc nhân sy, vòng tròn thành elip dẹt) → đo trong hệ đã giãn trục dọc.
  function segDist(h, x, y) {
    var sy = h.sy || 1, y2 = h.y + (h.y2 - h.y) * sy, py = h.y + (y - h.y) * sy;
    var dx = h.x2 - h.x, dy = y2 - h.y, len = dx * dx + dy * dy;
    var t = len ? Math.max(0, Math.min(1, ((x - h.x) * dx + (py - h.y) * dy) / len)) : 0;
    return dist(h.x + dx * t, h.y + dy * t, x, py);
  }

  // hole: vành khuyên — đứng trong lõi (bán kính hole) là an toàn.
  function inHazard(list, x, y) {
    for (var i = 0; i < list.length; i++) {
      var d = segDist(list[i], x, y);
      if (d < list[i].r && !(list[i].hole && d < list[i].hole)) return true;
    }
    return false;
  }

  // Chiêu boss có cảnh báo (BossTactics: Xích Mãng Vương, Thạch Mạch Vương, U Minh Cự Mãng…): đường thẳng / vòng …
  function bossTacticHazards(g, add) {
    var BT = g.P.BossTactics;
    (g.sw.enemies || []).forEach(function (e) {
      if (!e || e.dead || !e.def) return;
      var who = e.def.name ? ' của ' + e.def.name.split('·')[0].trim() : '';
      var mv = BT && BT.move && e.ctWind > 0 ? BT.move(e) : null;
      if (mv && isFinite(e.ctX) && isFinite(e.ctY)) {
        if (mv.shape === 'line') {
          var a = (e.ctAngle || 0) / 1000, c = Math.cos(a), sn = Math.sin(a);
          add(e.ctX, e.ctY, mv.width, e.ctX + c * mv.length, e.ctY + sn * mv.length / 2, e.ctWind, mv.name + who, { sy: 2 });
        } else {
          add(e.ctX, e.ctY, mv.radius, null, null, e.ctWind, mv.name + who,
            { sy: 2, hole: mv.shape === 'ring' ? Math.max(0, (mv.inner || 0) - cfg.dodgeMargin) : 0 });
        }
      }
      var bk = e.def.baoKich;
      if (bk && !(e.def.tranMach && !cfg.tmTru) && e._ttBkAt) {
        var isWb = isWorldBoss(g, e);
        // Với Boss thế giới: chỉ né bạo kích nếu máu nhân vật đang thấp (<= 45%)
        if (!isWb || (g.me && g.me.hpMax > 0 && g.me.hp / g.me.hpMax <= 0.45)) {
          var left = ((bk.hitsMax || 4) * (bk.gap || 0.55) + 0.4) - (now() - e._ttBkAt) / 1000;
          if (left > 0) add(e.x, e.y, bk.radius || 160, null, null, 0, (bk.ten || 'Bạo Kích') + who);
        }
      }
    });
  }

  /* ================= Trụ bắn (Trấn Sơn Bia, trụ Lâm Lang / Hư Thiên) ================= */
  // Trụ không cắn (contactDmg 0) nên các phần khác coi nó vô hại, nhưng cứ mỗi NHIP_MS nó bắn một …
  var TOWER_PAD = 24;        // px chừa ngoài tầm bắn của trụ
  var TOWER_TAM = 220;       // tầm mặc định khi game không cho số
  function towerSpec(P, m) {
    var t = m && m.type, src = null;
    if (t === 'yl_tran_son_bia' && P.YenLang) src = P.YenLang.BIA_BAN;
    else if ((t === 'htd_tru_bang' || t === 'htd_tru_hoa') && P.HuThien) src = P.HuThien.TRU_BAN;
    else if (P.LamLang) src = P.LamLang.TRU_BAN;
    return { tam: src && src.TAM || TOWER_TAM, nhip: src && src.NHIP_MS || 1500 };
  }
  function isTower(m) { return !!(m && m.def && m.def.truBan && !m.dead); }
  // Các trụ còn sống thành vùng {x,y,x2,y2,r}; except: trụ đang là mục tiêu thì không tính.
  function towerZones(g, except) {
    var out = [];
    (g.sw.enemies || []).forEach(function (m) {
      if (!isTower(m) || m === except) return;
      var sp = towerSpec(g.P, m);
      out.push({
        x: m.x, y: m.y, x2: m.x, y2: m.y, r: sp.tam + TOWER_PAD, tower: m, tam: sp.tam,
        name: (m.def.name || 'Trụ').split('·')[0].trim()
      });
    });
    return out;
  }
  // Trụ cần tránh lúc này: mọi trụ trừ cái đang bị mình đánh.
  function towerAvoid(g) {
    var t = kiteTarget(g);
    return towerZones(g, isTower(t) ? t : null);
  }

  // Đứng trong tầm trụ mà không đánh trụ đó: ra ngoài tầm. Quái đang đuổi sẽ theo ra, thành ra
  // kéo được quái ra khỏi tầm trụ. Mục tiêu đứng yên trong tầm trụ thì thôi (đằng nào cũng phải vào).
  var TOWER_EXIT_REPLAN_MS = 1500;
  function tickTowerExit(g) {
    var me = g.me, zones = towerAvoid(g);
    var inside = zones.filter(function (z) { return dist(me.x, me.y, z.x, z.y) < z.r; });
    if (!inside.length) { st.towerOut = null; return false; }
    var t = kiteTarget(g);
    var follows = !t || t.state === 'chase' || t.state === 'attack' || !inHazard(zones, t.x, t.y);
    if (!follows) return false;
    var cur = st.towerOut;
    if (cur && me.path && me.path.length && now() - cur.at < TOWER_EXIT_REPLAN_MS && !inHazard(zones, cur.to.x, cur.to.y)) return true;
    var hz = hazards(g), out = function (x, y) { return !inHazard(zones, x, y) && !inHazard(hz, x, y); };
    var r = planEscape(g, threatsOf(g), out, { radius: 20, avoid: hz, wT: 1, wO: 1.2, wM: 0.4 }) ||
      escapePath(g, zones.concat(hz), 520, 24);
    if (!r) return false;
    moveFighting(g, r.path);
    st.towerOut = { to: r.to, at: now() };
    klog('Đang trong tầm ' + inside[0].name + ' (' + inside[0].tam + 'px) mà không đánh nó → ra ngoài ' +
      Math.round(dist(me.x, me.y, r.to.x, r.to.y)) + 'px' + (t && !isTower(t) ? ', kéo ' + (t.def ? mobLabel(t) : 'địch') + ' theo' : ''));
    return true;
  }

  // Tìm chỗ thoát ra ngoài mọi vùng trong list. Chỉ lấy điểm đứng được (không phải tường, …
  var OPEN_R = 48;      // bán kính đo độ thoáng quanh chỗ đứng
  var OPEN_COST = 20;   // mỗi hướng bị chặn quanh chỗ đứng tính như đi xa thêm chừng này px

  // Cổng / cổng chuyển cảnh kích hoạt khi chân đứng đúng ô đó; Truyền Tống Trận là vòng tròn
  // lớn tự đếm rồi chuyển map. Né hay lùi mà giẫm vào là bị đưa sang map khác.
  var PORTAL_R = 1.3;   // ô, quanh cổng / cổng chuyển cảnh
  var PAD_R = 2.6;      // ô, quanh Truyền Tống Trận

  function portalZones(g) {
    var map = g.sw.map, T = g.P.CONFIG.TILE || 32, out = [];
    function add(tx, ty, r) {
      var x = (tx + 0.5) * T, y = (ty + 0.5) * T;
      out.push({ x: x, y: y, x2: x, y2: y, r: r * T });
    }
    (map.portals || []).forEach(function (p) { add(p.tx, p.ty, PORTAL_R); });
    (map.warps || []).forEach(function (p) { add(p.tx, p.ty, PORTAL_R); });
    var TT = g.P.TruyenTong;
    if (TT && TT.PADS) TT.PADS.forEach(function (p) { if (p.map === g.mapId) add(p.tx, p.ty, PAD_R); });
    return out;
  }

  // Đường đi (từ chỗ đứng qua các điểm) có cắt vào vùng nào trong list không.
  function pathCrosses(g, path, list) {
    var px = g.me.x, py = g.me.y;
    for (var i = 0; i < path.length; i++) {
      var seg = { x: px, y: py, x2: path[i].x, y2: path[i].y };
      for (var j = 0; j < list.length; j++) {
        // khoảng cách từ tâm vùng tới đoạn đi = khoảng cách từ đoạn tới tâm
        if (segDist(seg, list[j].x, list[j].y) < list[j].r) return true;
      }
      px = path[i].x; py = path[i].y;
    }
    return false;
  }

  // Kiểm tra chỗ đứng: trong bản đồ, không phải tường, không dính cổng; route() thì kiểm tra
  // đúng điểm cuối của đường đi thật và đường đi không cắt ngang cổng.
  function spotCheck(g) {
    var me = g.me, map = g.sw.map, C = g.P.CONFIG.PLAYER, T = g.P.CONFIG.TILE || 32;
    var hw = C.HITBOX_W / 2, hh = C.HITBOX_H;
    // Đang đứng sẵn trong vùng cổng (vd. vừa qua cổng) thì không chặn đường ra khỏi đó.
    var portals = portalZones(g).filter(function (p) { return dist(p.x, p.y, me.x, me.y) >= p.r; });
    return {
      portals: portals,
      standable: function (x, y) {
        if (x < 0 || y < 0 || (map.pxWidth && x >= map.pxWidth) || (map.pxHeight && y >= map.pxHeight)) return false;
        if (inHazard(portals, x, y)) return false;
        return !map.rectBlocked || !map.rectBlocked(x - hw, y - hh, x + hw, y + hh);
      },
      crossesPortal: function (path) { return portals.length > 0 && pathCrosses(g, path, portals); },
      route: function (x, y) {
        var path = g.P.Pathfinder.route(map, me.x, me.y, x, y, hw, hh);
        if (!path || !path.length) return null;
        var end = path[path.length - 1];
        if (dist(end.x, end.y, x, y) > T || this.crossesPortal(path)) return null;
        return { to: { x: end.x, y: end.y }, path: path };
      }
    };
  }

  function escapePath(g, list, maxD, step) {
    var me = g.me, sc = spotCheck(g), portals = sc.portals, standable = sc.standable;
    function free(x, y) { return standable(x, y) && !inHazard(list, x, y); }
    var spots = [];
    for (var d = step; d <= maxD; d += step) {
      for (var i = 0; i < 24; i++) {
        var a = i / 24 * Math.PI * 2, x = me.x + Math.cos(a) * d, y = me.y + Math.sin(a) * d;
        if (!free(x, y)) continue;
        if (portals.length && pathCrosses(g, [{ x: x, y: y }], portals)) continue;
        var open = 0;
        for (var j = 0; j < 8; j++) {
          var b = j / 8 * Math.PI * 2;
          if (free(x + Math.cos(b) * OPEN_R, y + Math.sin(b) * OPEN_R)) open++;
        }
        spots.push({ x: x, y: y, score: d + (8 - open) * OPEN_COST });
      }
    }
    spots.sort(function (p, q) { return p.score - q.score; });
    for (var k = 0; k < spots.length && k < 12; k++) {
      var r = sc.route(spots[k].x, spots[k].y);
      if (r && !inHazard(list, r.to.x, r.to.y)) return r;
    }
    return null;
  }

  /* ================= Tìm đường thoát nhiều bước ================= */
  // Lưới ô quanh mình (Dijkstra): chỉ qua ô mình tới trước địch, chọn đích gần, thoáng, tới trước địch lâu nhất.
  var PLAN_R = 12;          // ô quanh mình được tính (lùi / thoát vây)
  var PASS_MARGIN = 0.15;   // giây: chỉ đi qua ô mình tới trước địch ít nhất chừng này
  var OPEN_CELLS = 2;       // ô: bán kính đo độ thoáng quanh chỗ đứng
  var MARGIN_CAP = 3;       // giây: tới trước địch lâu hơn thế không cộng thêm điểm
  var THREAT_SCAN = 480;    // px: địch xa hơn không tính vào thời gian tới

  function tileFree(g, sc, tx, ty) {
    var map = g.sw.map, T = g.P.CONFIG.TILE || 32;
    var W = map.width || Math.ceil((map.pxWidth || 0) / T), H = map.height || Math.ceil((map.pxHeight || 0) / T);
    if (tx < 0 || ty < 0 || (W && tx >= W) || (H && ty >= H)) return false;
    if (map.isBlockedTile && map.isBlockedTile(tx, ty)) return false;
    return !inHazard(sc.portals, (tx + 0.5) * T, (ty + 0.5) * T);
  }

  // Độ thoáng của một chỗ đứng, 0..1: nửa là khoảng cách tới tường gần nhất (tới CLEAR_CAP ô), …
  var CLEAR_CAP = 4;        // ô: cách tường từ chừng này trở lên coi là giữa bãi
  function roomScore(clear, freeFrac) { return 0.5 * Math.min(clear, CLEAR_CAP) / CLEAR_CAP + 0.5 * freeFrac; }

  function openAt(g, sc, x, y) {
    var T = g.P.CONFIG.TILE || 32, tx = Math.floor(x / T), ty = Math.floor(y / T), open = 0, n = 0, clear = CLEAR_CAP;
    for (var dy = -CLEAR_CAP; dy <= CLEAR_CAP; dy++) {
      for (var dx = -CLEAR_CAP; dx <= CLEAR_CAP; dx++) {
        if (!dx && !dy) continue;
        var ring = Math.max(Math.abs(dx), Math.abs(dy)), ok = tileFree(g, sc, tx + dx, ty + dy);
        if (!ok && ring <= clear) clear = ring - 1;
        if (ring <= OPEN_CELLS) { n++; if (ok) open++; }
      }
    }
    return roomScore(clear, open / n);
  }

  function threatsOf(g) {
    var me = g.me, C = g.P.CONFIG.PLAYER, out = [];
    mobsAlive(g).forEach(function (m) {
      if (!(m.def.contactDmg > 0) || dist(me.x, me.y, m.x, m.y) > THREAT_SCAN) return;
      var v = (m.def.speed || 40) * (m.slowT > 0 && m.slowMult ? m.slowMult : 1);
      if (m.stunT > 0 || m.freezeT > 0) v *= 0.3;
      out.push({ x: m.x, y: m.y, reach: mobBaseReach(g, m), v: Math.max(1, v) });
    });
    hostilePlayers(g).forEach(function (r) {
      if (dist(me.x, me.y, r.x, r.y) > THREAT_SCAN) return;
      out.push({ x: r.x, y: r.y, reach: enemyReach(g, r), v: C.SPEED * (C.RUN_MULT || 1) });
    });
    return out;
  }

  // goal(x, y): ô đích hợp lệ. opt: radius (ô), maxTime (giây, giới hạn quãng đi), avoid (vùng
  // cấm thêm), wT / wO / wM: trọng số thời gian đi, độ thoáng, khoảng tới trước địch.
  function planEscape(g, threats, goal, opt) {
    var me = g.me, map = g.sw.map, P = g.P, T = P.CONFIG.TILE || 32, C = P.CONFIG.PLAYER;
    var v = Math.max(1, (me.speed || C.SPEED) * (P.Input.run ? C.RUN_MULT || 1 : 1));
    var R = opt.radius || PLAN_R, S = 2 * R + 1, N = S * S;
    var ptx = Math.floor(me.x / T), pty = Math.floor(me.y / T), ox = ptx - R, oy = pty - R;
    var sc = spotCheck(g), avoid = opt.avoid || [];
    var freeC = new Int8Array(N), cost = new Float64Array(N), par = new Int32Array(N), done = new Uint8Array(N);
    for (var q = 0; q < N; q++) { cost[q] = Infinity; par[q] = -1; }
    function at(tx, ty) { var lx = tx - ox, ly = ty - oy; return lx < 0 || ly < 0 || lx >= S || ly >= S ? -1 : ly * S + lx; }
    function free(tx, ty) {
      var i = at(tx, ty);
      if (i < 0) return false;
      if (!freeC[i]) freeC[i] = tileFree(g, sc, tx, ty) ? 1 : 2;
      return freeC[i] === 1;
    }
    function center(i) { return { x: (ox + i % S + 0.5) * T, y: (oy + (i / S | 0) + 0.5) * T }; }
    // Khoảng cách tới tường của mọi ô trong lưới: loang từ các ô bị chặn ra (BFS 8 hướng).
    var clr = new Int8Array(N), wave = [];
    for (var q2 = 0; q2 < N; q2++) {
      if (free(ox + q2 % S, oy + (q2 / S | 0))) clr[q2] = CLEAR_CAP; else { clr[q2] = 0; wave.push(q2); }
    }
    for (var h = 0; h < wave.length; h++) {
      var wi = wave[h], wc = clr[wi] + 1;
      if (wc >= CLEAR_CAP) continue;
      var wx = wi % S, wy = wi / S | 0;
      for (var ey = -1; ey <= 1; ey++) {
        for (var ex = -1; ex <= 1; ex++) {
          var nx2 = wx + ex, ny2 = wy + ey;
          if (nx2 < 0 || ny2 < 0 || nx2 >= S || ny2 >= S) continue;
          var wj = ny2 * S + nx2;
          if (clr[wj] > wc) { clr[wj] = wc; wave.push(wj); }
        }
      }
    }
    function room(i) {
      var tx = ox + i % S, ty = oy + (i / S | 0), open = 0, n = 0;
      for (var dy = -OPEN_CELLS; dy <= OPEN_CELLS; dy++) {
        for (var dx = -OPEN_CELLS; dx <= OPEN_CELLS; dx++) {
          if (!dx && !dy) continue;
          n++;
          if (free(tx + dx, ty + dy)) open++;
        }
      }
      return roomScore(clr[i], open / n);
    }
    function foeTime(x, y) {
      var t = Infinity;
      for (var k = 0; k < threats.length; k++) {
        var m = threats[k];
        t = Math.min(t, Math.max(0, dist(x, y, m.x, m.y) - m.reach) / m.v);
      }
      return t;
    }
    // Hàng đợi ưu tiên nhỏ theo cost.
    var heap = [];
    function push(i) {
      heap.push(i);
      for (var c = heap.length - 1; c > 0;) {
        var p = (c - 1) >> 1;
        if (cost[heap[p]] <= cost[heap[c]]) break;
        var tmp = heap[p]; heap[p] = heap[c]; heap[c] = tmp; c = p;
      }
    }
    function pop() {
      var top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        for (var c = 0; ;) {
          var l = 2 * c + 1, r = l + 1, m = c;
          if (l < heap.length && cost[heap[l]] < cost[heap[m]]) m = l;
          if (r < heap.length && cost[heap[r]] < cost[heap[m]]) m = r;
          if (m === c) break;
          var tmp = heap[m]; heap[m] = heap[c]; heap[c] = tmp; c = m;
        }
      }
      return top;
    }
    var start = at(ptx, pty), best = -1, bestScore = Infinity, bestInfo = null;
    cost[start] = 0;
    push(start);
    while (heap.length) {
      var i = pop();
      if (done[i]) continue;
      done[i] = 1;
      var tx = ox + i % S, ty = oy + (i / S | 0), c0 = center(i), myT = cost[i] * T / v;
      if (opt.maxTime && myT > opt.maxTime) continue;
      if (i !== start) {
        var ft = foeTime(c0.x, c0.y);
        if (ft - myT < PASS_MARGIN || inHazard(avoid, c0.x, c0.y)) continue; // không đi qua được ô này
        if (goal(c0.x, c0.y)) {
          var open = room(i), lead = Math.min(ft - myT, MARGIN_CAP);
          var score = opt.wT * myT - opt.wO * open - opt.wM * lead;
          if (!(opt.minRoom && open < opt.minRoom) && score < bestScore) {
            bestScore = score; best = i; bestInfo = { open: open, lead: lead, time: myT };
          }
        }
      }
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          var nx = tx + dx, ny = ty + dy;
          if (!free(nx, ny)) continue;
          if (dx && dy && (!free(tx + dx, ty) || !free(tx, ty + dy))) continue; // không cắt góc tường
          var j = at(nx, ny), nc = cost[i] + (dx && dy ? Math.SQRT2 : 1);
          if (nc < cost[j]) { cost[j] = nc; par[j] = i; push(j); }
        }
      }
    }
    if (best < 0) return null;
    var cells = [];
    for (var cc = best; cc !== start && cc >= 0; cc = par[cc]) cells.push(center(cc));
    cells.reverse();
    // Rút gọn đường: nhảy thẳng tới điểm xa nhất còn đi thẳng được mà không lướt qua tầm với địch.
    var hw = C.HITBOX_W / 2, hh = C.HITBOX_H, path = [], fx = me.x, fy = me.y, k = 0;
    function straightOk(ax, ay, b) {
      if (map.lineClear && !map.lineClear(ax, ay, b.x, b.y, hw, hh)) return false;
      var seg = { x: ax, y: ay, x2: b.x, y2: b.y };
      return !threats.some(function (m) { return segDist(seg, m.x, m.y) < m.reach; });
    }
    while (k < cells.length) {
      var far = k;
      for (var jj = cells.length - 1; jj > k; jj--) if (straightOk(fx, fy, cells[jj])) { far = jj; break; }
      path.push(cells[far]);
      fx = cells[far].x; fy = cells[far].y;
      k = far + 1;
    }
    var to = cells[cells.length - 1];
    return { to: to, path: path, open: bestInfo.open, lead: bestInfo.lead, time: bestInfo.time };
  }

  // Chỗ đứng cách mục tiêu trong khoảng [lo, hi], ưu tiên gần chỗ mình đang đứng và thoáng (để
  // còn đường lùi tiếp), tránh các vùng trong avoid (chiêu đang chờ nổ, tầm với của địch khác).
  var RING_OPEN_COST = 120; // px: chỗ kín hẳn (0% thoáng) tính như đi xa thêm chừng này
  function ringPath(g, t, lo, hi, avoid, keep) {
    var me = g.me, sc = spotCheck(g), mid = (lo + hi) / 2, spots = [];
    var a0 = Math.atan2(me.y - t.y, me.x - t.x);
    for (var k = 0; k <= 12; k++) {
      var off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * Math.PI / 12; // 0, ±15°, ±30°… ±90°
      var x = t.x + Math.cos(a0 + off) * mid, y = t.y + Math.sin(a0 + off) * mid;
      if (!sc.standable(x, y) || inHazard(avoid, x, y) || (keep && !keep(x, y))) continue;
      spots.push({ x: x, y: y, d: dist(me.x, me.y, x, y) + (1 - openAt(g, sc, x, y)) * RING_OPEN_COST });
    }
    spots.sort(function (p, q) { return p.d - q.d; });
    for (var i = 0; i < spots.length && i < 6; i++) {
      var r = sc.route(spots[i].x, spots[i].y), e = r && dist(r.to.x, r.to.y, t.x, t.y);
      if (r && e >= lo - 6 && e <= hi + 6 && !inHazard(avoid, r.to.x, r.to.y)) return r;
    }
    return null;
  }

  // Đi như khi chạm đất trong lúc Tự Động: game bật tuChiDuong thì auto vẫn đánh / ra chiêu
  // nhưng không giật đường đi lại, nên không phải tắt auto.
  function moveFighting(g, path) {
    if (g.me.state === 'sit') g.P.Player.stand(g.me);
    if ((g.sw.fishing || g.sw.fishingAuto) && g.sw.stopFishing) g.sw.stopFishing(); // đang câu thì nhân vật đứng yên, phải thôi câu mới đi được
    g.sw.tuChiDuong = true;
    g.me.setPath(path);
  }

  // Né: chạy dày (vòng 50ms), chọn lối ra gần nhất (dò từng 12px trước, xa dần), và huỷ đòn …
  var DODGE_NEAR = 240;   // px dò lối ra mịn trước
  var DODGE_FAR = 680;    // px dò thêm (bước thô) khi gần không có lối ra
  function tickDodge(g) {
    var me = g.me;
    if (!cfg.dodge || g.P.Input.hasManualMove()) { st.dodging = false; st.dodgeFar = false; return false; }
    var list = hazards(g);
    if (!inHazard(list, me.x, me.y)) {
      if (st.dodging) { st.dodging = false; st.dodgeTo = null; st.routeTo = null; st.dodgeFar = false; }
      return false;
    }
    var inBossFight = !!(worldBossNear(g) || (st.bh && st.bh.boss) || nearBoss(g) || (me.attackTarget && (isBoss(me.attackTarget) || isWorldBoss(g, me.attackTarget))));
    if (me.state === 'attack' && !me.attackFired) {
      me.state = 'idle';
      me.attackTime = 0;
      klog('Huỷ đòn chém đang vung để né' + (inBossFight ? ' chiêu Boss' : ''));
    }
    var t = st.dodgeTo;
    if (st.dodging && t && me.path && me.path.length && !inHazard(list, t.x, t.y)) return true;
    var r = escapePath(g, list, DODGE_NEAR, 12) || escapePath(g, list, DODGE_FAR, 40);
    if (!r) { klog('Không có lối ra khỏi vùng chiêu'); return st.dodging; }
    moveFighting(g, r.path);
    st.dodgeTo = r.to;
    // Ghi đòn sắp nổ sớm nhất mà mình đang đứng trong.
    var hit = list.filter(function (h) { return segDist(h, me.x, me.y) < h.r; })
      .sort(function (a, b) { return (a.t == null ? 99 : a.t) - (b.t == null ? 99 : b.t); })[0];
    var C = g.P.CONFIG.PLAYER, v = (me.speed || C.SPEED) * (g.P.Input.run ? C.RUN_MULT || 1 : 1);
    var need = dist(me.x, me.y, r.to.x, r.to.y);
    klog('Né ' + (hit && hit.what || 'chiêu') + (hit && hit.t != null ? ': còn ' + Math.max(0, hit.t).toFixed(2) + 's' : '') +
      ', chạy ' + Math.round(need) + 'px (~' + (need / Math.max(1, v)).toFixed(2) + 's)');
    if (!st.dodging) say('Né ' + (hit && hit.what || 'chiêu địch'));
    st.dodging = true;
    st.dodgeFar = need > 120;
    // Chạy bộ không kịp ra trước lúc nổ: lướt Thổ Độn theo đường thoát vừa đặt.
    if (cfg.autoDash && hit && hit.t != null && need / Math.max(1, v) > hit.t - 0.1) talUse(g, 'tho_don', 'không kịp né ' + (hit.what || 'chiêu'));
    return true;
  }

  /* ================= Đánh rồi lùi (hit & run) ================= */
  // Lùi theo đòn của chính mình (trạng thái gồng của quái về máy muộn): đòn chém trúng giữa động tác / chiêu vừa ra thì lùi
  // ra ngoài tầm địch trong kiteOut ms rồi áp lại. Quái vừa chém mình thì đang hồi đòn: đứng đánh. Người chơi vung đòn thì lùi.
  var KITE_SAFE_MS = 250;    // bỏ bớt cuối thời gian hồi đòn của quái cho kịp lùi
  var KITE_FAST_MS = 50;     // kiểm tra dày hơn vòng chính
  var KITE_REPLAN_MS = 1500; // đi tới chỗ lùi lâu hơn chừng này mà chưa thoát thì tìm chỗ khác
  var KITE_SCAN = 60;        // px ngoài tầm với của địch vẫn tính là đang áp sát
  // Địch tầm xa thì không chạy mãi: chỉ lùi khi ra khỏi tầm nó kịp trong kiteOut, không thì đứng
  // đánh. Lùi liên tục lâu mà mình không ra được đòn nào thì tạm thôi lùi cho auto áp vào đánh.
  var KITE_STARVE_MS = 2500; // lùi suốt chừng này mà chưa ra đòn → tạm thôi lùi
  var KITE_ENGAGE_MS = 1200; // thời gian để auto áp vào ra đòn trước khi lại được lùi
  var KITE_GAP_SHARE = 0.75; // khoảng cách đứng ngoài tối đa = phần này của quãng lùi tối đa
  var KITE_SEARCH_PAD = 36;  // dò chỗ lùi xa hơn quãng lùi một chút (lùi chéo, né vật cản)
  // Một nhịp lùi: bắt đầu khi đòn / chiêu của mình ra, lùi tới khi ra khỏi tầm địch, rồi đứng
  // ngoài thêm kiteOut ms mới áp vào lại. Quãng lùi không phụ thuộc kiteOut.
  var KITE_MAX_RETREAT = 160;   // px: lùi xa nhất một nhịp
  var KITE_RUN_TIMEOUT_MS = 2000; // lùi mãi chưa ra khỏi tầm thì thôi nhịp đó
  var lastStrikeAt = 0, sawFired = false, kitePauseUntil = 0, outAt = 0;

  // Nhật ký hit & run: lý do lùi / không lùi, gộp dòng lặp lại liền nhau.
  var KLOG_MAX = 150;
  var kiteLog = [], kiteNow = '';
  // Loại dòng log để lọc trong tab Log.
  function logCat(msg) {
    if (/^\[(Mạng|Server|Gói|WebSocket|Packet)\]/i.test(msg)) return 'net';
    if (/^\[(Dược Công|Lịch|Tông môn|Vận Tiêu|Điểm danh|Tàng Kinh|Lãm Làng|Sỹ Sách Điện)\]/.test(msg)) return 'dc';
    if (/^\[Nhặt NL\]|^\[Vườn\]|^Quét|nhặt|Đi thu|Thu |Đã thu|Vận |vận |tài nguyên/.test(msg)) return 'loot';
    return 'fight';
  }
  function klog(msg) {
    var last = kiteLog[kiteLog.length - 1];
    if (last && last.msg === msg) { last.n++; last.at = new Date(); return; }
    kiteLog.push({ at: new Date(), msg: msg, n: 1, cat: logCat(msg) });
    if (kiteLog.length > KLOG_MAX) kiteLog.shift();
  }

  function markSwing(m) { m._ttSwing = now(); }

  // Thời điểm đòn của mình thật sự ra: đòn chém lúc attackFired bật, chiêu lúc castSpell thành công.
  function tickStrike(g) {
    var me = g.me, fired = me.state === 'attack' && !!me.attackFired;
    if (fired && !sawFired) {
      lastStrikeAt = now();
      var at = me.attackTarget;
      pendingSwing = { at: lastStrikeAt, hit: false, name: at && at.def ? at.def.name : at && at.name };
      splashSwing(g);
    }
    sawFired = fired;
  }

  // Người chơi thù địch đang ở gần (đấu, PK tự do, đồ sát…) theo đúng luật game.
  function hostilePlayers(g) {
    var G = g.P.Gateway, T = g.P.Targeting, out = [];
    if (!G || !G.remotes || !T || !T.thuDich) return out;
    Object.keys(G.remotes).forEach(function (id) {
      var r = G.remotes[id];
      try { if (r && !r.downed && T.thuDich(r)) out.push(r); } catch (e) { }
    });
    return out;
  }

  // Theo dõi nhịp gồng và vận tốc của từng con quái (để đón đầu khi nó đang chạy).
  var VEL_SMOOTH = 0.5;      // trộn vận tốc mới với cũ cho đỡ giật
  function tickSwings(g) {
    var t = now();
    (g.sw.enemies || []).forEach(function (m) {
      if (!m) return;
      if (m.def && m.def.baoKich) {
        if (m._ttBk != null && m.bkSeq !== m._ttBk) { m._ttBkAt = now(); klog('Boss ' + mobLabel(m) + ' gầm · ' + (m.def.baoKich.ten || 'Bạo Kích') + ' → ra khỏi vòng ' + (m.def.baoKich.radius || 160) + 'px'); }
        m._ttBk = m.bkSeq;
      }
      var tg = m.attackState === 'telegraph';
      if (m._ttTg && !tg) markSwing(m);
      m._ttTg = tg;
      if (m._tpt == null || m.dead) { m._tpx = m.x; m._tpy = m.y; m._tpt = t; m._vx = 0; m._vy = 0; return; }
      var dt = (t - m._tpt) / 1000;
      if (dt < 0.03) return;
      var vx = (m.x - m._tpx) / dt, vy = (m.y - m._tpy) / dt;
      m._vx = m._vx * (1 - VEL_SMOOTH) + vx * VEL_SMOOTH;
      m._vy = m._vy * (1 - VEL_SMOOTH) + vy * VEL_SMOOTH;
      m._tpx = m.x; m._tpy = m.y; m._tpt = t;
    });
  }

  /* --- chém trúng / chém hụt --- */
  // Đòn chém chỉ tính trúng lúc attackFired (giữa động tác). Quái đang chạy ra khỏi tầm thì tới …
  var SWING_SLACK = 6;        // px dư cho tầm chém
  var SWING_CONFIRM_MS = 500; // chờ số sát thương báo về (online có độ trễ mạng)
  var CHASE_REPATH_MS = 250;
  var pendingSwing = null, chaseAt = 0, chaseLogAt = 0;

  function swingWouldMiss(g, pl, t) {
    if (!t || !t.def || t.dead || t._vx == null) return null;
    var PL = g.P.Player;
    var tf = (PL.attackTime ? PL.attackTime() : 0.8) * (PL.hitAt ? PL.hitAt() : 0.35);
    var px = t.x + t._vx * tf, py = t.y + t._vy * tf;
    var reach = (PL.reach ? PL.reach() : 26) + (t.def.bodyRadius || 0) + SWING_SLACK;
    return dist(pl.x, pl.y, px, py) > reach ? { x: px, y: py } : null;
  }

  function chaseTo(g, t, p) {
    if (now() - chaseAt < CHASE_REPATH_MS) return;
    chaseAt = now();
    var r = spotCheck(g).route(p.x, p.y);
    if (r) moveFighting(g, r.path);
    if (now() - chaseLogAt > 1500) {
      chaseLogAt = now();
      klog((t.def.name || 'Quái') + (t.state === 'return' ? ' đang chạy về chỗ cũ' : ' đang chạy ra khỏi tầm') + ' → đón đầu, không chém hụt');
    }
  }

  function noteSwingHit() {
    if (pendingSwing && !pendingSwing.hit && now() - pendingSwing.at < SWING_CONFIRM_MS + 300) {
      pendingSwing.hit = true;
      if (cfg.kite) klog('Đòn chém trúng');
    }
  }

  // Hụt thì huỷ nhịp lùi của đòn đó: áp vào lại ngay chứ không chạy ra vô ích.
  function tickSwingConfirm() {
    var p = pendingSwing;
    if (!p || p.hit || now() - p.at < SWING_CONFIRM_MS) return;
    pendingSwing = null;
    if (!cfg.kite) return;
    klog('Chém hụt' + (p.name ? ' (' + p.name + ' ra khỏi tầm)' : '') + ' → huỷ lùi, áp vào lại');
    if (lastStrikeAt === p.at) lastStrikeAt = 0;
    st.kiting = false;
    // Hụt liên tục (quái đuổi theo nhịp lùi nên lúc áp vào nó đã dịch đi): thôi đánh-lùi một lúc, đứng đánh cho trúng.
    missTimes.push(now());
    while (missTimes.length && now() - missTimes[0] > MISS_WIN_MS) missTimes.shift();
    if (missTimes.length >= MISS_MAX && now() >= kitePauseUntil) {
      kitePauseUntil = now() + MISS_PAUSE_MS;
      missTimes.length = 0;
      klog('Chém hụt ' + MISS_MAX + ' lần trong ' + MISS_WIN_MS / 1000 + 's → thôi đánh-lùi ' + MISS_PAUSE_MS / 1000 + 's, đứng đánh cho trúng');
    }
  }
  var MISS_WIN_MS = 20000, MISS_MAX = 3, MISS_PAUSE_MS = 25000, missTimes = [];

  function mobBaseReach(g, m) {
    return (m.def.hitRadius || (g.P.CONFIG.ENEMY && g.P.CONFIG.ENEMY.HIT_RADIUS) || 26) + BODY_R;
  }

  function anyBossNear(g, customR) {
    if (!g || !g.me) return null;
    var me = g.me, R = customR || WORLD_BOSS_R;
    return mobsAlive(g).filter(function (m) {
      return (isBoss(m) || isWorldBoss(g, m)) && dist(me.x, me.y, m.x, m.y) <= R;
    })[0] || null;
  }

  function tickKite(g) {
    var me = g.me;
    if (!cfg.kite) { st.kiting = false; kiteNow = 'Đang tắt'; return false; }
    var kt0 = kiteTarget(g);
    if (kt0 && kt0.ctRecover > 0) { st.kiting = false; kiteNow = mobLabel(kt0) + ' đang SƠ HỞ (+25% sát thương) → đứng dồn đánh'; return false; }
    var wbk = worldBossNear(g) || (st.bh && st.bh.boss) || (kt0 && (isBoss(kt0) || isWorldBoss(g, kt0))) || anyBossNear(g) || nearBoss(g);
    if (wbk && !(now() < (st.reviveGraceUntil || 0) && me.hp / (me.hpMax || 1) < 0.40)) { st.kiting = false; kiteNow = 'Đang đánh Boss: dồn sát thương liên tục (không lùi, chỉ né skill)'; return false; }
    if (dmgOnly(g) && kt0 && isBoss(kt0) && me.hp > (me.hpMax || 1) * 0.4) { st.kiting = false; kiteNow = 'Hoạt động chia thưởng theo sát thương, không rơi đồ → đứng dồn sát thương (né chiêu vẫn chạy)'; return false; }
    if (st.vn && st.vn.inside) { st.kiting = false; kiteNow = 'Vết Nứt: tự đi / tự đánh theo mê cung → không lùi'; return false; }
    if (st.ll && (st.ll.hold > now() || st.ll.boss)) { st.kiting = false; kiteNow = 'Lãm Làng: đánh Tà Soái / giữ chỗ hợp lực → không lùi'; return false; }
    if (!g.sw.autoOn) { st.kiting = false; kiteNow = 'Không lùi: Tự Động đang tắt'; return false; }
    if (g.P.Input.hasManualMove()) { st.kiting = false; kiteNow = 'Không lùi: bạn đang tự điều khiển'; return false; }
    if (now() < kitePauseUntil) { st.kiting = false; kiteNow = 'Tạm thôi lùi, để auto áp vào đánh'; return false; }
    if (st.kiting && now() - st.kiteSince > KITE_STARVE_MS && now() - lastStrikeAt > KITE_STARVE_MS) {
      kitePauseUntil = now() + KITE_ENGAGE_MS;
      st.kiting = false;
      klog('Lùi ' + (KITE_STARVE_MS / 1000) + 's chưa ra được đòn → thôi lùi ' + (KITE_ENGAGE_MS / 1000) + 's để áp vào');
      return false;
    }
    var danger = [], PL = g.P.Player, myReach = PL.reach ? PL.reach() : 0;
    var C = g.P.CONFIG.PLAYER, v = (me.speed || C.SPEED) * (g.P.Input.run ? C.RUN_MULT || 1 : 1);
    var maxStep = KITE_MAX_RETREAT;
    // Đang vung đòn chém mà đòn chưa trúng thì đứng yên cho trúng đã.
    var winding = me.state === 'attack' && !me.attackFired;
    // Đang trong nhịp lùi: từ lúc ra đòn tới khi đã đứng ngoài tầm địch đủ kiteOut ms.
    var sinceStrike = now() - lastStrikeAt, wasOut = outAt > lastStrikeAt;
    var running = !winding && lastStrikeAt > 0 && sinceStrike < KITE_RUN_TIMEOUT_MS &&
      !(wasOut && now() - outAt >= cfg.kiteOut);
    // Đứng ngoài tầm địch mà vẫn phải trong tầm mình thì mới đánh được.
    var near = null, why = [];
    function zone(x, y, base, body, swinging, resting, name) {
      var mine = myReach + (body || 0), outrange = mine > base + 4;
      // Khoảng cách đặt lớn hơn quãng lùi được thì thu lại cho vừa, không bỏ hẳn hit & run.
      var gap = Math.min(cfg.kiteGap, maxStep * KITE_GAP_SHARE);
      var r = outrange ? Math.min(base + gap, mine - 2) : base + gap;
      var d = dist(me.x, me.y, x, y);
      if (d >= r + KITE_SCAN) return;
      if (!near || d < near.d) near = { d: d, r: r, name: name };
      if (base - d > maxStep) { // chính tầm đánh của nó đã xa hơn quãng lùi được: đứng đánh
        why.push(name + ': tầm đánh ' + Math.round(base) + 'px, lùi tối đa ' + Math.round(maxStep) + 'px không ra kịp → đứng đánh');
        return;
      }
      if (swinging || (!resting && !winding && (running || outrange))) danger.push({ x: x, y: y, x2: x, y2: y, r: r });
      else if (resting) why.push(name + ' đang hồi đòn → đứng đánh');
    }
    mobsAlive(g).forEach(function (m) {
      if ((isBoss(m) || isWorldBoss(g, m)) && !(now() < (st.reviveGraceUntil || 0) && me.hp / (me.hpMax || 1) < 0.40)) return; // Tuyệt đối không thêm vùng né đòn đánh thường & va chạm của Boss (trừ lúc vừa gượng dậy máu thấp)
      if (!(m.def.contactDmg > 0)) return;
      var swinging = m.attackState === 'telegraph';
      var cdMs = (m.def.hitCooldown || 1) * 1000;
      var resting = !swinging && m._ttSwing && now() - m._ttSwing < cdMs - KITE_SAFE_MS;
      zone(m.x, m.y, mobBaseReach(g, m), m.def.bodyRadius, swinging, resting, m.def.name || 'Quái');
    });
    hostilePlayers(g).forEach(function (r) {
      var reach = (PL.reachOf ? PL.reachOf(r.cfg) : g.P.CONFIG.PLAYER.REACH) + BODY_R;
      zone(r.x, r.y, reach, 0, r.state === 'attack', false, r.name || 'Người chơi');
    });
    // Ra tới ngoài tầm địch trong nhịp lùi: bắt đầu đếm thời gian đứng ngoài.
    var outNow = !inHazard(danger, me.x, me.y);
    if (running && outNow && !wasOut) { outAt = now(); wasOut = true; }
    var phase = winding ? ' · đang vung đòn' : !running ? '' :
      wasOut ? ' · đứng ngoài ' + Math.round(now() - outAt) + '/' + cfg.kiteOut + 'ms' : ' · đang lùi ra';
    kiteNow = (near ? near.name + ' cách ' + Math.round(near.d) + 'px, vùng né ' + Math.round(near.r) + 'px' : 'Không có địch gần') +
      ' · tầm mình ' + Math.round(myReach) + ' · lùi tối đa ' + Math.round(maxStep) + 'px' + phase;
    // Đang đi tới chỗ lùi mà chỗ đó vẫn ổn thì đi tiếp; đi quá lâu (bị thân quái chặn) thì tính lại.
    var t = st.kiteTo;
    var going = st.kiting && t && me.path && me.path.length && now() - st.kiteAt < KITE_REPLAN_MS &&
      !inHazard(danger, t.x, t.y);
    if (!going && !winding && tickCorner(g, danger)) return true;
    if (!inHazard(danger, me.x, me.y)) {
      if (going) return true;
      if (running && why.length) klog(why[0]);
      st.kiting = false;
      // Đòn / chiêu vừa ra thì không áp vào ngay; hết thời gian đứng ngoài mới tính chỗ đứng đánh.
      if (winding || running) return false;
      if (st.looting) { kiteNow += ' · đang đi nhặt đồ'; return false; }
      return tickEngage(g, myReach, maxStep);

    if (going) return true;

    if (!r) { klog('Không còn đường lùi (tường / cổng / địch vây kín) → đứng đánh'); return false; }
    klog(r.label + ' ' + Math.round(dist(me.x, me.y, r.to.x, r.to.y)) + 'px' + (near ? ' khỏi ' + near.name : '') +
      (r.open != null ? ' · chỗ tới thoáng ' + Math.round(r.open * 100) + '%' : ''));
    moveFighting(g, r.path);
    st.kiteTo = r.to;
    st.kiteAt = now();
    if (!st.kiting) st.kiteSince = now();
    st.kiting = true;
    return true;
  }

  // Lùi sau đòn: trước hết lùi ngắn (trong quãng lùi được) tới chỗ thoáng; nếu chỗ lùi ngắn
  // nào cũng hẹp / không có thì chạy thoát vây ra chỗ rộng, tới trước địch lâu nhất.
  var KITE_MIN_OPEN = 0.6;   // chỗ lùi ngắn hẹp hơn thế thì tính đường thoát xa
  // Độ thoáng nặng hơn thời gian đi: tới gần tường thì lùi vòng sang bên ra chỗ rộng thay vì lùi
  // thẳng (quái luôn đuổi từ một phía, lùi thẳng mãi là bị ép vào tường rồi vào góc).
  var KITE_W_ROOM = 2.0, FAR_W_ROOM = 2.5;

  // Quái bị kéo ra quá leashRange quanh chỗ sinh thì bỏ đuổi, chạy về chỗ cũ; mình đuổi theo là
  // chém hụt và mất mục tiêu. Chỗ đứng / chỗ lùi phải nằm trong vùng đó của mục tiêu.
  var LEASH_PAD = 40;        // px chừa trong mép vùng hoạt động của quái
  function leashKeep(g, t) {
    if (!t || !t.def || !isFinite(t.homeX) || !isFinite(t.homeY)) return null;
    var L = (t.def.leashRange || g.P.CONFIG.ENEMY.LEASH_RANGE || 260) - LEASH_PAD;
    return function (x, y) { return dist(x, y, t.homeX, t.homeY) <= L; };
  }
  function both(a, b) { return b ? function (x, y) { return a(x, y) && b(x, y); } : a; }

  function kiteRetreat(g, danger, maxStep, v) {
    var threats = threatsOf(g), hz = hazards(g), keep = leashKeep(g, kiteTarget(g)), tw = towerAvoid(g);
    function outside(x, y) { return !inHazard(danger, x, y) && !inHazard(tw, x, y); }
    function tryGoal(goal) {
      var r = planEscape(g, threats, goal, { maxTime: (maxStep + KITE_SEARCH_PAD) / v, avoid: hz, wT: 1, wO: KITE_W_ROOM, wM: 0.25 });
      if (r && r.open >= KITE_MIN_OPEN) { r.label = 'Lùi'; return r; }
      var far = planEscape(g, threats, goal, { avoid: hz, wT: 0.3, wO: FAR_W_ROOM, wM: 0.8 });
      if (far) { far.label = 'Thoát vây, chạy'; return far; }
      if (r) { r.label = 'Lùi'; return r; }
      return null;
    }
    // Ưu tiên giữ quái trong vùng của nó; hết chỗ thì an toàn của mình trước.
    var r = (keep && tryGoal(both(outside, keep))) || tryGoal(outside);
    if (r) return r;
    var e = escapePath(g, danger.concat(hz, tw), maxStep + KITE_SEARCH_PAD, 12);
    if (e) e.label = 'Lùi';
    return e;
  }

  // Đứng chỗ hẹp (sát tường, trong góc) mà địch đang áp tới: chạy ra chỗ rộng trước khi bị vây.
  var CORNER_SCAN = 90;      // px ngoài tầm với của địch vẫn tính là đang áp tới
  var CORNER_OPEN = 0.55;    // thoáng dưới mức này là chỗ hẹp
  var CROWD_OPEN = 0.8;      // bị nhiều con áp thì đòi chỗ thoáng hơn
  var CROWD_N = 3;
  var SPACIOUS = 0.75;       // chỗ chạy tới phải thoáng ít nhất chừng này
  var CORNER_COOLDOWN_MS = 1500;
  function tickCorner(g, danger) {
    if (now() < st.cornerUntil) return false;
    var me = g.me, sc = spotCheck(g), here = openAt(g, sc, me.x, me.y), threats = threatsOf(g);
    var close = threats.filter(function (m) { return dist(me.x, me.y, m.x, m.y) < m.reach + CORNER_SCAN; }).length;
    // Một con đuổi thì đứng chỗ hẹp vẫn đánh được (map hang động chỗ nào cũng hẹp, chạy ra chạy vào chỉ mất nhịp đánh).

    var r = (keep && planEscape(g, threats, both(roomy, keep), opt)) || planEscape(g, threats, roomy, opt);

    klog('Bị dồn ' + (close >= CROWD_N ? close + ' con' : 'góc') + ' (thoáng ' + Math.round(here * 100) + '%) → chạy ra chỗ rộng ' +
      Math.round(dist(me.x, me.y, r.to.x, r.to.y)) + 'px (thoáng ' + Math.round(r.open * 100) + '%)');
    moveFighting(g, r.path);
    st.kiteTo = r.to;
    st.kiteAt = now();
    if (!st.kiting) st.kiteSince = now();
    st.kiting = true;
    st.engaging = false;
    return true;
  }

  /* --- áp vào đúng tầm để xả chiêu / chém --- */
  // Có chiêu sẵn sàng (cùng cách chọn với auto / tối ưu chiêu) thì đứng trong tầm chiêu đó; tầm …

  function kiteTarget(g) {

    var best = null, bd = R;

    for (var i = 0; i < list.length; i++) {

    return null;
  }

  // Đánh thường bằng vũ khí đánh lan: tới chỗ trúng nhiều con nhất. true = đang đi tới, false = đã

    kiteNow += ' · đánh lan ' + sp.count + ' con (tầm lan ' + (sp.explore ? 'đang đo, tạm ' : '') + Math.round(sp.r) + 'px)';
    if (sp.here) { if (st.engaging && me.path && me.path.length) me.path.length = 0; st.engaging = false; return false; }
    var e0 = st.engageTo;
    if (st.engaging && e0 && me.path && me.path.length && now() - st.engageAt < ENGAGE_REPLAN_MS && dist(e0.x, e0.y, sp.x, sp.y) < 24) return true;
    var sr = spotCheck(g).route(sp.x, sp.y);
    if (!sr) return null;
    klog((sp.explore ? 'Chưa biết tầm lan → vào ' : 'Đứng chỗ đánh lan ') + 'trúng ' + sp.count + ' con (tầm lan ' + (sp.explore ? 'tạm ' : '') + Math.round(sp.r) + 'px, ' + sp.threats + ' con cắn tới được)');
    moveFighting(g, sr.path);

  }

  function tickEngage(g, myReach, maxStep) {

    var d = dist(me.x, me.y, t.x, t.y), name = t.def ? t.def.name || 'Quái' : t.name || 'Người chơi';
    var safe = enemyReach(g, t) + Math.min(cfg.kiteGap, maxStep * KITE_GAP_SHARE);
    var def = plannedSkill(g, t), lo, hi, what, K = +cfg.keepDist || 0;

    else if (def) {

    mobsAlive(g).concat(hostilePlayers(g)).forEach(function (m) {

  }

  /* ================= Tối ưu chiêu ================= */
  var MELEE = '_melee';
  var hooked = false;

  function mobsAlive(g) {

    return (g.sw.enemies || []).filter(function (m) {
      return m && !m.dead && !(m.def && (m.def.human || m.def.tieuXa || (m.def.tranMach && !cfg.tmTru))) && !(tl && m.def && m.def.tamLo && !U.laDichDon(m));

  }
  function isBoss(m) { return !!(m && ((m.def && (m.def.isBoss || m.def.boss || /Yêu Thú Cấp/.test(m.def.name || ''))) || m.isBoss || m.boss)); }

    if (m.lootLastHitOnly) return true;
    var tp = m.type || (m.def && m.def.type) || '';

  }

  function skillCost(g, def) {
    if (def.thunder) return { mp: g.P.CONFIG.THUNDER.MP_COST || 0, sp: 0 };
    var c = g.P.Skills.spellCost ? g.P.Skills.spellCost(g.me, def) : def;

  }

  // Cùng công thức tầm đánh với Skills.pickAuto.

  }

  function dotOf(g, def) {

    return sum;
  }

  // Những con quái một chiêu sẽ trúng, giống Skills.blastTargets.
  function skillHits(g, def, target, mobs) {
    var R = def.thunder ? (g.P.CONFIG.THUNDER && g.P.CONFIG.THUNDER.RADIUS) || 0 : def.blastR || 0;

  // Sát thương một lần trúng của chiêu. Lôi Chưởng: THUNDER_DEF không có coef (dmgOf ra 1) → game tính powerDmg(THUNDER.COEF).

  }

    var S = g.P.Skills, me = g.me;
    var per = skillDmg(g, def), dot = dotOf(g, def), hits = skillHits(g, def, target, mobs), eff = 0;
    // Chiêu nhiều viên (Phong Nhẫn 3, Băng Châm 5): game chia tổng sát thương cho các viên (Skills.shotShare) → không nhân.
    hits.forEach(function (m) { eff += Math.min(per + dot, Math.max(0, m.hp != null ? m.hp : 100)); });
    if (eff <= 0 && btCcSec(def) > 0) eff = 15; // Đảm bảo chiêu thuần khống chế vẫn có điểm hiệu dụng trong combat

    var why = '';
    if (!S.ready(me, def)) why = cd > 0 ? 'hồi ' + cd.toFixed(1) + 's' : 'không dùng được';
    else if ((me.mp || 0) < c.mp) why = 'thiếu linh lực';
    else if ((me.sp || 0) < c.sp) why = 'thiếu thần thức';
    else if (d > range) why = 'xa (' + Math.round(range) + ')';

  }

  // Chuỗi chiêu: thử mọi thứ tự PLAN_DEPTH chiêu trong PLAN_H giây (nhịp chung 1,2 giây, Lôi Chưởng chen giữa), lấy chuỗi mạnh nhất.

  function spellGap(g) { var C = g.P.CONFIG && g.P.CONFIG.PLAYER; return (C && C.SPELL_GAP) || 1.2; }
  function poseLen(g, def) { var c = def.thunder ? (g.P.CONFIG.THUNDER.CAST || 0.34) : (def.cast || 0.5); return 1.4 * c + 0.14; }
  function fullCd(g, def) {
    if (def.thunder) return g.P.CONFIG.THUNDER.COOLDOWN || 5;

    return PL.linhCanHoiChieu ? PL.linhCanHoiChieu(g.me, def.cooldown || 0) : (def.cooldown || 0);
  }
  function ownCd(g, def) { var me = g.me; return Math.max(0, def.thunder ? me.thunderCd || 0 : (me.spellCds && me.spellCds[def.id]) || 0); }

    var me = g.me, G = spellGap(g), gap0 = Math.max(0, me.spellCd || 0);
    var c = rows.filter(function (r) { return r.eff > 0 && (r.ok || /^hồi/.test(r.why)); }).map(function (r) {
