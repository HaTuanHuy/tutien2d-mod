      if (vtActive(g) || st.vt || (st.td && st.td.seen)) return false;
      var ev = xcPending()[0];
      if (!ev) return false;
      var back = st.td ? st.td.back : st.back ? takeBack(g) : st.travel ? { map: st.travel.map, x: st.travel.x, y: st.travel.y, khu: st.travel.khu || gaKhu(g.P) } : takeBack(g);
      st.td = null;
      st.xc = {
        ev: ev, back: back, at: now(), khuWant: 0, khuAt: 0, touches: 0, touchAt: 0, routeAt: 0, travels: 0, pts: null, kills: 0,
        target: null, lastSeen: 0, step: ''
      };
      xcLog('Đi ' + mapName(ev.map) + ' khu ' + ev.khu + ' săn ' + ev.what);
    }
    var d = st.xc, e = d.ev, name = mapName(e.map) + ' khu ' + e.khu;
    if (now() - d.at > XC_MAX_MS) { e.done = true; return xcFinish(g, 'Quá ' + XC_MAX_MS / 60000 + ' phút ở ' + name + ' → về'); }
    if (g.mapId !== e.map) {
      d.khuWant = 0; d.step = 'đi tới ' + mapName(e.map);
      if (!st.travel || st.travel.map !== e.map) {
        if (++d.travels > 6) { e.done = true; return xcFinish(g, 'Không đi được tới ' + mapName(e.map)); }
        startTravel(e.map, null, null, 'Xổng chuồng: đi ' + name);
      }
      tickTravel(g);
      return true;
    }
    if (st.travel && st.travel.map === e.map) stopTravel();
    if (gaKhu(P) !== e.khu && (gaSoKhu(P) >= e.khu || !gaSoKhu(P) || gaSoKhu(P) <= 1)) {
      if (!d.khuWant) { d.khuWant = e.khu; d.khuAt = 0; d.touches = 0; d.touchAt = 0; }
      d.step = 'đổi sang khu ' + e.khu;
      if (khuGo(g, d, '[Xổng chuồng]')) return true;
      if (gaKhu(P) !== e.khu) { e.done = true; return xcFinish(g, 'Không đổi sang được khu ' + e.khu + ' → về'); }
    }
    d.khuWant = 0;
    // Yêu thú xổng chuồng rơi đồ: gom toàn bộ đồ rơi (Yêu Đan, Nanh Hổ, Ngưu Sừng, Linh Thạch, phù chú, trang bị...)
    // trong phạm vi 800px quanh mình hoặc trên map -> chủ động áp sát nhặt ngay trước khi chuyển sang săn con khác.
    var dl = dropsLeft(g);
    var nearDrops = dl.filter(function (r) {
      if (!r || !r.itemId) return false;
      return dist(g.me.x, g.me.y, r.x, r.y) <= 800;
    });
    if (nearDrops.length > 0 && tickLoot(g, true)) {
      d.lastSeen = now();
      d.step = 'tiến tới nhặt đồ rơi xổng chuồng (' + nearDrops.length + ' món)';
      return true;
    }
    var list = xcVisible(g, e.types);
    if (d.target && d.target.dead) { d.kills++; d.target = null; }
    var t = pickXcTarget(g, d, list);
    if (t) {
      if (d.target !== t) {
        var prev = d.target;
        d.target = t;
        var tPct = t.hpMax > 0 ? (t.hp / t.hpMax) : 1;
        if (prev && !prev.dead && (tPct <= 0.28 || (t.hp != null && t.hp <= 15000))) {
          xcLog('CƯỚP LAST-HIT: Chuyển mục tiêu sang ' + mobLabel(t) + ' sắp gục (' + evPct(t) + ')');
        } else {
          xcLog('Thấy ' + mobLabel(t) + ' → đánh (giữ chiêu mạnh nhất kết liễu)');
        }
      }
      d.lastSeen = now();
      d.pts = null; // hạ xong con này thì tuần lại cả map
      d.step = 'đánh ' + mobLabel(t) + ' ' + evPct(t) + ' · còn thấy ' + list.length + ' con · ' + name;
      return evEngage(g, d, t);
    }
    if (!list.length && e.spawnAt && now() < e.spawnAt) {
      d.step = 'chờ yêu thú xổng chuồng (' + Math.max(1, Math.round((e.spawnAt - now()) / 1000)) + 's nữa) · ' + name;
      return true;
    }
    // Vừa hạ xong / còn đồ rơi: chủ động tiến tới nhặt sạch đồ rơi trước khi tuần tiếp map
    if ((d.lastSeen > 0 && now() - d.lastSeen < XC_LOOT_MS) || nearDrops.length > 0 || dl.length > 0) {
      if (tickLoot(g, true)) {
        d.lastSeen = now();
        d.step = 'tiến tới nhặt đồ rơi xổng chuồng';
        return true;
      }
      if (d.lastSeen > 0 && now() - d.lastSeen < XC_LOOT_MS) {
        d.step = 'chờ nhặt đồ xổng chuồng';
        return true;
      }
    }
    if (!d.pts) d.pts = sweepPlan(g, spawnPts(P, e.map, function (def, en) { return e.types.indexOf(en.type) >= 0; }), null, true);
    if (!sweepStep(g, d, d.pts)) {
      // Nếu tuần hết 1 lượt nhưng chưa đủ 60s kể từ lúc xổng chuồng: tuần tiếp lượt nữa tránh quái spawn trễ / chạy lăng xăng
      var timeSinceSpawn = e.spawnAt ? (now() - e.spawnAt) : (now() - d.at);
      if (timeSinceSpawn < 60000) {
        d.pts = sweepPlan(g, spawnPts(P, e.map, function (def, en) { return e.types.indexOf(en.type) >= 0; }), null, true);
        if (sweepStep(g, d, d.pts)) {
          setAuto(g, false);
          d.step = 'dò lại khắp ' + name + ' (còn ' + d.pts.length + ' chỗ)';
          return true;
        }
      }
      if (lootBeforeLeave(g)) { d.step = 'nhặt Yêu Đan / đồ rơi trước khi về'; return true; }
      e.done = true;
      return xcFinish(g, d.kills ? 'Đã hạ ' + d.kills + ' con ở ' + name + ', tuần hết map không còn → về' : 'Tuần hết ' + name + ' không thấy con nào (có thể đã bị hạ) → về');
    }
    setAuto(g, false);
    d.step = 'dò khắp ' + name + ' (còn ' + d.pts.length + ' chỗ)';
    return true;
  }

  /* ================= Hồn Phiên (Ma Đạo): săn hồn, giữ Sát Nghiệp, luyện / gọi Âm Hồn ================= */
  // Hồn Phiên (LuyenQuy): hạ người phàm lấy Phàm / Oán Hồn (+Sát Nghiệp), dừng trước mốc tên đỏ; đủ thì luyện, đánh thì gọi Âm Hồn.
  var HON_KILL_NGHIEP = { pham_hon: 1, oan_hon: 3 };
  var HON_RESUME = 10;          // chạm mốc nghiệp thì chờ giảm chừng này điểm mới săn lại
  var HON_SWITCH_MS = 25000;    // trong khu không còn người phàm cần săn chừng này thì đổi khu
  var HON_LUYEN_GAP_MS = 4000, HON_GOI_GAP_MS = 1500;
  var honMapsCache = null;
  function honLog(msg) { klog('[Hồn] ' + msg); say('Hồn Phiên: ' + msg); }
  function honState(P) {
    var U = P.HonPhienUI, L = P.LuyenQuy;
    if (!L) return null;
    if (U && U.trangThai) return U.trangThai();
    var I = P.Inventory, c = function (id) { return I && I.count ? I.count(id) : 0; };
    return {
      phien: L.coPhien(P) ? 1 : 0, am: c(L.AM_HON), dang: 0, tran: L.tranAmHon(P), pham: c(L.PHAM_HON), oan: c(L.OAN_HON),
      tuSi: c(L.TU_SI_HON), thu3: c(L.THU_HON_3), thu4: c(L.THU_HON_4), thu6: c(L.THU_HON_6), nghiep: L.satNghiep(P), moc: { tenDo: L.moc('ten_do', P) }
    };
  }
  function honHave(s, id) {
    return { pham_hon: s.pham, oan_hon: s.oan, tu_si_hon: s.tuSi, thu_hon_3: s.thu3, thu_hon_4: s.thu4, thu_hon_6: s.thu6 }[id] | 0;
  }
  // Nguyên liệu con Âm Hồn kế tiếp: [{id, ten, can, co}]; null nếu phiên đã đầy.
  function honNext(P, s) {
    var L = P.LuyenQuy, k = (s.am | 0) + (s.dang | 0) + 1;
    if (k > (s.tran || L.tranAmHon(P))) return null;
    return L.congThucCon(k).map(function (x) { return { id: x.id, ten: x.ten, can: x.can, co: honHave(s, x.id) }; });
  }
  // Map nào có những người phàm cho loại hồn nào (đếm điểm sinh trong dữ liệu bản đồ).
  function honMaps(P) {
    if (honMapsCache) return honMapsCache;
    var out = {}, MD = P.MapData || {}, D = P.ENEMY_DEFS || {};
    Object.keys(MD).forEach(function (k) {
      var m = MD[k];
      if (!m || typeof m !== 'object' || typeof m.id !== 'string' || out[m.id] || !Array.isArray(m.enemies)) return;
      var c = {};
      // Chỗ sinh của Thương Đội (thuongDoi) chỉ có người khi đoàn đi qua: không tính.
      m.enemies.forEach(function (e) { var d = e && !e.thuongDoi && D[e.type]; if (d && d.human && HON_KILL_NGHIEP[d.hon]) c[d.hon] = (c[d.hon] || 0) + 1; });
      if (Object.keys(c).length) out[m.id] = c;
    });
    if (Object.keys(out).length) honMapsCache = out;
    return out;
  }
  function honCanHit(P, m) { return !m.dead && m.def && m.def.human && (!P.ChinhDao || !P.ChinhDao.danhDuoc || P.ChinhDao.danhDuoc(m.def)); }

  // Loại hồn cần săn lúc này (theo con kế tiếp) mà chưa chạm mốc nghiệp. Oán Hồn chỉ rơi từ Thương Nhân / …
  function honSellTarget(s, need, id) {
    var extra = cfg.honSell ? Math.max(0, +(id === 'oan_hon' ? cfg.honSellOan : cfg.honSellPham) || 0) : 0;
    if (!extra) return 0;
    var x = need && need.filter(function (r) { return r.id === id; })[0];
    return (x ? x.can : 0) + extra;
  }
  function honWanted(P, s) {
    var need = honNext(P, s), out = {}, cap = (s.moc && s.moc.tenDo) || 20;
    var capped = false, oanThieu = false, sell = false;
    (need || []).forEach(function (x) {
      if (!HON_KILL_NGHIEP[x.id] || x.co >= x.can) return;
      if (x.id === 'oan_hon') { oanThieu = true; return; }
      if (!cfg.honAllowRed && (s.nghiep | 0) + HON_KILL_NGHIEP[x.id] >= cap) { capped = true; return; }
      out[x.id] = x;
    });
    ['pham_hon', 'oan_hon'].forEach(function (id) {
      var tgt = honSellTarget(s, need, id), co = honHave(s, id);
      if (!tgt || co >= tgt || out[id]) return;
      if (id === 'oan_hon') { oanThieu = sell = true; return; }
      if (!cfg.honAllowRed && (s.nghiep | 0) + HON_KILL_NGHIEP[id] >= cap) { capped = true; return; }
      out[id] = { id: id, ten: 'Phàm Hồn (dư bán chợ)', can: tgt, co: co, sell: true };
      sell = true;
    });
    return { out: out, capped: capped, need: need, oanThieu: oanThieu, sell: sell };
  }

  function honTalk(g, a, npcId, want) { return npcTalk(g, a, npcId, want, honLog); }

  // Bấm nút "Thỉnh Hồn Phiên": tới Sứ Giả Ma Đạo, chọn thỉnh (game tự kiểm điều kiện, trừ Linh Thạch).
  function honBuyStart() {
    var g = game(), P = g && g.P, L = P && P.LuyenQuy;
    if (!L) { say('Game chưa có hệ thống Hồn Phiên'); return; }
    var why = L.xetThinhPhien ? L.xetThinhPhien(P) : null;
    if (why) { honLog('Chưa thỉnh được: ' + why); return; }
    st.honBuy = { touches: 0, touchAt: 0, routeAt: 0, travels: 0, at: now() };
    if (!enabled) setEnabled(true);
    honLog('Đi thỉnh Hồn Phiên ở ' + mapName(propMap(P, L.NPC) || L.MAP) + ' (' + L.GIA_PHIEN + ' Linh Thạch)');
  }
  function tickHonBuy(g) {
    var a = st.honBuy, L = g.P.LuyenQuy;
    if (!a) return false;
    if (L.coPhien(g.P)) { st.honBuy = null; dcDlg = null; honLog('Đã có Hồn Phiên'); return false; }
    if (now() - a.at > 5 * 60000 || !honTalk(g, a, L.NPC, 'thinh')) { st.honBuy = null; honLog('Thỉnh Hồn Phiên chưa xong → dừng'); return false; }
    setAuto(g, false);
    return true;
  }

  // ================= Pháp Bảo Phe Phái (Đa Phái): Hồn Phiên, Kiếm Hạp, Thiết Hoàn, Loan Kết =================
  // Xác định bảo vật của từng phe: Ma Đạo (Âm Hồn), Chính Đạo (Kiếm Linh), Thể Tu (Quyền Ảnh), Hợp Hoan (Mị Điệp)
  function factionArtifact(P, s) {
    if (!s) return null;
    var dao = s.dao || (s.hap ? 'chinh' : s.hoan ? 'the' : s.ket ? 'hop' : s.phien ? 'ma' : '');
    if (dao === 'chinh' || s.hap) {
      return { dao: 'chinh', ten: 'Kiếm Linh', baoVat: 'Tụ Linh Kiếm Hạp', co: s.kl | 0, tran: s.tranKl | (P.ChinhDao && P.ChinhDao.tran ? P.ChinhDao.tran(P) : 0), mod: P.ChinhDao };
    }
    if (dao === 'the' || s.hoan) {
      return { dao: 'the', ten: 'Quyền Ảnh', baoVat: 'Trấn Thân Thiết Hoàn', co: s.qa | 0, tran: s.tranQa | (P.TheTu && P.TheTu.tran ? P.TheTu.tran(P) : 0), mod: P.TheTu };
    }
    if (dao === 'hop' || s.ket) {
      return { dao: 'hop', ten: 'Mị Điệp', baoVat: 'Hồng Loan Kết', co: s.md | 0, tran: s.tranMd | (P.HopHoan && P.HopHoan.tran ? P.HopHoan.tran(P) : 0), mod: P.HopHoan };
    }
    if (dao === 'ma' || s.phien) {
      return { dao: 'ma', ten: 'Âm Hồn', baoVat: 'Vạn Hồn Phiên', co: (s.am | 0) + (s.dang | 0), tran: s.tran | (P.LuyenQuy && P.LuyenQuy.tranAmHon ? P.LuyenQuy.tranAmHon(P) : 0), mod: P.LuyenQuy };
    }
    return null;
  }

  // Tự động luyện / mở khiếu con kế tiếp cho MỌI PHE PHÁI khi đủ nguyên liệu.
  // LƯU Ý CHIẾN ĐẤU: Cả 4 phe phái khi bật Tự Động (Auto On), game engine và máy chủ TỰ ĐỘNG điều phối
  // [Âm Hồn / Kiếm Linh / Quyền Ảnh / Mị Điệp] xuất kích, không tốn Linh Lực. Bot tuyệt đối KHÔNG gửi lệnh gọi thủ công
  // để tránh bị máy chủ từ chối và hiện lỗi 'Không được: Âm Hồn tự ra đánh khi bật Tự Động'.
  function tickHonCraft(g) {
    var P = g.P, G = P.Gateway;
    if (!G || !G.connected || !G.cmd) return;
    var s = honState(P);
    if (!s) return;
    var art = factionArtifact(P, s);
    if (!art || !art.mod) return;

    var wantCraft = cfg.honLuyen && (cfg.honRun || (cfg.planRun && cfg.plan_hon) || art.dao !== 'ma' || !cfg.honRun);
    if (wantCraft && now() - (st.honLuyenAt || 0) > HON_LUYEN_GAP_MS) {
      var nextIdx = (art.co | 0) + 1;
      if (art.tran > 0 && nextIdx <= art.tran && art.mod.congThucCon) {
        var reqs = art.mod.congThucCon(nextIdx) || [];
        var enough = reqs.length > 0;
        var I = P.Inventory;
        for (var i = 0; i < reqs.length; i++) {
          var r = reqs[i], have = 0;
          if (P.ChinhDao && r.id === P.ChinhDao.CHINH_KHI) have = s.ck | 0;
          else if (P.ChinhDao && r.id === P.ChinhDao.HIEP_NGHIA) have = s.hn | 0;
          else if (P.ChinhDao && r.id === P.ChinhDao.TRU_MA) have = s.tm | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.PHAM_HON) have = s.pham | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.OAN_HON) have = s.oan | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.TU_SI_HON) have = s.tuSi | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.THU_HON_3) have = s.thu3 | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.THU_HON_4) have = s.thu4 | 0;
          else if (P.LuyenQuy && r.id === P.LuyenQuy.THU_HON_6) have = s.thu6 | 0;
          else if (I && I.count) have = I.count(r.id);
          if (have < r.can) { enough = false; break; }
        }
        if (enough && (!art.mod.xetLuyen || !art.mod.xetLuyen(null, P, s.dang | 0))) {
          st.honLuyenAt = now();
          G.cmd('hon.luyen', { congThuc: 'tiep' }, function (res) {
            if (res && res.hon && P.HonPhienUI && P.HonPhienUI.dat) P.HonPhienUI.dat(res.hon);
            if (res && res.ok !== false) {
              klog('[Bảo bối] Luyện thành công ' + art.ten + ' thứ ' + nextIdx + '/' + art.tran + ' (' + art.baoVat + ')');
              say(art.baoVat + ': Luyện thành ' + art.ten + ' thứ ' + nextIdx);
            } else {
              klog('[Bảo bối] Luyện không được: ' + (res && res.why || ''));
            }
          });
        }
      }
    }
  }

  // Săn người phàm lấy hồn. true = đang đi / đang đuổi (chặn việc khác), false = để đánh / farm như thường.
  function tickHonFarm(g) {
    var P = g.P, L = P.LuyenQuy, me = g.me;
    // Bật "Săn thêm để bán chợ" thì lúc rảnh (không có Thương Đội / việc khác) tự đi săn số dư Phàm Hồn, đủ thì về farm.
    var honOn = cfg.planRun ? planIs('hon') || (cfg.honSell && !(st.plan && st.plan.job)) : (cfg.honRun || cfg.honSell);
    if (!honOn || !cfg.honFarm || !L || st.dc || st.bh || st.bd || st.xc || st.td || st.ga || st.fa) { if (st.hon) honStop(g); return false; }
    if (!st.hon && now() < (st.honRestUntil || 0)) return false; // vừa quét hết người phàm: farm quái chờ họ hồi
    var s = honState(P);
    if (!s || !s.phien) return false;
    var w = honWanted(P, s), want = w.out, kinds = Object.keys(want);
    var a = st.hon, cap = (s.moc && s.moc.tenDo) || 20;
    if (a && a.target && (a.target.dead || a.target.hp <= 0)) { st.huntKillAt = now(); a.target = null; }
    // Thương Nhân / Tiêu Sư (Oán Hồn) đang ở trong tầm nhìn mà còn cần Oán Hồn (con kế tiếp / dư bán chợ): đánh luôn,
    // không chờ phần Săn Thương Đội.
    var wantOan = tdWantMa(P);
    var oanVis = wantOan ? (g.sw.enemies || []).filter(function (m) { return m && m.def && m.def.hon === 'oan_hon' && honCanHit(P, m) && (m.state !== 'return' || m === (a && a.target)); }) : [];
    if (!kinds.length && oanVis.length) {
      if (!a) { a = st.hon = { touches: 0, touchAt: 0, routeAt: 0, travels: 0, at: now(), back: takeBack(g), seenAt: now(), target: null }; honLog('Thấy ' + mobLabel(oanVis[0]) + ' (Oán Hồn) trong tầm → đánh'); }
      if (huntLoot(g, a.target)) { setAuto(g, false); a.step = 'nhặt hồn rơi'; return true; }
      var to = a.target && oanVis.indexOf(a.target) >= 0 ? a.target : evNearest(g, oanVis.slice());
      if (a.target !== to) { a.target = to; a.step = 'săn ' + mobLabel(to) + ' (Oán Hồn) · khu ' + gaKhu(P); }
      a.seenAt = now();
      honStrike(g, a, to, true);
      return true;
    }
    // Đã dừng vì mốc: chờ nghiệp giảm hẳn (HON_RESUME điểm) mới săn lại, khỏi đi về mỗi 10 phút để hạ một con.
    if (w.capped) st.honCapped = true;
    else if (st.honCapped && !cfg.honAllowRed && (s.nghiep | 0) > Math.max(0, cap - HON_RESUME) && !a) { kinds = []; w.capped = true; }
    else st.honCapped = false;
    // Chạm mốc nghiệp: cúng nếu bật và đủ Linh Thạch, không thì dừng săn chờ nghiệp giảm.
    if (!kinds.length) {
      if (w.capped && cfg.honCung && (s.nghiep | 0) > 0 && (P.Progress && (P.Progress.stones | 0) >= (L.GIA_CUNG || 500))) {

  var SWEEP_SEE_R = 110;         // px: tới gần điểm dò chừng này mới tính là đã xem

  var sweepGridCache = {};

  // hạn vùng; whole = luôn dò lưới (mục tiêu không có chỗ sinh cố định: xổng chuồng, Thương Đội đang đi, boss bị kéo).

      // Sau khi diệt xong hiểm hoạ: nếu xe mất máu thì đứng chờ an toàn để game tự hồi phục đầy máu (HOI_AN_TOAN_DPS)

    }

    // 3. Giữ khoảng cách kéo xe (chống đứt dây kéo DAY_KEO = 320px)
    if (cart && cart.d > VT_KEEP) {

      if (st.travel) stopTravel();
      if (cart.d > VT_FAR) {

  /* ================= Thương Đội (Thiên Đạo báo): săn Tiêu Sư / Thương Nhân lấy Oán Hồn ================= */

  var TD_EVENT_MS = 12 * 60000, TD_MAX_MS = 12 * 60000;

  // Từ bản cập nhật 20/10 Thiên Đạo báo trước 20 giây ("… sắp lên đường qua …") rồi đoàn mới hiện → nhận cả hai kiểu.
  var TD_NEWS_RE = /mot thuong doi (?:vua |sap |se |chuan bi )?(?:len duong|xuat phat|di) qua ([^,!.]+?(?:\s*[-–—,]\s*khu\s*\d+)?)(?=\s*[,!.]|\s+(?:sau|trong|nua)\b|$)/;
  var TD_SPAWN_DELAY_MS = 20000;
  function tdLog(m) { klog('[Thương Đội] ' + m); say('Thương Đội: ' + m); }
  // Ma Đạo (Hồn Phiên) săn Thương Nhân / Tiêu Sư lấy Oán Hồn; Chính Đạo (Kiếm Hạp) săn Kiếp Tặc chặn đoàn lấy Hiệp
  // Nghĩa Lệnh. Đánh Tiêu Sư trước (cận chiến, giữ Thương Nhân), rồi tới gần nhất.
  function tdTargets(g) {

  }
  function tdWantMa(P) {

    var need = honNext(P, s), oan = need && need.filter(function (x) { return x.id === 'oan_hon'; })[0];
    var tgt = honSellTarget(s, need, 'oan_hon'); // săn thêm Oán Hồn để bán chợ
    if (!(oan && oan.co < oan.can) && !(tgt && (s.oan | 0) < tgt)) return false;

  function tdWantChinh(P) {

  var TD_DONE_RE = /da ha|bi ha|ha guc|tieu diet|bi cuop|cuop sach|cuop duoc|tan ra|tan tac|giai tan|danh tan|bi diet|den noi|toi noi|ket thuc/;
  function tdDoneText(t) { return /thuong doi|thuong nhan|tieu su/.test(t) && !/(?:vua|sap|se|chuan bi) len duong/.test(t) && TD_DONE_RE.test(t); }

  // Đuổi theo mục tiêu đã nhắm: người phàm chạy ra khỏi tầm nhìn (máy chủ xoá khỏi danh sách) thì tới chỗ …

  // Cổng nó vừa chui qua: cổng gần chỗ thấy lần cuối, hoặc gần chỗ nó sắp tới theo hướng đang chạy.
  function tdPortalOf(g, L) {
    var T = g.P.CONFIG.TILE || 32, px = L.x + L.vx * TD_LEAD_S, py = L.y + L.vy * TD_LEAD_S, best = null;
    (g.sw.map.portals || []).forEach(function (p) {

  function tdChase(g, d) {

  function tdFinish(g, msg) {

  /* ================= Tự hủy trạng thái treo (stale state timeout) ================= */
  var STALE_CHECK_INTERVAL_MS = 2000; // kiểm tra trạng thái treo mỗi 2s

  }
  function tickThuongDoi(g) {
    var P = g.P, me = g.me;
    if (!cfg.tdHunt || me.downed || st.bh || st.bd || vtActive(g) || st.vt) { if (st.td && !cfg.tdHunt) st.td = null; return false; }

      if (!tdWant(P)) {
        tdEvents.forEach(function (e) {

  // Bật / tắt một cài đặt (từ công tắc trong tab hoặc công tắc nhanh) kèm việc đi theo nó.
  function setOpt(k, on) {
    cfg[k] = !!on; userSet(k); save();
    if (k === 'alwaysRun' && !on && window.PNTT) window.PNTT.Input.setRun(false);
    if (k === 'stayFarm' && on && !cfg.farm) say('Nhớ lưu bãi farm trước (tab 🧭 Di chuyển)');
    if (k === 'planRun') { planStop(game()); if (on && !enabled) setEnabled(true); if (on) say('Lịch treo máy: bắt đầu'); }
    if ((k === 'vtRun' || k === 'snRun' || k === 'llRun' || k === 'htRun' || k === 'xcHunt' || k === 'tlRun' || k === 'ltRun' || k === 'vnRun' || k === 'hxRun' || k === 'ylRun') && on && !enabled) setEnabled(true);
    if (k === 'hxRun') { st.hxRest = 0; st.hxWhy = ''; if (!on) st.hx = null; }
    if (k === 'ylRun') { st.ylRest = 0; st.ylWhy = ''; if (!on) st.yl = null; }
    if (k === 'htRun' && on) st.htSkip = null;
    if (k === 'snRun') { st.snRest = 0; if (!on) { snEndSub(game()); st.sn = null; } }
    if (k === 'gatherRun') { st.ga = null; if (on && !enabled) setEnabled(true); if (!on && st.travel) stopTravel(); }
    if (k === 'fishRun') { if (on && !enabled) setEnabled(true); if (!on && st.fish) fishStop(game()); }
    if (k === 'dcRun') {
      st.dc = null; if (st.back && st.back.kind === 'dc') st.back = null;
      if (on) {
        var g0 = game();
        cfg.dcReturn = g0 ? { map: g0.mapId, x: g0.me.x, y: g0.me.y, khu: gaKhu(g0.P) } : null;
        save();
        if (cfg.dcReturn) say('Dược Công: làm xong sẽ về ' + mapName(cfg.dcReturn.map) + ' farm tiếp');
        if (!enabled) setEnabled(true);
      } else if (st.travel) stopTravel();
    }
    if (ui.root) { syncInputs(); refresh(); }
  }

  function place() {
    var h = ui.host;
    if (!h) return;
    if (cfg.ui.x == null) { h.style.left = ''; h.style.right = '8px'; h.style.top = '8px'; return; }

    c.rows.forEach(function (r) {
      var s = stats.skill[r.def.id], cls = r === c.best ? 'best' : r.ok ? '' : 'off';
      html += '<tr class="' + cls + '"><td>' + esc(r.def.short || r.def.name) + (r.n > 1 ? ' ×' + r.n : '') + '</td>' +
        '<td>' + num(r.per) + (r.dot ? '+' + num(r.dot) : '') + '</td>' +
        '<td>' + (s && s.casts ? num(s.dmg / s.casts) : '—') + '</td>' +
        '<td>' + num(r.eff) + '</td>' +
        '<td>' + num(r.mp) + '</td>' +
        '<td>' + (r.eff / Math.max(1, r.mp)).toFixed(1) + '</td>' +
        '<td>' + (r === c.best ? '★' : esc(r.why)) + '</td></tr>';
    });
    ui.optSkills.innerHTML = html + '</table>';
  }

  function refreshKiteLog() {
    var f = cfg.logFilter || 'all', html = '';
    for (var i = kiteLog.length - 1; i >= 0; i--) {
      var e = kiteLog[i];
      if (f !== 'all' && e.cat !== f) continue;
      html += '<div class="' + (e.cat || '') + '"><b>' + e.at.toLocaleTimeString() + '</b> ' + esc(e.msg) + (e.n > 1 ? ' <i>×' + e.n + '</i>' : '') + '</div>';
    }
    ui.kiteLog.innerHTML = html;
  }

  // Một dòng "đang làm gì" dưới thanh máu.
  function doingText(g) {
    if (!enabled) return 'Trợ thủ đang tắt — bấm nút bên dưới để bật';
    if (!g) return 'Chờ vào game';
    if (g.me.downed) return '💀 Trọng thương — chờ hồi sinh';
    if (st.healing) return '🧘 ' + (st.healMoving ? 'Ra chỗ an toàn để thiền' : 'Đang thiền') + ' · máu ' + Math.round(g.me.hp / Math.max(1, g.me.hpMax) * 100) + '%';
    if (st.bh && st.bh.phase !== 'fight') return '👑 Đi đánh ' + bhName(g.P, st.bh.b) + ' · ' + (st.bh.step || { go: 'đang tới ' + mapName(st.bh.b.map), wait: 'chờ boss ra, đánh hộ vệ', loot: 'hút đồ rồi về' }[st.bh.phase] || '');
    if (st.ll) return '🏯 Lãm Làng · ' + (st.ll.step || '');
    if (st.ht) return '📚 Sỹ Sách Điện · ' + (st.ht.step || '');
    if (st.lt || ltIn(g)) return '🌳 Linh Thụ · ' + (st.lt && st.lt.step || '');
    if (st.vn) return '🌀 Vết Nứt · ' + (st.vn.step || '');
    if (st.vnBuy) return '🌀 Vết Nứt · ' + (st.vnBuy.step || 'mua vé');
    if (st.bd) return '🦎 Biến dị · ' + (st.bd.step || '');
    if (st.xc) return '🐂 Xổng chuồng · ' + (st.xc.step || '');
    if (st.tl) return '⚔ Tam Lộ · ' + (st.tl.step || '');
    if (st.td) return '🐎 Thương Đội · ' + (st.td.step || '');
    if (st.vt || vtActive(g)) return '🛒 Vận Tiêu · ' + (st.vt && st.vt.step || 'đang áp tải');
    if (st.fish) return '🎣 Câu Linh Ngư · ' + (st.fish.step || '');
    if (st.sn) return '🏯 Tông môn · ' + (st.sn.step || '');
    if (st.dd) return '📅 Điểm danh';
    if (st.gc) return '📖 Rút Tàng Kinh miễn phí';
    if (st.dc) return '📜 Dược Công · ' + (st.dc.step || 'đang tính bước tiếp');
    if (st.ga) return '⛏ Nhặt NL · ' + (st.ga.step || 'đang tính bước tiếp');
    if (st.fa) return '🌿 Chăm vườn · ' + (st.fa.step || 'đi tới vườn');
    if (st.honBuy) return '🏴 Đi thỉnh Hồn Phiên';
    if (st.hon) return '🏴 Hồn Phiên · ' + (st.hon.step || '');
    if (st.fk) return '🗺 Tìm khu ít người · ' + ({ ask: 'hỏi số người', board: 'tới Bảng Khu', decide: 'chọn khu', 'switch': 'tới Bảng Khu đổi sang khu ' + st.fk.want, wait: 'chờ sang khu ' + st.fk.want }[st.fk.step] || '');
    if (st.back && st.travel) return '🧭 ' + st.back.why;
    if (st.plan && st.travel && st.travel.plan) return '🧭 Lịch: về chỗ farm ' + mapName(st.plan.back.map);
    if (st.travel) return '🧭 Đi tới ' + mapName(st.travel.map);
    if (st.harvest) return '🌿 Thu ' + propName(st.harvest.prop);
    if (st.looting) return st.looting.sweep ? '🧲 Quét nhặt ' + st.looting.list.length + ' vật phẩm rơi' : '🎒 Nhặt ' + dropName(g, st.looting.drop);
    if (st.dodging) return '🌀 Đang né chiêu';
    var t = kiteTarget(g);
    if (t && (t.def || t.name)) {
      var nm = t.def ? mobLabel(t) : t.name || 'Người chơi';
      var cbs = isBoss(t) ? bossShare(t) : null;
      return '🎯 ' + nm + ' · ' + num(t.hp) + '/' + num(t.hpMax) + ' · cách ' + Math.round(dist(g.me.x, g.me.y, t.x, t.y)) + 'px' + (st.kiting ? ' · đang lùi' : '') +
        (cbs ? ' · ' + bossShareText(cbs) : '');
    }
    return g.sw.autoOn ? '⚔ Đang tự chiến — chưa có mục tiêu gần' : 'Chờ';
  }

  // Văn bản dán được: trạng thái hiện tại, cài đặt liên quan, log hit & run (cũ → mới).
  function kiteReport() {
    var g = game(), me = g && g.me, lines = ['[Trợ thủ v' + VERSION + '] log hit & run · ' + new Date().toLocaleString()];
    if (g) {
      lines.push('Map: ' + mapName(g.mapId) + ' · máu ' + Math.round(me.hp) + '/' + Math.round(me.hpMax) +
        ' · linh lực ' + Math.round(me.mp || 0) + '/' + Math.round(me.mpMax || 0) + (me.flying ? ' · đang bay' : '') +
        ' · Tự Động ' + (g.sw.autoOn ? 'bật' : 'tắt') + ' · trợ thủ ' + (enabled ? 'bật' : 'tắt'));
    }
    lines.push('Cài đặt: hit&run ' + (cfg.kite ? 'bật' : 'tắt') + ' · đứng ngoài tầm ' + cfg.kiteGap + 'px · đứng ngoài sau đòn ' +
      cfg.kiteOut + 'ms · né chiêu ' + (cfg.dodge ? 'bật' : 'tắt') + ' · tối ưu chiêu ' + (cfg.optimize ? 'bật' : 'tắt') +
      ' · nhặt đồ ' + (cfg.autoLoot ? 'bật' : 'tắt'));
    lines.push('Trạng thái: ' + (kiteNow || '—'));
    lines.push('Log:');
    kiteLog.forEach(function (e) { lines.push('  ' + e.at.toLocaleTimeString() + ' ' + e.msg + (e.n > 1 ? ' ×' + e.n : '')); });
    if (!kiteLog.length) lines.push('  (trống)');
    return lines.join('\n');
  }

  // Clipboard API cần trang đang được focus; không được thì dùng textarea tạm + execCommand.
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { }
      ta.remove();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else fallback();
  }

  // Xuất / nhập cấu hình để chép sang nhân vật khác. Không chép vị trí bảng, chỗ đứng Dược Công, số đo vũ khí.
  var CFG_SKIP = { ui: 1, dcReturn: 1, splashLearn2: 1 };
  function cfgExport(withFarm, withTg) {
    var src = prioSaved ? Object.assign({}, cfg, prioSaved) : cfg, o = {};
    Object.keys(src).forEach(function (k) { if (!CFG_SKIP[k] && (withFarm || k !== 'farm') && (withTg || k !== 'tgToken')) o[k] = src[k]; });
    return JSON.stringify({ ttbot: VERSION, cfg: o });
  }
  function cfgImport(txt) {
    var j = JSON.parse(String(txt || '').trim()), src = j && j.cfg, n = 0;
    if (!src || typeof src !== 'object') throw new Error('không phải cấu hình trợ thủ');
    Object.keys(src).forEach(function (k) {
      var v = src[k], d = k in cfg ? cfg[k] : DEFAULTS[k];
      if (CFG_SKIP[k] || !(k in DEFAULTS || /^[a-zA-Z]+_[a-zA-Z0-9_]+$/.test(k))) return;
      if (d != null && v != null && typeof d !== typeof v) return;
      cfg[k] = v; userSet(k); n++;
    });
    save(); syncInputs(); refresh();
    return n;
  }

  // Game cập nhật: tải lại trang chủ (game tự gỡ thẻ script sau khi nạp), danh sách file .js .css kèm hash / v=.
  function gameUpdCheck() {
    if (!window.fetch) return;
    window.fetch('/?ttbot=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(gameUpdCmp).catch(function () { });
  }
  function gameUpdCmp(html) {
    var cur = [], re = /(?:src|href)="([^"]+?(?:\.[0-9a-f]{8,}\.(?:js|css)|\.(?:js|css)\?v=[^"]*))"/g, m0;
    while ((m0 = re.exec(html || ''))) if (cur.indexOf(m0[1]) < 0) cur.push(m0[1]);
    cur.sort();
    if (cur.length < 20) return;
    var K = 'ttbot.gameFiles', old = null;
    try { old = JSON.parse(localStorage.getItem(K) || 'null'); localStorage.setItem(K, JSON.stringify(cur)); } catch (e) { }
    if (!old || old.join() === cur.join()) return;
    var base = function (u) { return u.replace(/\.[0-9a-f]{8,}(\.(js|css))$/, '$1').replace(/\?v=.*$/, ''); }, ob = {}, nb2 = {};
    old.forEach(function (u) { ob[base(u)] = u; }); cur.forEach(function (u) { nb2[base(u)] = u; });
    var neu = Object.keys(nb2).filter(function (k) { return !ob[k]; }), chg = Object.keys(nb2).filter(function (k) { return ob[k] && ob[k] !== nb2[k]; }), gone = Object.keys(ob).filter(function (k) { return !nb2[k]; });
    var msg = '🆕 Game vừa cập nhật mã · ' + chg.length + ' file đổi' + (neu.length ? ' · ' + neu.length + ' file mới' : '') + (gone.length ? ' · ' + gone.length + ' file bỏ' : '') + ' · trợ thủ v' + VERSION +
      (neu.length ? '\nFile mới: ' + neu.slice(0, 15).join(', ') : '') + (chg.length ? '\nĐổi: ' + chg.slice(0, 20).join(', ') + (chg.length > 20 ? '…' : '') : '') + '\n→ nhờ Claude tải mã mới về và kiểm tra trợ thủ';
    klog('[Game] ' + msg.split('\n')[0]); say('Game vừa cập nhật mã');
    if (tgReady() && cfg.tgEv_upd !== false) tgSend(msg);
  }

  // Game đòi tải lại trang (hộp lỗi "Tải lại", phiên hết hạn / F5) hoặc rớt mạng >60s thì tự tải lại trang.
  var inWorld = false, netOk = false, dcSince = 0, rlAt = 0, autoOn = false, lastNm = '';
  function netWhy() {
    var G = window.PNTT && window.PNTT.Gateway, e = String(G && G.lastError || '');
    if (document.getElementById('pntt-crash')) return 'game dừng vì lỗi';
    if (G && G.connected) netOk = true;
    if (!G || G.connected || !netOk) { dcSince = 0; return ''; }
    var t = Date.now() - (dcSince = dcSince || Date.now());
    if (/nơi khác/.test(e)) return t > 5000 ? '!' + e : '';
    if (/F5|tải lại/i.test(e) && t > 10000) return e;
    return t > 60000 ? 'mất kết nối ' + Math.round(t / 1000) + 's' : '';
  }
  function netWatch() {
    var g = game();
    if (g) { inWorld = true; lastNm = myName(g) || lastNm; }
    if (g && !autoOn && lastNm) {
      autoOn = true;
      if (onNames()[lastNm] && !enabled) { setEnabled(true); klog('[Mạng] Vào lại game → tự bật lại trợ thủ'); }
    }
    if (!inWorld || rlAt) return;
    var w = netWhy(), who = (lastNm || 'nhân vật') + ' · ';
    if (!w) return;
    if (w[0] === '!') { if (!st.kickTg) { st.kickTg = 1; klog('[Mạng] ' + w.slice(1) + ' → không tự tải lại'); if (tgReady()) tgSend('🔌 ' + who + w.slice(1) + ' → không tự tải lại (sẽ đá phiên bên kia)'); } return; }
    var L = [];
    try { L = JSON.parse(localStorage.getItem('ttbot.rl') || '[]').filter(function (x) { return Date.now() - x < 900000; }); } catch (e) { }
    if (L.length >= 3) { if (!st.rlTg) { st.rlTg = 1; if (tgReady()) tgSend('🔌 ' + who + w + ' · đã tự tải lại 3 lần trong 15 phút → dừng, cần xem tay'); } return; }
    L.push(Date.now());
    try { localStorage.setItem('ttbot.rl', JSON.stringify(L)); } catch (e) { }
    rlAt = Date.now();
    klog('[Mạng] ' + w + ' → tự tải lại trang');
    if (tgReady()) { tgSend('🔌 ' + who + w + ' → tự tải lại trang (F5)' + (onNames()[lastNm] ? ' · trợ thủ sẽ tự bật lại' : '')); tgPump(); }
    setTimeout(function () { location.reload(); }, 4000);
  }

  var waitN = 0;
  var waitPanel = setInterval(function () {
    // 40 giây có màn game mà không thấy dữ liệu game: Tampermonkey đang chạy sandbox mode không thấy window.PNTT
    if (++waitN === 80 && !window.PNTT && document.body && document.querySelector('canvas') && !document.getElementById('ttbot-error')) {
      var nb = document.createElement('div');
      nb.id = 'ttbot-error';
      nb.style.cssText = 'position:fixed;z-index:99999;top:8px;right:8px;max-width:380px;padding:8px 10px;background:#3a0f0c;color:#ffd9d0;border:1px solid #e0604a;font:12px sans-serif;border-radius:6px';
      nb.textContent = 'Trợ thủ ' + VERSION + ' không đọc được dữ liệu game. Mở Tampermonkey → Cài đặt → Chế độ cấu hình: Nâng cao → mục "Sandbox Mode" chọn "JavaScript" (hoặc "Mặc định") → Lưu → F5.';
      document.body.appendChild(nb);
    }
    if (document.body && window.PNTT) {
      clearInterval(waitPanel);
      try {
        gameUpdCheck();
        setInterval(gameUpdCheck, 1800000);
        setInterval(function () { try { netWatch(); } catch (e) { } }, 5000);
      } catch (e) { }
      try { buildPanel(); }
      catch (e) {
        console.error('[TTBot] Lỗi khi dựng bảng trợ thủ', e);
        var box = document.createElement('div');
        box.id = 'ttbot-error';
        box.style.cssText = 'position:fixed;z-index:99999;top:8px;right:8px;max-width:420px;padding:8px 10px;background:#3a0f0c;color:#ffd9d0;border:1px solid #e0604a;font:12px sans-serif;white-space:pre-wrap';
        box.textContent = 'Trợ thủ ' + VERSION + ' lỗi khi dựng bảng:\n' + String(e && e.stack || e).split('\n').slice(0, 4).join('\n');
        document.body.appendChild(box);
      }
    }
  }, 500);

  var netPublicApi = {
    state: netState,
    bus: ServerBus,
    on: ServerBus.on.bind(ServerBus),
    off: ServerBus.off.bind(ServerBus),
    onAny: ServerBus.onAny.bind(ServerBus),
    getHistory: function (op) {
      if (!op) return netState.history.slice();
      return netState.history.filter(function (h) { return h.op === op; });
    },
    getSocket: function () {
      return netState.activeSocket || (window.PNTT && window.PNTT.Gateway && window.PNTT.Gateway.socket);
    }
  };

  window.TTBot = {
    cfg: cfg, st: st, save: save, game: game,
    on: function () { setEnabled(true); }, off: function () { setEnabled(false); },
    goTo: startTravel, stop: stopTravel, speed: devSpeed, kiteLog: kiteLog,
    careFarm: function () { faStart('lệnh'); }, findKhu: function () { fkStart('bấm nút'); }, lootStatsDebug: function () { return lootStats; },
    exportCfg: cfgExport, importCfg: cfgImport,
    dev: {
      eval: function (code) { return eval(code); },
      cleanCaches: cleanCaches,
      checkStaleStates: checkStaleStates,
      tickChienTruong: tickChienTruong,
      btWantMode: btWantMode,
      gradeScore: gradeScore,
      tickHuThien: tickHuThien,
      vnHomStance: vnHomStance,
      vnFight: vnFight,
      vtVnHour: vtVnHour,
      vtVnDay: vtVnDay,
      PLAN_JOBS: PLAN_JOBS,
      tickStandalone: tickStandalone,
      tickLinhThu: tickLinhThu,
      ltIn: ltIn,
      cfgExport: cfgExport,
      cfgImport: cfgImport,
      tgSend: tgSend,
      tgReady: tgReady,
      takeBack: takeBack,
      goBack: goBack,
      tickGoBack: tickGoBack
    },
    net: netPublicApi
  };
  window.__ttNet = netPublicApi;
})(typeof unsafeWindow !== 'undefined' ? unsafeWindow : window);
    document.getElementById('err').textContent = "ALL GOOD: TTBot=" + typeof window.TTBot;
} catch(e) {
    document.getElementById('err').textContent = "CATCH ERROR: " + e.message + "\n" + e.stack;
}
</script>
