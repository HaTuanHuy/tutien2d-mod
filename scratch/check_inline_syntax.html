    return best;
  }
  // Mọi chiêu để chọn: bật "dùng cả chiêu chưa tick" thì lấy mọi chiêu đã học, không thì bảng Tự Động của game.
  function skillPool(g) {
    var S = g.P.Skills, out = S.autoRotation ? S.autoRotation().slice() : [];
    if (cfg.bossAllSkills && S.learnedSlots && S.slotDef) {
      S.learnedSlots().forEach(function (k) { var d = S.slotDef(k); if (d && !d.playerTargetOnly && !d.bienHinh && out.indexOf(d) < 0) out.push(d); });
    }
    return out;
  }

  function isPlayer(t) {
    return !!(t && (t.isPlayer || (!t.def && (t.name != null || t.id != null))));
  }

  // Chấm điểm toàn bộ chiêu (bảng Tự Động, hoặc mọi chiêu đã học) cho một mục tiêu.
  function choose(g, target, d) {
    var S = g.P.Skills, me = g.me, mobs = mobsAlive(g);
    var rows = skillPool(g).map(function (def) { return evalSkill(g, def, target, d, mobs); });
    var boss = isBoss(target);
    var player = isPlayer(target);
    var mpPct = me.mpMax ? me.mp / me.mpMax * 100 : 0;
    var melee = g.P.Player.meleeDamage ? g.P.Player.meleeDamage() : 0;
    // Trụ: đứng trong tầm là ăn đạn, gãy càng nhanh càng đỡ máu → dồn sát thương như boss.
    // Người chơi: PK sinh tử chớp nhoáng → LUÔN dồn sát thương tối đa, không bao giờ rơi vào eco hay save mana.
    var mode = player || boss || isTower(target) || target.ctRecover > 0 || mpPct >= cfg.mpFull ? 'dmg' : mpPct < cfg.mpReserve ? 'save' : 'eco';
    var best = null, why, lh = (!player) ? lastHitPick(g, target, rows) : null, wait = null;
    if (lh && lh.best) return { rows: rows, best: lh.best, mode: 'dmg', why: lh.why, melee: melee, boss: boss };
    if (player) {
      // PK ĐỐI KHÁNG NGƯỜI CHƠI: Smart CC Chaining + Burst dồn nén
      var targetCC = (target.stunT || 0) > 0.3 || (target.freezeT || 0) > 0.3 || (target.rootT || 0) > 0.3;
      rows.forEach(function (r) {
        if (!r.ok || !(r.eff > 0)) return;
        var ccSec = btCcSec(r.def);
        if (!targetCC && ccSec > 0) {
          // Địch chưa bị khống chế: Thưởng cực lớn để mở combat bằng CC
          r.score = r.eff * (1 + ccSec * 2.5);
        } else if (targetCC && ccSec > 0) {
          // Địch đã bị khống chế: Giảm nhẹ điểm chiêu CC trùng lặp, nhường chỗ cho chiêu sát thương dồn
          r.score = r.eff * 0.75;
        } else {
          r.score = r.eff;
        }
        if (!best || r.score > best.score || (r.score === best.score && r.mp < best.mp)) best = r;
      });
      why = best ? ('PK đối kháng → ' + (btCcSec(best.def) > 0 ? 'Khống chế mục tiêu' : 'Dồn sát thương')) : 'Đánh thường';
    } else if (mode === 'dmg') {
      var pl = planSkills(g, rows.filter(function (r) { return !(lh && lh.exclude === r); }));
      if (pl && pl.at <= 0.05 && pl.first.ok) best = pl.first; else if (pl) wait = pl;
    } else if (mode !== 'save') {
      rows.forEach(function (r) {
        if (!r.ok || !(r.eff > 0) || (lh && lh.exclude === r)) return;
        r.score = mode === 'dmg' ? r.eff : r.eff / Math.max(1, r.mp);
        if (!best || r.score > best.score || (r.score === best.score && r.mp < best.mp)) best = r;
      });
    }
    if (player) {
      // Không áp dụng noOverkill cho người chơi vì đối thủ có khiên, phù máu, hộ tâm
    } else if (mode === 'save') why = 'Linh lực < ' + cfg.mpReserve + '% → đánh thường, giữ linh lực';
    else if (best && cfg.noOverkill && !boss && target.hp <= melee && best.n < 2) { best = null; why = 'Một đòn thường là chết → không phí chiêu'; }
    else if (!best && wait) why = 'Chờ ' + (wait.first.def.short || wait.first.def.name) + ' (' + wait.at.toFixed(1) + 's) mở chuỗi mạnh nhất → đánh thường';
    else if (!best) why = 'Không chiêu nào dùng được lúc này → đánh thường';
    else why = (mode === 'dmg' ? (boss ? 'Boss → dồn sát thương' : 'Linh lực dồi dào → dồn sát thương') : 'Tiết kiệm → sát thương / linh lực cao nhất') +
      (best.n > 1 ? ' · trúng ' + best.n + ' con' : '');
    if (lh && lh.exclude) why = lh.why + ' · ' + why;
    return { rows: rows, best: best, mode: mode, why: why, melee: melee, boss: boss };
  }

  function targetAt(g, d) {
    var best = null, gap = 3, me = g.me;
    mobsAlive(g).forEach(function (m) {
      var k = Math.abs(dist(me.x, me.y, m.x, m.y) - d);
      if (k < gap) { gap = k; best = m; }
    });
    // Tìm trong người chơi thù địch ở gần
    hostilePlayers(g).forEach(function (r) {
      if (!r || !isFinite(r.x)) return;
      var k = Math.abs(dist(me.x, me.y, r.x, r.y) - d);
      if (k < gap) { gap = k; best = r; }
    });
    // Tìm theo người chơi đang bị khoá bởi Targeting
    if (!best && g.P && g.P.Targeting) {
      var Tg = g.P.Targeting, kn = Tg.khoaNguoi;
      if (kn && g.P.Gateway && g.P.Gateway.remotes) {
        var locked = g.P.Gateway.remotes[kn];
        if (locked && isFinite(locked.x)) {
          var k = Math.abs(dist(me.x, me.y, locked.x, locked.y) - d);
          if (k < 10) best = locked;
        }
      }
    }
    return best;
  }

  // Thay chỗ Skills.pickAuto: undefined = để game tự chọn, null = đánh thường.
  function optPick(p, d) {
    var g = game();
    if (!g || p !== g.me) return undefined;
    var t = targetAt(g, d);
    if (!t) return undefined;
    var bp = burstPick(g, t, d);
    if (bp !== undefined) return bp;
    if (!cfg.optimize) return undefined;
    var c = choose(g, t, d);
    if (!c.best) return null;
    var ix = g.P.Skills.autoRotation().indexOf(c.best.def);
    return { def: c.best.def, idx: ix < 0 ? 0 : ix };
  }

  /* ================= Xả chiêu vào boss ================= */
  // Auto của game chỉ thử ra chiêu ngay sau mỗi nhát chém, chỉ dùng chiêu đã tick Tự Động, và đo tầm tới TÂM mục tiêu …
  var BURST_APPROACH_MS = 500;
  function burstSkills(g) {
    var S = g.P.Skills;
    return skillPool(g).filter(function (d) { return skillDmg(g, d) > 1 || dotOf(g, d) > 0; });
  }
  // Mục tiêu đáng xả: boss đang khoá, hoặc hộ vệ của boss thế giới đang phải hạ trước.
  function burstTarget(g) {
    var t = st.farmTarget, me = g.me;
    if (!t || t.dead || !t.def || t.hp <= 0 || (g.sw.enemies || []).indexOf(t) < 0 || dist(me.x, me.y, t.x, t.y) > 420) return null;
    if (isBoss(t)) return t;
    var wb = worldBossNear(g) || (st.bh && st.bh.boss) || anyBossNear(g) || nearBoss(g);
    return wb && wb.def && wb.def.hoVe === t.type ? t : null;
  }
  // Chọn chiêu xả vào boss t ở khoảng cách d: {row, lh, rows} (row = chiêu tung được lúc này, có thể null).
  function burstChoice(g, t, d) {
    var rows = burstSkills(g).map(function (def) { return evalSkill(g, def, t, d, mobsAlive(g)); });
    var lh = lastHitPick(g, t, rows), best = lh && lh.best && lh.best.ok ? lh.best : null, wait = null;
    if (!best) {
      var pl = planSkills(g, rows.filter(function (r) { return !(lh && lh.exclude === r); }));
      if (pl && pl.at <= 0.05 && pl.first.ok) best = pl.first; else if (pl) wait = pl;
    }
    return { row: best, lh: lh, rows: rows, wait: wait };
  }
  // Chỗ game chọn chiêu cho auto (gọi ngay khi vừa vung / niệm xong): đang đánh boss thì đưa chiêu xả. undefined = không áp dụng.
  function burstPick(g, t, d) {
    if (!cfg.bossBurst || t !== burstTarget(g) || (st.ll && st.ll.hold > now())) return undefined;
    var c = burstChoice(g, t, d);
    if (!c.row) return c.wait ? null : undefined; // đang chờ chiêu mạnh hồi: đánh thường chứ không tung chiêu yếu
    var list = g.P.Skills.autoRotation(), idx = list.indexOf(c.row.def);
    st.burstWhy = c.lh && c.lh.best ? 'kết liễu' : '';
    return { def: c.row.def, idx: idx < 0 ? 0 : idx };
  }
  function tickBossBurst(g) {
    if (!cfg.bossBurst || !enabled || st.contest) return false;
    var P = g.P, S = P.Skills, PL = P.Player, me = g.me;
    if (!S || !S.dmgOf || !PL || !PL.castSpell || me.downed || me.state === 'sit' || st.healing || st.dodging) return false;
    if (st.ll && st.ll.hold > now()) return false; // Lãm Làng đang giữ chỗ hợp lực (Tà Soái bất hoại lúc Trận Nhãn)
    var t = burstTarget(g);
    if (!t || g.P.Input.hasManualMove()) { st.burstStep = false; return false; }
    var d = dist(me.x, me.y, t.x, t.y), ch = burstChoice(g, t, d), rows = ch.rows, lh = ch.lh, best = ch.row;
    if (best) {
      // Auto đang bật: game tự tung đúng chiêu này qua pickAuto ngay khi đòn đang ra xong. Auto tắt (vừa bước vào) thì tự tung.
      if (g.sw.autoOn && st.burstStep !== true) return false;
      if (me.state === 'attack' || me.state === 'pose') return false; // để đòn đang ra xong đã
      me.dir = dirToward(t.x - me.x, t.y - me.y);
      me.castTarget = t;
      var ok = best.def.thunder ? PL.castThunder(me) : PL.castSpell(me, best.def);
      if (ok !== true) { me.castTarget = null; return false; }
      klog('[Xả chiêu] ' + (best.def.short || best.def.name) + ' → ' + mobLabel(t) + ' (' + num(t.hp) + '/' + num(t.hpMax) + ')' + (lh && lh.best ? ' · kết liễu' : ''));
      st.burstStep = false;
      return true;
    }
    // Chiêu mạnh hồi xong, đủ linh lực mà chỉ thiếu tầm (đo tới tâm boss): bước sát vào cho vừa tầm.
    var near = rows.filter(function (r) { return !r.ok && /^xa/.test(r.why) && r.eff > 0 && !(lh && lh.exclude === r); })
      .sort(function (a, b) { return b.eff - a.eff; })[0];
    if (!near) return false;
    var R = skillRange(g, near.def), want = Math.max(8, R - 10);
    if (d <= want) return false;
    // Auto của game đứng ở tầm chém và dừng mọi bước khác → tạm tắt auto, bước vào, tung xong auto tự bật lại.
    st.burstStep = true;
    setAuto(g, false);
    if (me.path && me.path.length && now() - (st.burstMoveAt || 0) < BURST_APPROACH_MS) return true;
    var k = (d - want) / d, r2 = spotCheck(g).route(me.x + (t.x - me.x) * k, me.y + (t.y - me.y) * k);
    if (!r2) { st.burstStep = false; return false; }
    st.burstMoveAt = now();
    moveFighting(g, r2.path);
    kiteNow = 'Xả chiêu: bước vào cho vừa tầm ' + (near.def.short || near.def.name) + ' (' + Math.round(R) + 'px)';
    return true;
  }

  /* --- đo sát thương thực tế --- */
  function statOf(id) { return stats.skill[id] || (stats.skill[id] = { casts: 0, dmg: 0, hits: 0, mp: 0 }); }

  // Gán cú đánh cho hành động gần nhất của mình (chiêu hoặc đòn thường) trong 3 giây.
  function noteHit(m, dmg) {
    if (!(dmg > 0)) return;
    var act = st.lastAct && now() - st.lastAct.at < 3000 ? st.lastAct.id : MELEE;
    var s = statOf(act);
    s.dmg += dmg; s.hits++;
    stats.dmg += dmg;
    if (act === MELEE) { noteSwingHit(); splashHit(m); }
    if (m && isBoss(m)) bossHitAt.set(m, now());
    if (m) {
      if (!m._ttFirst || now() - m._ttLast > 8000) m._ttFirst = now();
      m._ttLast = now();
    }
  }

  function hookGame(P) {
    if (hooked || !P.Skills || !P.Skills.pickAuto || !P.Player || !P.SceneWorld) return;
    hooked = true;
    var S = P.Skills, PL = P.Player, SW = P.SceneWorld;
    var pick = S.pickAuto;
    S.pickAuto = function (p, d) {
      var r = enabled && (cfg.optimize || cfg.bossBurst) ? optPick(p, d) : undefined;
      return r === undefined ? pick.apply(this, arguments) : r;
    };
    function wrapCast(name, defOf) {
      var orig = PL[name];
      if (!orig) return;
      PL[name] = function (pl) {
        var g = game(), def = defOf(arguments), cost = g && def ? skillCost(g, def) : null;
        var r = orig.apply(this, arguments);
        if (r === true && g && pl === g.me && def) {
          lastStrikeAt = now();
          st.lastAct = { id: def.id, at: now() };
          var s = statOf(def.id);
          s.casts++; s.mp += cost.mp; stats.mp += cost.mp;
        }
        return r;
      };
    }
    wrapCast('castSpell', function (a) { return a[1]; });
    wrapCast('castThunder', function () {
      var list = S.autoRotation();
      for (var i = 0; i < list.length; i++) if (list[i].thunder) return list[i];
      return { id: 'thunder', thunder: true };
    });
    var atk = PL.attack;
    if (atk) PL.attack = function (pl, target) {
      var g = game();
      // Quái sắp ra khỏi tầm lúc đòn trúng: không vung hụt, đuổi tới chỗ nó sắp tới.
      if (enabled && cfg.kite && g && pl === g.me && pl.state !== 'attack' && pl.state !== 'pose' && !(target && target.def && target.def.tieuXa)) {
        var miss = swingWouldMiss(g, pl, target);
        if (miss) { chaseTo(g, target, miss); return false; }
      }
      var r = atk.apply(this, arguments);
      if (r !== false && g && pl === g.me && pl.state === 'attack') {
        st.lastAct = { id: MELEE, at: now() };
        statOf(MELEE).casts++;
      }
      return r;
    };
    // Online: máy chủ báo số sát thương mình gây ra qua đây.
    var fx = SW.showHitFx;
    if (fx) SW.showHitFx = function (m, dmg) {
      noteHit(m, +dmg || 0);
      return fx.apply(this, arguments);
    };
  }

  // Offline không có báo cáo từ máy chủ: máu quái tụt chính là sát thương mình gây ra.
  // Mỗi tick cũng đếm quái mình đánh đã chết và EXP nhận được.
  var lastHp = new WeakMap(), lastExp = null;
  function tickStats(g) {
    trackBossHp(g);
    var online = !!(g.P.Gateway && g.P.Gateway.connected);
    (g.sw.enemies || []).forEach(function (m) {
      if (!m) return;
      var prev = lastHp.get(m);
      if (!online && prev != null && m.hp < prev) noteHit(m, prev - Math.max(0, m.hp));
      lastHp.set(m, m.dead ? 0 : m.hp);
      if (m.dead && m._ttLast && now() - m._ttLast < 3000) {
        stats.kills++;
        stats.killSec += (m._ttLast - m._ttFirst) / 1000;
        m._ttLast = 0;
      }
    });
    var exp = g.P.Progress && g.P.Progress.exp;
    if (typeof exp === 'number') {
      if (lastExp != null && exp > lastExp) stats.exp += exp - lastExp;
      lastExp = exp;
    }
  }

  /* ================= Hồi sinh ================= */
  function tickRevive(g) {
    var me = g.me;
    if (!me.downed) { st._wasDowned = false; return false; }
    if (tlIn(g)) { st.healing = false; st.travel = null; return true; } // Tam Lộ: game tự hồi sinh ở căn cứ
    st.healing = false;
    st.travel = null;
    if (!st._wasDowned) {
      st._wasDowned = true;
      st.recentDeaths = (st.recentDeaths || []).filter(function (t) { return now() - t < 15000; });
      st.recentDeaths.push(now());
    }
    if (!cfg.autoRevive) return true;
    var isBossContext = !!(st.bh || worldBossNear(g) || anyBossNear(g) || nearBoss(g) || now() - (st.bossSeenAt || -1e9) < 60000 || now() < (st.wbLootUntil || 0));
    var rdelay = isBossContext || (st.td && st.td.seen) ? 0 : cfg.reviveDelay;
    if ((me.downTime || 0) < rdelay) return true;
    var deathStreak = (st.recentDeaths || []).length;
    // Chống vòng lặp hồi sinh tự sát: nếu chết liên tiếp (>= 2 lần trong 15s), tăng giãn cách lên ít nhất 4.5s để dứt hiệu ứng thiêu đốt/độc
    var minReviveInterval = isBossContext ? (deathStreak >= 2 ? 4500 : 2500) : 3000;
    if (st.lastRevive > 0 && now() - st.lastRevive < minReviveInterval) return true;
    st.lastRevive = now();
    var ok = false;
    // Trong PK / cướp tiêu: nếu có địch thù địch đứng canh xác (< 250px) mà vừa gục liên tiếp >= 2 lần, không gượng dậy tại chỗ nạp mạng
    var pkCamped = (st.ct || !isBossContext) && hostilePlayers(g).some(function (p) { return dist(me.x, me.y, p.x, p.y) < 250; });
    var canSpotRevive = me.reviveLeft !== 0 && (!pkCamped || deathStreak < 2);
    // Đang săn / đánh boss: luôn ưu tiên gượng dậy tại chỗ ngay lập tức để không mất mốc và vị trí bốc thăm
    if ((isBossContext || cfg.reviveMode === 'spot') && canSpotRevive) {
      ok = !!g.sw.reviveOnSpot();
      if (ok) {
        var inBc = inDungeon2(g);
        say(inBc ? 'Bí cảnh: Gượng dậy tại chỗ!' : 'Boss: Gượng dậy tại chỗ ngay!');
        klog((inBc ? 'Bí cảnh' : 'Boss') + ': Gượng dậy tại chỗ để tiếp tục gây sát thương');
        if (cfg.autoShield) talUse(g, 'kim_giap', 'gượng dậy đánh boss');
        if (cfg.autoMpTal) talUse(g, 'kim_long_phu', 'gượng dậy đánh boss');
        st.reviveGraceUntil = now() + 3500; // 3.5s đệm an toàn sau khi gượng dậy để không sốc chết ngay lập tức
        if (inBc) {
          // Trong bí cảnh sau khi gượng dậy với máu thấp: rút lui an toàn thiền hồi máu trước khi vào lại
          say('Bí cảnh: Gượng dậy → lùi ra thiền hồi phục');
          klog('Bí cảnh: Gượng dậy tại chỗ, máu thấp → an toàn thiền hồi phục');
          st.healing = true;
          st.healMoving = false;
        } else {
          // Boss thế giới: khô máu dồn tối đa sát thương, gượng dậy là tấn công tiếp ngay
          setAuto(g, true);
        }
      }
    }
    if (!ok && g.sw.reviveAtHome) {
      st.stayFarmPaused = false;
      g.sw.reviveAtHome();
      say('Hồi sinh về làng');
    }
    return true;
  }

  /* ================= Sát thương đang nhận ================= */
  // Ghi lại máu tụt trong vài giây gần nhất để biết đang mất bao nhiêu máu mỗi giây. Máu tụt
  // khi đang đứng trong tầm với của quái thì coi như con đó vừa chém: nó đang hồi đòn.
  var INCOMING_WIN = 4000;   // ms cửa sổ tính máu mất mỗi giây
  var SWING_DMG_SHARE = 0.5; // mất ít nhất phần này của sát thương chạm mới tính là bị chém (giáp có thể đỡ bớt)
  var hpLog = [], lastMyHp = null;

  function tickIncoming(g) {
    var me = g.me, t = now();
    if (lastMyHp != null && !me.downed && me.hp < lastMyHp) {
      var lost = lastMyHp - me.hp;
      hpLog.push({ t: t, d: lost });
      // Chỉ cú mất máu cỡ một đòn cắn mới là quái vừa chém; độc / bỏng nhỏ giọt không tính.
      mobsAlive(g).forEach(function (m) {
        if (!(m.def.contactDmg > 0) || lost < m.def.contactDmg * SWING_DMG_SHARE) return;
        if (dist(me.x, me.y, m.x, m.y) <= mobBaseReach(g, m) + 20) markSwing(m);
      });
    }
    lastMyHp = me.downed ? null : me.hp;
    while (hpLog.length && t - hpLog[0].t > INCOMING_WIN) hpLog.shift();
  }

  // Máu mất mỗi giây: lấy lớn hơn giữa số đo thật và ước tính từ quái đang áp sát
  // (sát thương chạm / thời gian hồi đòn của từng con).
  function incomingDps(g) {
    var me = g.me, sum = 0;
    hpLog.forEach(function (e) { sum += e.d; });
    var measured = sum / (INCOMING_WIN / 1000), est = 0;
    mobsAlive(g).forEach(function (m) {
      if (!(m.def.contactDmg > 0)) return;
      if (dist(me.x, me.y, m.x, m.y) <= mobBaseReach(g, m) + KITE_SCAN) est += m.def.contactDmg / (m.def.hitCooldown || 1);
    });
    return Math.max(measured, est);
  }

  /* ================= Thiền hồi máu ================= */
  var HEAL_SEARCH = 800;     // px tìm chỗ an toàn quanh mình (cách cũ, khi tìm theo lưới không ra)
  var HEAL_PLAN_R = 20;      // ô quanh mình tìm chỗ thiền theo lưới
  var HEAL_MIN_ROOM = 0.65;  // chỗ thiền nên thoáng ít nhất chừng này (cách tường ≥ 1–2 ô)
  var HEAL_LEAD_PAD = 0.8;   // giây cộng thêm vào thời gian chạy ra chỗ an toàn (quay người, né vật cản)
  var HEAL_REPLAN_MS = 6000; // đi tới chỗ thiền lâu hơn chừng này thì tìm chỗ khác
  var SIT_KEEP = 0.8;        // đang ngồi thì quái phải vào sâu hơn mới đứng dậy dời chỗ

  // Vùng không nên ngồi: quanh quái hung hăng (tự lao vào) hoặc quái đang đuổi / đang chém,
  // rộng bằng tầm phát hiện của nó nếu tầm đó lớn hơn healSafe; cộng thêm vùng chiêu.
  function healDanger(g) {
    var out = [];
    mobsAlive(g).forEach(function (m) {
      if (!(m.def.contactDmg > 0)) return;
      if (!(m.def.aggro > 0) && m.state !== 'chase' && m.attackState !== 'telegraph') return;
      var r = Math.max(cfg.healSafe, (m.def.aggro || 0) + 40);
      out.push({ x: m.x, y: m.y, x2: m.x, y2: m.y, r: r });
    });
    return out.concat(hazards(g), towerZones(g));
  }

  // Trả về true khi đang đi ra chỗ an toàn (chưa ngồi).
  function healMove(g) {
    var me = g.me, danger = healDanger(g), keep = me.state === 'sit' ? SIT_KEEP : 1;
    var unsafe = danger.some(function (h) { return segDist(h, me.x, me.y) < h.r * keep; });
    if (!unsafe) { st.healMoving = false; st.healTo = null; return false; }
    var t = st.healTo;
    if (st.healMoving && t && me.path && me.path.length && now() - st.healAt < HEAL_REPLAN_MS &&
      !inHazard(danger, t.x, t.y)) return true;
    // Chỗ thiền: ưu tiên hẳn chỗ rộng (ngồi trong góc là bị vây không đường chạy); không có mới lấy chỗ hẹp.
    var threats = threatsOf(g), outside = function (x, y) { return !inHazard(danger, x, y); };
    var hopt = { radius: HEAL_PLAN_R, avoid: hazards(g), wT: 0.3, wO: FAR_W_ROOM, wM: 0.6 };
    var r = planEscape(g, threats, outside, Object.assign({ minRoom: HEAL_MIN_ROOM }, hopt)) ||
      planEscape(g, threats, outside, hopt) || escapePath(g, danger, HEAL_SEARCH, 40);
    if (!r) {
      if (st.healMoving) say('Không tìm được chỗ an toàn → thiền tại chỗ');
      st.healMoving = false;
      return false;
    }
    moveFighting(g, r.path);
    st.healTo = r.to;
    st.healAt = now();
    if (!st.healMoving) say('Ra chỗ an toàn để thiền');
    st.healMoving = true;
    return true;
  }

  // Boss thế giới (Xích Long, Linh Hổ, Song Dực Ma Báo…; không phải boss bí cảnh): đồ chia theo sát
  // thương gây lên boss, nên đang đánh thì không ngồi thiền, đang ngồi thì đứng dậy đánh tiếp.
  var WORLD_BOSS_R = 600;
  function isWorldBoss(g, m) {
    if (!m || !m.def || inDungeon(g)) return false;
    return BOSS_TABLE.some(function (b) { return b.type === m.type; }) || m.type === 'nhen_bach_ngoc' || (isBoss(m) && (m.def.respawnSec || 0) >= 3600);
  }
  // Đồ boss bốc thăm (máy chủ, 04/10): có vé khi đánh ≥ ngưỡng (≈1% máu boss), còn sống, đứng trong ~22 ô quanh chỗ …
  function bossCapped(g, wb) {
    var cb = wb && bossShare(wb);
    if (!cb) return false;
    if (cb.st === 1) return true; // Trạng thái 1 của CongBossUI chính là "ĐỦ điều kiện nhận đồ"
    var target = cb.ng || cb.tr || 0;
    return target > 0 && (cb.my || 0) >= target;
  }
  function worldBossNear(g) {
    var me = g.me;
    return mobsAlive(g).filter(function (m) { return isWorldBoss(g, m) && dist(me.x, me.y, m.x, m.y) <= WORLD_BOSS_R; })[0] || null;
  }

  function tickHeal(g) {
    if (tlIn(g)) { st.healing = false; return; } // Tam Lộ cấm đả tọa: phần Tam Lộ tự về suối
    if (st.ll && st.ll.hold > now()) { // Lãm Làng đang Huyết Ấn / Xích / Trận Nhãn: phải đứng đúng chỗ, không ngồi
      if (st.healing || g.me.state === 'sit') { st.healing = false; st.healMoving = false; if (g.me.state === 'sit') g.P.Input.pressMeditate(); }
      return;
    }
    var inBc = inDungeon2(g);
    var wb = !inBc && (worldBossNear(g) || (st.bh && st.bh.boss) || anyBossNear(g) || nearBoss(g));
    if (wb && cfg.bossNoSit) {
      if (st.healing || g.me.state === 'sit') {
        st.healing = false; st.healMoving = false;
        if (g.me.state === 'sit') g.P.Input.pressMeditate();
        klog('Đang đánh boss ' + mobLabel(wb) + ' → không thiền, liên tục dồn tối đa sát thương');
      }
      return;
    }
    if (!cfg.healSit) { st.healing = false; return; }
    var me = g.me;
    if (!me.hpMax) return;
    var pct = me.hp / me.hpMax * 100;
    var sitting = me.state === 'sit';

    if (!st.healing && me.canMeditate) {
      if (pct < cfg.healLow) {
        st.healing = true;
        say('Máu ' + pct.toFixed(0) + '% → ngồi thiền');
      } else if (cfg.healEarly && pct < cfg.healHigh) {
        // Thời gian cần để chạy ra khỏi vùng nguy hiểm rộng nhất quanh mình.
        var dps = incomingDps(g), far = 0;
        healDanger(g).forEach(function (h) { far = Math.max(far, h.r - segDist(h, me.x, me.y)); });
        var C = g.P.CONFIG.PLAYER, v = (me.speed || C.SPEED) * (g.P.Input.run ? C.RUN_MULT || 1 : 1);
        var lead = far > 0 ? far / Math.max(1, v) + HEAL_LEAD_PAD : 0;
        var floor = me.hpMax * cfg.healLow / 100;
        if (dps > 0 && lead > 0 && me.hp - dps * lead <= floor) {
          st.healing = true;
          say('Mất ~' + Math.round(dps) + ' máu/giây, cần ' + lead.toFixed(1) + 's chạy ra → rút sớm (' + pct.toFixed(0) + '%)');
        }
      }
    }
    if (!st.healing) return;
    // Player.sit tự hạ cánh nếu đang bay, nên phải nhớ trước lúc ngồi.
    if (me.flying) { st.reFly = true; st.flyTries = 0; }

    if (pct >= cfg.healHigh) {
      st.healing = false;
      st.healMoving = false;
      if (sitting) g.P.Input.pressMeditate();
      say('Máu ' + pct.toFixed(0) + '% → đi tiếp');
      return;
    }
    setAuto(g, false);
    if (healMove(g)) return;
    if (me.path && me.path.length) me.stop();
    // Vừa bị người đánh thì game khoá thiền vài giây — chờ rồi thử lại.
    if (!sitting && !(me.meditatePvpLock > 0) && !g.sw.autoOn && now() - st.lastSitPress > 700) {
      st.lastSitPress = now();
      g.P.Input.pressMeditate();
    }
  }

  /* ================= Bay lại sau khi thiền ================= */
  // Bấm Phi Hành (= phím F) như người chơi. Ở vùng cấm bay hoặc chưa đủ cảnh giới / chưa đeo
  // pháp khí bay thì chờ; bấm vài lần không lên được thì thôi.
  var FLY_RETRY_MS = 1500;   // giữa hai lần bấm phi hành
  var FLY_MAX_TRIES = 4;

  // Luôn bay: chưa bay thì bấm Phi Hành, trừ lúc thiền / đi ra chỗ thiền, lúc câu cá, chặt cây, …
  var ALWAYS_FLY_REST_MS = 15000;
  var alwaysFlyRestUntil = 0, alwaysFlyTries = 0;
  function tickAlwaysFly(g) {
    var me = g.me, PL = g.P.Player, sw = g.sw;
    if (!cfg.alwaysFly || vtActive(g) || st.vt) return;
    if (me.flying) { alwaysFlyTries = 0; return; }
    if (st.healing || me.state === 'sit' || me.downed || st.reFly) return;
    if (sw.fishing || sw.fishingAuto || sw.chopping || chan || (st.looting && st.looting.hold)) return;
    if (busyUI(g.P) || now() < alwaysFlyRestUntil) return;
    if (PL.canFly && !PL.canFly(me)) return;
    if (PL.inNoFlyZone && PL.inNoFlyZone(me, sw.map)) return;
    if (now() - st.lastFlyPress < FLY_RETRY_MS) return;
    if (alwaysFlyTries >= FLY_MAX_TRIES) {
      alwaysFlyTries = 0;
      alwaysFlyRestUntil = now() + ALWAYS_FLY_REST_MS;
      say('Luôn bay: bấm Phi Hành không lên được → thử lại sau ' + ALWAYS_FLY_REST_MS / 1000 + 's');
      return;
    }
    alwaysFlyTries++;
    st.lastFlyPress = now();
    g.P.Input.pressFlyToggle();
  }

  // Nhận xe thì game tự hạ cánh và cấm bay suốt chuyến. Nhớ lúc trước đó có đang bay không; chuyến xong (giao / bị cướp / huỷ)
  // thì dọn trạng thái áp tiêu cũ (st.vt còn sót làm "Luôn bay" tưởng vẫn đang áp tiêu) và bay lại.
  function tickVtFly(g) {
    var ch = vtChuyen(g.P), me = g.me;
    if (!ch && me.flying) st.flySeenAt = now();
    if (ch && !st.vtHad) { st.vtHad = true; st.vtFly = cfg.alwaysFly || now() - (st.flySeenAt || -1e9) < 8000; }
    else if (!ch && st.vtHad) {
      st.vtHad = false;
      if (st.vt && !(cfg.vtRun || planIs('vt'))) st.vt = null;
      if (st.vtFly && !me.flying) { st.reFly = true; st.flyTries = 0; say('Vận tiêu xong → lên phi kiếm lại'); klog('[Vận Tiêu] Xong chuyến → lên phi kiếm lại'); }
      st.vtFly = false;
    }
  }
  function tickReFly(g) {
    if (!st.reFly || st.healing) return;
    if (vtActive(g)) { st.reFly = false; return; }
    var me = g.me, PL = g.P.Player;
    if (!cfg.reFly || me.flying) {
      if (me.flying && cfg.reFly) say('Thiền xong → bay lại');
      st.reFly = false;
      return;
    }
    if (me.state === 'sit' || me.downed) return;
    if (PL.canFly && !PL.canFly(me)) { st.reFly = false; return; }
    if (PL.inNoFlyZone && PL.inNoFlyZone(me, g.sw.map)) return;
    if (now() - st.lastFlyPress < FLY_RETRY_MS) return;
    if (st.flyTries >= FLY_MAX_TRIES) { st.reFly = false; say('Không bay lại được'); return; }
    st.flyTries++;
    st.lastFlyPress = now();
    g.P.Input.pressFlyToggle();
  }

  /* ================= Nhặt đồ ================= */
  // Nhặt đồ không chủ: đi tới tận nơi (auto vẫn đánh dọc đường), tới thì đứng yên chờ máy chủ cho nhặt.
  var LOOT_FIGHT_R = 400;     // px: còn quái trong khoảng này thì chưa đi nhặt
  var LOOT_FIGHT_R_DUNGEON = 900;
  var LOOT_WAIT_MS = 1200;    // đứng trên đồ chừng này mà chưa nhặt được thì bước vào đúng chỗ đồ
  var LOOT_GIVEUP_MS = 5000;  // đi mãi không tới thì bỏ qua món đó một lúc
  var LOOT_SKIP_MS = 20000;
  var lootSkip = {};

  function inDungeon(g) {
    var G = g.P.Gateway;
    return !!(HUYET_MAPS[g.mapId] || (G && G.party && G.party.activeRunId));
  }

  // Còn địch phải đánh quanh mình (quái đang về chỗ cũ thì thôi, nó không quay lại đánh).
  function stillFighting(g) {
    var me = g.me, R = inDungeon(g) ? LOOT_FIGHT_R_DUNGEON : LOOT_FIGHT_R;
    return mobsAlive(g).some(function (m) {
      return m.def.contactDmg > 0 && m.state !== 'return' && dist(me.x, me.y, m.x, m.y) <= R;
    }) || hostilePlayers(g).some(function (r) { return dist(me.x, me.y, r.x, r.y) <= R; });
  }

  function dropName(g, r) {
    var it = r.itemId && g.P.ITEMS && g.P.ITEMS[r.itemId];
    return it ? it.name : r.name || r.itemId || 'vật phẩm';
  }

  // Bảo vật Hư Thiên (ht + vanMs) không nhặt ngay: đứng yên trong Loot.PICK_R thì game tự gửi lệnh
  // vận (HuThienUI.dungTrenBaoVat), vận hỏng thì game tự chờ (htBo) rồi mới cho thử lại.
  function channelDrop(r) { return !!(r && r.ht && r.vanMs > 0); }

  // Đếm mạch khoáng / linh thảo nhặt được (resource.harvest thành công) cho thống kê.
  function hookHarvestStats(P) {
    var G = P.Gateway;
    if (!G || G._ttHv || !G.cmd) return;
    G._ttHv = true;
    var cmd = G.cmd;
    G.cmd = function (name, args, cb) {
      if (name === 'resource.harvest' && args && args.propId) {
        var pid = args.propId, cb0 = cb;
        cb = function (res) { noteHarvest(game(), pid, res); if (cb0) cb0.apply(this, arguments); };
      }
      return cmd.call(this, name, args, cb);
    };
  }

  // Đồ của mình: sau Loot.AUTO_SECS game tự gửi lệnh nhặt, đồ bay về dù đứng đâu.
  function ownPull(P, r) {
    var L = P.Loot, G = P.Gateway;
    return !!(r && r.kind === 'item' && L && L.autoPull && L.AUTO_SECS != null && L.autoPull(r, G && G.selfId, L.AUTO_SECS));
  }

  function lootable(g, r, force) {
    var P = g.P, G = P.Gateway, L = P.Loot, self = G && G.selfId;
    if (!r || r.state !== 'ground' || r.granted) return false;
    if (r.lootId != null && lootSkip[r.lootId] > now()) return false;
    if (r.ht) return channelDrop(r) && !(r.htBo > Date.now());
    if (r.kind === 'item') {
      if (!lootFilterOk(P, r.itemId)) return false;
      if (L && L.canPick && G && G.connected && !L.canPick(r, self, r.age)) return false;
      // Đồ của mình: game tự hút về sau vài giây; bật "Chạy nhặt ngay" hoặc ép nhặt (force=true khi rời map / săn boss / xổng chuồng) thì vẫn chạy tới nhặt luôn cho khỏi chờ.
      if (!cfg.runLoot && !force && ownPull(P, r)) return false;
      if (P.Inventory && P.Inventory.canFit && !P.Inventory.canFit(r.itemId)) return false;
    }
    return true;
  }

  // Hút vật phẩm rơi: nhiều món quanh mình thì vạch một đường đi qua đúng chỗ từng món (món gần …
  var SWEEP_MIN = 2;          // từ chừng này món trở lên mới quét một vòng
  var SWEEP_PAD_MS = 2500;    // thời gian quét = quãng đường / tốc độ + chừng này
  var SWEEP_NEAR = 24;        // đi ngang cách tâm món chừng này là đủ: còn ở trong 40px ~0.5s, dư cho máy chủ trễ

  // Thứ tự đi: món gần nhất kế tiếp, rồi gỡ các đoạn chéo nhau (2-opt) cho đường ngắn lại.
  function sweepOrder(x0, y0, list) {
    var rest = list.slice(), order = [], x = x0, y = y0;
    while (rest.length) {
      rest.sort(function (a, b) { return dist(x, y, a.x, a.y) - dist(x, y, b.x, b.y); });
      var r = rest.shift(); order.push(r); x = r.x; y = r.y;
    }
    function pt(k) { return k < 0 ? { x: x0, y: y0 } : order[k]; }
    for (var pass = 0, better = true; better && pass < 20; pass++) {
      better = false;
      for (var a = 0; a < order.length - 1; a++) {
        for (var b = a + 1; b < order.length; b++) {
          var A = pt(a - 1), B = order[a], Cc = order[b], D = order[b + 1];
          var before = dist(A.x, A.y, B.x, B.y) + (D ? dist(Cc.x, Cc.y, D.x, D.y) : 0);
          var after = dist(A.x, A.y, Cc.x, Cc.y) + (D ? dist(B.x, B.y, D.x, D.y) : 0);
          if (after + 0.5 < before) { order = order.slice(0, a).concat(order.slice(a, b + 1).reverse(), order.slice(b + 1)); better = true; }
        }
      }
    }
    return order;
  }

  function lootSweep(g, cands) {
    var list = cands.filter(function (r) { return !channelDrop(r); });
    if (list.length < SWEEP_MIN) return false;
    var me = g.me, P = g.P, map = g.sw.map, C = P.CONFIG.PLAYER, T = P.CONFIG.TILE || 32;
    var hw = C.HITBOX_W / 2, hh = C.HITBOX_H, sc = spotCheck(g);
    var order = [], path = [], x = me.x, y = me.y, len = 0;
    function walk(pt) { len += dist(x, y, pt.x, pt.y); x = pt.x; y = pt.y; path.push(pt); }
    sweepOrder(me.x, me.y, list).forEach(function (r) {
      var d = dist(x, y, r.x, r.y);
      if (d <= SWEEP_NEAR) { order.push(r); return; }
      // Điểm dừng: trên đường tới món đồ, cách tâm SWEEP_NEAR.
      var k = (d - SWEEP_NEAR) / d, tx = x + (r.x - x) * k, ty = y + (r.y - y) * k;
      if (map.lineClear ? map.lineClear(x, y, tx, ty, hw, hh) : true) {
        if (sc.portals.length && pathCrosses({ me: { x: x, y: y } }, [{ x: tx, y: ty }], sc.portals)) return;
        walk({ x: tx, y: ty });
      } else {
        var seg = P.Pathfinder.route(map, x, y, r.x, r.y, hw, hh);
        if (!seg || !seg.length) return;
        var end = seg[seg.length - 1];
        if (dist(end.x, end.y, r.x, r.y) > T || pathCrosses({ me: { x: x, y: y } }, seg, sc.portals)) return;
        seg.forEach(walk);
        if (dist(x, y, r.x, r.y) > SWEEP_NEAR) walk({ x: r.x, y: r.y });
      }
      order.push(r);
    });
    if (order.length < SWEEP_MIN || !path.length) return false;
    var v = Math.max(1, (me.speed || C.SPEED) * (P.Input.run ? C.RUN_MULT || 1 : 1));
    moveFighting(g, path);
    st.looting = { sweep: true, list: order, at: now(), ms: len / v * 1000 + SWEEP_PAD_MS, drop: order[0] };
    klog('Quét nhặt ' + order.length + ' món quanh đây (' + Math.round(len) + 'px, ~' + (len / v).toFixed(1) + 's)');
    say('Quét nhặt ' + order.length + ' vật phẩm rơi');
    return true;
  }

  // Còn đồ rơi nhặt được (đồ không chủ quanh đây thì chạy tới nhặt; đồ của mình ở đâu trong khu cũng …
  var LEAVE_LOOT_MAX_MS = 20000;  // chờ nhặt tối đa chừng này rồi mới đi (máy chủ không cho nhặt thì thôi)
  var LEAVE_LOOT_R = 800;         // px: trước khi rời đi / dọn bãi / boss / xổng chuồng thì nhặt cả món xa trong tầm nhìn
  function dropsLeft(g) {
    if (!cfg.autoLoot) return [];
    var P = g.P, G = P.Gateway, L = P.Loot, self = G && G.selfId, me = g.me;
    var R = Math.max(cfg.lootRadius, LEAVE_LOOT_R);
    return (g.sw.drops || []).filter(function (r) {
      if (!r || (r.state !== 'ground' && r.state !== 'fall') || r.granted || !isFinite(r.x)) return false;
      if (r.lootId != null && lootSkip[r.lootId] > now()) return false;
      if (dist(me.x, me.y, r.x, r.y) > R && !ownPull(P, r)) return false;
      if (r.ht) return channelDrop(r) && !(r.htBo > Date.now());
      if (r.kind !== 'item' || r.task) return false; // đồ nhiệm vụ (cành Dược Mộc…) việc đó tự lo
      if (!lootFilterOk(P, r.itemId)) return false;
      if (L && L.canPick && G && G.connected && !L.canPick(r, self, r.age)) return false;

  }
  // true = đang nhặt / chờ đồ bay về, chưa được đi.
  var HUNT_DROP_WAIT_MS = 1500;
  var HUNT_ITEMS = { pham_hon: 1, oan_hon: 1, chinh_khi: 1, hiep_nghia_lenh: 1 };
  function huntDrops(g) {

  /* --- Boss / mini boss / sự kiện: chia thưởng theo sát thương hay rơi đồ ra đất --- */
  // Theo hướng dẫn game: boss ngoài map, boss thế giới, Thương Đội (Loot.BOC_THAM_TUI), Nhện Bạch Ngọc, Huyết Xích, Yên Lặng …
  var CL_TICKET_R = 600;       // px: giữ mình trong vòng có vé (22 ô ≈ 700px, chừa lề)

  var CL_PICK_MS = 250;        // gọi lệnh nhặt liên tục mỗi chừng này
  var CL_PRE_S = 4;            // đồ người khác giữ còn chừng này giây là thành đồ chung → tới đứng sẵn
  function dmgOnly(g) {
    var P = g.P;

    return false;
  }
  // Mục tiêu đang tranh: boss / mini boss / quái Thương Đội đang đánh hoặc ở gần.
  function clFoe(g) {
    var me = g.me, t = st.farmTarget;
    if (t && !t.dead && t.hp > 0 && (isBoss(t) || (g.P.Loot && g.P.Loot.BOC_THAM_TUI && g.P.Loot.BOC_THAM_TUI[t.type]))) return t;
    return mobsAlive(g).filter(function (m) { return isBoss(m) && dist(me.x, me.y, m.x, m.y) <= 500; })[0] || null;
  }
  // Gọi lệnh nhặt liên tục (game tự gửi loot.pick đúng một lần mỗi món). Chỉ gửi khi đã đứng trong tầm nhặt.
  function spamPick(g, r) {
    var G = g.P.Gateway, L = g.P.Loot, R = (L && L.PICK_R) || 40, me = g.me;
    if (!r || r.kind !== 'item' || r.ht || r.lootId == null || !G || !G.connected || !G.cmd) return false;
    var waitMs = (st.contest && st.contest.drop === r) ? 100 : CL_PICK_MS;
    if (dist(me.x, me.y, r.x, r.y) > R + 6 || now() - (r._ttPickAt || 0) < waitMs) return false;
    r._ttPickAt = now(); r.asked = true;

    return true;
  }
  function clLockLeft(g, r) { var L = g.P.Loot, k = (r.khoa || (L && L.OWNER_SECS) || 20); return Math.max(0, k - (r.age || 0)); }
  function clCands(g) {
    var P = g.P, G = P.Gateway, L = P.Loot, self = G && G.selfId, me = g.me, out = [];
    (g.sw.drops || []).forEach(function (r) {
      if (!r || r.kind !== 'item' || r.ht || r.task || r.granted || r.state !== 'ground' || !isFinite(r.x)) return;
      if (r.lootId != null && lootSkip[r.lootId] > now()) return;
      if (dist(me.x, me.y, r.x, r.y) > CL_SEEK_R) return;
      if (L && L.expired && L.expired(r.age || 0, r)) return;
      if (ownPull(P, r)) return; // trúng thăm: game tự hút về sau 5 giây

      var can = !(L && L.canPick && G && G.connected) || L.canPick(r, self, r.age || 0);
      if (can) out.push({ r: r, wait: 0 });
      else if (r.owner && r.owner !== self && clLockLeft(g, r) <= CL_PRE_S) out.push({ r: r, wait: clLockLeft(g, r) });
    });
    return out;
  }
  function tickContest(g) {
    if (!cfg.autoLoot || g.P.Input.hasManualMove() || g.me.downed || dmgOnly(g) || vnIn(g)) { st.contest = null; return false; }
    var me = g.me, cands = clCands(g);
    if (!cands.length) {
      if (st.contest) { klog('[Tranh đồ] Xong (' + (st.contest.n || 0) + ' lệnh nhặt) → đánh tiếp'); st.contest = null; }
      // Không có gì để tranh: đang đánh boss rơi đồ thì đứng trong vòng có vé (≤ 22 ô quanh boss).
      var f = clFoe(g);
      if (f && dist(me.x, me.y, f.x, f.y) > CL_TICKET_R && !st.dodging) {
        var rr = spotCheck(g).route(f.x + (me.x - f.x) * 0.4, f.y + (me.y - f.y) * 0.4);
        if (rr && !(me.path && me.path.length && now() - (st.clBackAt || 0) < 800)) { moveFighting(g, rr.path); st.clBackAt = now(); kiteNow = 'Vào lại vòng có vé (≤ 22 ô quanh ' + mobLabel(f) + ')'; }
      }
      return false;
    }
    // Sắp xếp ưu tiên: vật phẩm giá trị cao (gradeScore) luôn được ưu tiên hàng đầu,
    // sau đó tính thời gian chờ mở khóa (wait) và khoảng cách (dist).
    cands.sort(function (a, b) {
      var scA = (cfg.smartPriority && a.r.kind === 'item') ? gradeScore(g.P, a.r.itemId) : 0;

  }

  function tickLoot(g, force) {

  /* ================= Thu hoạch điểm tài nguyên trong bí cảnh ================= */
  // Huyết Xích Cấm Địa (Bích Ngọc, Trấn Thần Thạch, Địa Linh Quả, Trúc Cơ Thảo) và Yên Lãng Sơn …

  // Máy chủ báo bắt đầu / huỷ vận qua HuyetSacUI (dùng chung cho Yên Lãng).
  function hookHarvest(P) {
    var H = P.HuyetSacUI;

    H.batDauThu = function (e) {

    };

  }

  function harvestKey(g, p) { return g.mapId + ':' + p.id; }
