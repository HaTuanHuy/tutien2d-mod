  function harvestSpots(g) {
    var P = g.P, out = [];
    var huyet = HUYET_MAPS[g.mapId] && P.HuyetSacUI && !(P.HuyetSacUI.sealed && P.HuyetSacUI.sealed());
    var yl = P.YenLangUI && P.YenLangUI.st && P.YenLangUI.st.linhThaoMo;
    if (!huyet && !yl) return out;
    (g.sw.map.props || []).forEach(function (p) {
      if (!p || p.hidden || !isFinite(p.x) || !isFinite(p.y)) return;
      if (!((huyet && HARVEST_TYPES[p.type]) || (yl && /^yl_thao_\d$/.test(String(p.id))))) return;
      if (harvestSkip[harvestKey(g, p)] > now()) return;
      out.push(p);
    });
    return out;
  }

  // Cùng phép đo với game khi chạm vào vật: từ chân mình tới giữa ô của vật.
  function propCenter(g, p) { return { x: p.x, y: p.y - (g.P.CONFIG.TILE || 32) / 2 }; }
  function propReach(g, p) {
    var T = g.P.Targeting;
    return T && T.propReach ? T.propReach(p) : (p.r || 40) + 24;
  }
  function inPropReach(g, p) {
    var c = propCenter(g, p);
    return dist(g.me.x, g.me.y, c.x, c.y) <= propReach(g, p) - 2;
  }

  // Đường tới một chỗ đứng trong tầm vật; vật thường chắn lối nên thử vòng quanh nó.
  function harvestRoute(g, p, maxR) {
    var c = propCenter(g, p), R = maxR || propReach(g, p) - 6, sc = spotCheck(g), me = g.me;
    var a0 = Math.atan2(me.y - c.y, me.x - c.x), tries = [c];
    for (var k = 0; k < 12; k++) {
      var a = a0 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * Math.PI / 6;
      tries.push({ x: c.x + Math.cos(a) * R * 0.7, y: c.y + Math.sin(a) * R * 0.7 });
    }
    for (var i = 0; i < tries.length; i++) {
      var r = sc.route(tries[i].x, tries[i].y);
      if (r && dist(r.to.x, r.to.y, c.x, c.y) <= R) return r;
    }
    return null;
  }

  function harvestBlocked(g, p) {
    var c = propCenter(g, p);
    return mobsAlive(g).some(function (m) {
      return m.def.contactDmg > 0 && dist(m.x, m.y, c.x, c.y) <= HARVEST_CLEAR_R;
    }) || inHazard(towerZones(g), c.x, c.y); // vận 3s trong tầm trụ là bị bắn đứt
  }

  // Trong bí cảnh (Huyết Xích / Yên Lãng) tự lo dọn quái trước: chỉ chờ khi có quái cắn ở sát (quái canh xa / đang ngủ trong
  // vòng 900px không chặn việc hái — trước đây đứng chờ mãi cạnh bụi linh thảo).
  function harvestFightBusy(g) {
    if (!((st.hx && st.hx.inside) || (st.yl && st.yl.inside))) return stillFighting(g);
    var me = g.me;
    return mobsAlive(g).some(function (m) { return m.def.contactDmg > 0 && !m.asleep && m.state !== 'return' && dist(me.x, me.y, m.x, m.y) <= 240; });
  }
  function skipHarvest(g, p, ms, why) {
    harvestSkip[harvestKey(g, p)] = now() + ms;
    st.harvest = null;
    if (why) klog(why);
  }

  function tickHarvest(g) {
    if (!(cfg.harvest || (st.hx && st.hx.inside) || (st.yl && st.yl.inside)) || g.P.Input.hasManualMove()) { st.harvest = null; return false; }
    var me = g.me, h = st.harvest;
    if (h) {
      var p = h.prop;
      if (p.hidden) { say('Đã thu ' + propName(p)); klog('Đã thu ' + propName(p)); st.harvest = null; chan = null; return false; }
      // Đang vận: đứng yên, tắt auto cho khỏi tự đi đánh.
      if (chan && chan.propId === String(p.id)) {
        if (me.path && me.path.length) me.path.length = 0;
        setAuto(g, false);
        if (now() - chan.at < chan.ms + 1500) return true;
        // Hết giờ vận mà vật chưa ẩn: thường là đã thu xong (Yên Lãng không ẩn ngay).
        chan = null;
        skipHarvest(g, p, HARVEST_DONE_MS, 'Vận xong ' + propName(p));
        return false;
      }
      if (chanWhy) { klog('Thu ' + propName(p) + ' không được: ' + chanWhy); chanWhy = ''; h.sentAt = 0; }
      if (harvestFightBusy(g) || harvestBlocked(g, p)) { st.harvest = null; return false; }
      if (inPropReach(g, p)) {
        if (h.sentAt && now() - h.sentAt < HARVEST_REPLY_MS) return true;
        if (h.tries >= HARVEST_TRIES) { skipHarvest(g, p, HARVEST_SKIP_MS, 'Thu ' + propName(p) + ' ' + HARVEST_TRIES + ' lần không được → bỏ qua 20s'); return false; }
        if (me.state === 'attack' || me.state === 'pose') return true;
        setAuto(g, false);
        if (me.path && me.path.length) me.path.length = 0;
        g.sw.tuChiDuong = false;
        // Như chạm vào vật: tới tầm thì game tự gửi lệnh thu.
        g.sw.approach = { obj: p, until: g.P.Game.time + 2 };
        h.sentAt = now();
        h.tries++;
        klog('Thu ' + propName(p) + ' (lần ' + h.tries + ')');
        return true;
      }
      if (now() - h.at > HARVEST_WALK_MS) { skipHarvest(g, p, HARVEST_SKIP_MS, 'Đi mãi không tới ' + propName(p) + ' → bỏ qua 20s'); return false; }
      if (me.path && me.path.length && now() - h.routeAt < 3000) return true;
      var again = harvestRoute(g, p);
      if (!again) { skipHarvest(g, p, HARVEST_SKIP_MS, 'Không có đường tới ' + propName(p) + ' → bỏ qua 20s'); return false; }
      moveFighting(g, again.path);
      h.routeAt = now();
      return true;
    }
    if (harvestFightBusy(g)) return false;
    var best = null;
    harvestSpots(g).forEach(function (p) {
      if (harvestBlocked(g, p)) return;
      var c = propCenter(g, p), d = dist(me.x, me.y, c.x, c.y);
      if (!best || d < best.d) best = { p: p, d: d };
    });
    if (!best) return false;
    var r = inPropReach(g, best.p) ? { path: [] } : harvestRoute(g, best.p);
    if (!r) { skipHarvest(g, best.p, HARVEST_SKIP_MS, 'Không có đường tới ' + propName(best.p) + ' → bỏ qua 20s'); return false; }
    if (r.path.length) moveFighting(g, r.path);
    st.harvest = { prop: best.p, at: now(), routeAt: now(), sentAt: 0, tries: 0 };
    chanWhy = '';
    say('Đi thu ' + propName(best.p) + ' (' + Math.round(best.d) + 'px)');
    klog('Đi thu ' + propName(best.p) + ' (' + Math.round(best.d) + 'px)');
    return true;
  }

  /* ================= Chọn mục tiêu khi farm ================= */
  // Chọn mục tiêu: EXP / thời gian (đi + đánh), chia theo số con bị kéo theo; bỏ con chạy về / trong vùng chiêu / không đường.
  var SMART_CROWD_W = 0.5;     // mỗi con bị kéo theo chia điểm thêm phần này
  var SMART_CHASE_R = 260;     // con đang đuổi trong khoảng này: tính là đang nhắm mình
  var SMART_CHASE_BONUS = 1.5;
  var SMART_TOWER_DIV = 3;     // con đứng trong tầm trụ (không đuổi mình) chia điểm chừng này
  var SMART_SWITCH = 1.3;      // con mới phải hơn con đang nhắm chừng này lần mới đổi
  var SMART_EVERY_MS = 300;
  var SMART_NOROUTE_MS = 5000;
  var noRoute = new WeakMap();

  function smartActive(g) {
    if (!cfg.smartTarget || !g.sw.autoOn) return false;
    var H = g.P.Hotbar, pr = H && H.uuTien ? H.uuTien() : 'auto';
    if (pr !== 'auto') return false;
    if (g.P.Gateway && g.P.Gateway.duel) return false;
    return !hostilePlayers(g).length; // PK thì để game / hit & run lo
  }

  function releaseTarget(g) {
    var T = g && g.P.Targeting, f = st.farmTarget;
    if (f && T && T.key === 'foe:' + f.id) T.manual = false;
    st.farmTarget = null;
  }

  function farmRows(g) {
    var me = g.me, P = g.P, C = P.CONFIG.PLAYER, R = P.CONFIG.TARGET ? P.CONFIG.TARGET.RANGE : 400;
    var v = (me.speed || C.SPEED) * (P.Input.run ? C.RUN_MULT || 1 : 1);
    var reach = P.Player.reach ? P.Player.reach() : C.REACH;
    var dps = Math.max(1, P.Player.meleeDamage ? P.Player.meleeDamage() : 10) / (C.ATTACK_TIME || 0.8);
    var mobs = mobsAlive(g), hz = hazards(g), towers = towerZones(g), rows = [];
    mobs.forEach(function (m) {
      if (m.state === 'return' || m.state === 'flee' || !isFinite(m.x) || !m.def) return;
      var d = dist(me.x, me.y, m.x, m.y);
      if (d > R || inHazard(hz, m.x, m.y) || noRoute.get(m) > now()) return;
      var chasing = (m.state === 'chase' || m.state === 'attack') && d <= SMART_CHASE_R;
      var crowd = 0;
      mobs.forEach(function (o) {
        if (o === m || !(o.def.contactDmg > 0) || !(o.def.aggro > 0) || o.state === 'chase' || o.state === 'attack') return;
        if (dist(o.x, o.y, m.x, m.y) <= o.def.aggro) crowd++;
      });
      var travel = chasing ? 0 : Math.max(0, d - reach) / Math.max(1, v);
      var kill = Math.max(1, m.hp) / dps;
      var s = (m.def.exp > 0 ? m.def.exp : 1) / (travel + kill + 0.6) / (1 + SMART_CROWD_W * crowd);
      // Đứng trong tầm trụ mà không đuổi mình thì phải vào tận nơi ăn đạn: trừ điểm.
      if (!isTower(m) && !chasing && inHazard(towers, m.x, m.y)) s /= SMART_TOWER_DIV;
      rows.push({ m: m, s: chasing ? s * SMART_CHASE_BONUS : s, d: d, crowd: crowd, chasing: chasing, far: d > reach + 40 });
    });
    rows.sort(function (a, b) { return b.s - a.s; });
    return rows;
  }

  function mobLabel(m) { return (m.def && m.def.name || 'Quái').split('·')[0].trim(); }

  // Chọn + khoá mục tiêu (không di chuyển). Chạy trước hit & run để hit & run lùi / áp theo nó.
  function tickTarget(g) {
    var pin = st.pin;
    if (pin && pin.t && !pin.t.dead && now() - pin.at < EV_PIN_MS) {
      var Tp = g.P.Targeting, kp = 'foe:' + pin.t.id;
      st.farmTarget = pin.t;
      if (Tp && Tp.list && Tp.list.some(function (e) { return e.key === kp; })) { Tp.key = kp; Tp.manual = true; }
      return;
    }
    // Có boss gần (và không PK / tỉ thí): nhắm boss cho đủ ngưỡng nhận đồ.
    var boss = (cfg.bossFocus || st.bh) && g.sw.autoOn && !(g.P.Gateway && g.P.Gateway.duel) && !hostilePlayers(g).length ? nearBoss(g) : null;
    if (boss) {
      // Dồn sát thương: đánh boss mãi không ra sát thương mà hộ vệ còn sống → hạ hộ vệ trước.
      var guard = cfg.bossMaxDmg && isWorldBoss(g, boss) ? bossGuardTarget(g, boss) : null;
      if (guard) {
        if (st.farmTarget !== guard) { st.farmTarget = guard; klog('Đánh ' + mobLabel(boss) + ' chưa ra sát thương → hạ hộ vệ ' + mobLabel(guard) + ' trước'); }
        boss = guard;
      } else if (st.farmTarget !== boss) {
        st.farmTarget = boss;
        var cb = bossShare(boss);
        klog('Nhắm boss ' + mobLabel(boss) + (cb ? ' · ' + bossShareText(cb) : ''));
      }
      var Tb = g.P.Targeting, kb = 'foe:' + boss.id;
      if (Tb && Tb.list && Tb.list.some(function (e) { return e.key === kb; })) { Tb.key = kb; Tb.manual = true; }
      return;
    }
    if (st.farmTarget && isBoss(st.farmTarget) && !smartActive(g)) releaseTarget(g);
    if (!smartActive(g)) { if (st.farmTarget) releaseTarget(g); return; }
    var cur = st.farmTarget;
    if (cur && (cur.dead || cur.state === 'return' || cur.state === 'flee')) { releaseTarget(g); cur = null; }
    if (!cur || now() - st.farmPickAt >= SMART_EVERY_MS) {
      st.farmPickAt = now();
      var rows = farmRows(g), best = null, curRow = null, sc = null;
      rows.forEach(function (r) { if (r.m === cur) curRow = r; });
      for (var i = 0; i < rows.length && i < 4; i++) {
        var r = rows[i];
        if (r.m !== cur && r.far) {
          sc = sc || spotCheck(g);
          if (!sc.route(r.m.x, r.m.y)) { noRoute.set(r.m, now() + SMART_NOROUTE_MS); continue; }
        }
        best = r;
        break;
      }
      if (curRow && best && best.m !== cur && (cur.hp < cur.hpMax || best.s < curRow.s * SMART_SWITCH)) best = curRow;
      if (!best) { if (cur) releaseTarget(g); return; }
      if (best.m !== cur) {
        st.farmTarget = best.m;
        klog('Nhắm ' + mobLabel(best.m) + ' (' + Math.round(best.d) + 'px, máu ' + Math.max(0, Math.round(best.m.hp)) +
          (best.chasing ? ', đang đuổi mình' : '') + (best.crowd ? ', kéo thêm ' + best.crowd + ' con' : '') + ')');
      }
    }
    var T = g.P.Targeting, key = 'foe:' + st.farmTarget.id;
    if (T && T.list && T.list.some(function (e) { return e.key === key; })) { T.key = key; T.manual = true; }
  }

  // Không có việc gì khác thì đi tới mục tiêu đã chọn (auto chỉ tự đi tới con gần nhất).
  // Trong tầm thì đặt approach để auto đánh / ra chiêu vào đúng con đang khoá.
  function smartMove(g) {
    var me = g.me;
    if (now() < (st.wbLootUntil || 0) && st.wbLootPos && g.mapId === st.wbLootPos.map && !g.P.Input.hasManualMove()) {
      if (dist(me.x, me.y, st.wbLootPos.x, st.wbLootPos.y) > 150) {
        if (!(me.path && me.path.length && g.sw.tuChiDuong)) {
          var rw = spotCheck(g).route(st.wbLootPos.x, st.wbLootPos.y);
          if (rw) { moveFighting(g, rw.path); return true; }
        }
      }
      return false;
    }
    var t = st.farmTarget;
    if (!t || !(smartActive(g) || (cfg.bossFocus && isBoss(t))) || g.P.Input.hasManualMove()) return false;
    var T = g.P.Targeting, key = 'foe:' + t.id;
    if (!T || T.key !== key) return false;
    var reach = (g.P.Player.reach ? g.P.Player.reach() : g.P.CONFIG.PLAYER.REACH) + (t.def && t.def.bodyRadius || 0) - 2;
    var d = dist(me.x, me.y, t.x, t.y), def = plannedSkill(g, t);
    // Vừa gượng dậy tại chỗ trước mặt boss, máu thấp (< 45%): giữ khoảng cách đệm (180px) không áp sát hitbox chết tức thì
    if (now() < (st.reviveGraceUntil || 0) && isBoss(t) && me.hp / (me.hpMax || 1) < 0.45) {
      reach = Math.max(reach, 180);
    }
    // Giai đoạn kết liễu boss (máu boss <= 10%): nếu máu bản thân thấp (< 35%), lùi giữ tầm xa (180px) để bảo toàn mạng sống, chắc chắn đủ điều kiện bốc thăm nhận thưởng
    if (isBoss(t) && t.hpMax > 0 && (t.hp / t.hpMax) <= 0.10 && (me.hp / (me.hpMax || 1)) < 0.35) {
      reach = Math.max(reach, 180);
      if (cfg.autoShield) talUse(g, 'kim_giap', 'bảo vệ cuối trận boss');
    }
    // Săn yêu thú xổng chuồng hoặc tranh Last-Hit: luôn áp sát chạm mục tiêu (reach = 2), không đứng từ xa tung chiêu
    var hugClose = !!(st.xc || isLastHitOnly(t));
    if (hugClose) reach = 2;
    else if (def && d <= skillRange(g, def)) reach = Math.max(reach, d);
    if (d <= reach) {
      if (!g.sw.approach) g.sw.approach = { key: key, until: g.P.Game.time + 2 };
      return false;
    }
    if (me.path && me.path.length && g.sw.tuChiDuong) return false;
    var r = spotCheck(g).route(t.x, t.y);
    if (!r) { noRoute.set(t, now() + SMART_NOROUTE_MS); releaseTarget(g); return false; }
    moveFighting(g, r.path);
    return true;
  }

  /* ================= Dược Công (việc hằng ngày ở Đại Phu) ================= */
  // Dược Công: đi bộ / chạm NPC / chọn nút như người chơi. Đại Phu → Sổ Dược Công → Nhận Việc → tên việc → Nhận Việc Này.
  var DC_TASKS = [
    ['duoc_moc', 'Thu Gom Dược Mộc'], ['cau_ca', 'Câu Cá Làm Dược Liệu'], ['ho_tong_chau', 'Đưa Người Về Làng'],
    ['truc_gia', 'Trúc Tâm Dẫn Dược'], ['linh_chi', 'Linh Chi Dưới Chân Núi'], ['dai_hoi', 'Thắng Trận Đại Hội']
  ];
  var DC_NPC = 'dai_phu', DC_ESCORT_NPC = 'su_phu';
  var DC_WATERS = ['ho_bich_thuy_cong', 'suoi_duoc_coc'];
  var DC_DLG_MS = 8000;        // hộp thoại phải mở trong khoảng này sau khi chạm NPC
  var DC_REPLY_MS = 4000;      // chạm vật mà game chưa phản hồi (chặt / hái / câu) thì chạm lại
  var DC_TRIES = 4;
  var DC_RETRY_MS = 3000;      // lỗi thì chờ chừng này × số lần lỗi rồi làm lại (tối đa DC_RETRY_MAX_MS)
  var DC_RETRY_MAX_MS = 20000;
  var DC_TASK_FAILS = 6;       // một việc lỗi liền chừng này lần thì bỏ qua việc đó hôm nay
  var DC_STALL_MS = 30000;     // đứng yên không tiến triển chừng này thì coi là kẹt, làm lại
  var DC_STALL_FISH_MS = 90000;
  var dcSkip = {};             // taskId → ngày bỏ qua (lỗi mãi)
  var dcDlg = null;            // { want, task, until } — hộp thoại script đang chờ để bấm
  var dcCloseNextUntil = 0;    // bấm xong nút cuối: hộp thoại kế tiếp (quầy hạt…) thì đóng luôn
  var propMapCache = {};

  function dcLog(msg) { klog('[Dược Công] ' + msg); say('Dược Công: ' + msg); }

  // Hộp thoại: script chỉ bấm khi chính nó vừa chạm NPC / mặt nước (dcDlg còn hạn).
  function hookDialog(P) {
    var H = P.HUD;
    if (!H || H._ttDlg || !H.openDialog) return;
    H._ttDlg = true;
    var open = H.openDialog;
    H.openDialog = function (title, text, o) {
      var r = open.apply(this, arguments), seq = (H._ttSeq = (H._ttSeq || 0) + 1);
      if (enabled && (dcDlg && now() < dcDlg.until || now() < dcCloseNextUntil)) {
        setTimeout(function () { if (H._ttSeq === seq && H.dialogOpen) dcAnswer(H, title, text, o || {}); }, 300);
      }
      return r;
    };
  }

  function dcAnswer(H, title, text, o) {
    if (!dcDlg || now() >= dcDlg.until) {
      if (now() < dcCloseNextUntil) { dcCloseNextUntil = 0; H.closeDialog(); }
      return;
    }
    var w = dcDlg, act = o.actionLabel || '', choices = (o.choices || []).filter(function (c) { return c && !c.disabled; });
    var ACT = { start: /^Nhận Việc Này/, turnin: /^Giao (Nguyên Liệu|Ba Cá)/, escort: /^Bẩm Thầy Ông Nội/ };
    if (ACT[w.want] && ACT[w.want].test(act) && o.onAction) {
      H.closeDialog();
      dcDlg = null;
      dcCloseNextUntil = now() + 1500;
      o.onAction();
      return;
    }
    function pick(re) { for (var i = 0; i < choices.length; i++) if (re.test(String(choices[i].label || ''))) return choices[i]; return null; }
    var c = null;
    if (w.want === 'fish') c = pick(/^Tự động câu/);
    else if (w.want === 'close') { dcDlg = null; H.closeDialog(); return; }
    else if (w.want === 'diemdanh') { c = pick(/^Điểm Danh Hôm Nay/); if (c) { dcDlg = null; dcCloseNextUntil = now() + 2500; } }
    else if (w.want === 'vtnhan') { c = pick(/^Nhận Tiêu/); if (c) dcDlg = null; }
    else if (w.want === 'vtgiao') { c = pick(/^Giao Hàng/); if (c) { dcDlg = null; dcCloseNextUntil = now() + 2500; } }
    else if (w.want === 'thinh') { c = pick(/^Thỉnh Hồn Phiên/); if (c) dcDlg = null; }
    else if (w.want === 'cung') { c = pick(/^Cúng tới sạch nghiệp/) || pick(/^Cúng mười nén/) || pick(/^Cúng một nén/); if (c) dcDlg = null; }
    else if (w.want === 'sow') { var seeds = choices.filter(function (x) { return /^Gieo /.test(String(x.label || '')); }); c = seeds[seeds.length - 1] || null; if (c) dcDlg = null; }
    else if (w.want === 'start') c = (w.name && pick(new RegExp('^' + w.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'))) ||
      pick(/^Nhận Việc Dược Công/) || pick(/^Sổ Dược Công/);
    else if (w.want === 'turnin') c = pick(/^Sổ Dược Công/);
    if (c) { H.closeDialog(); c.onChoose && c.onChoose(); return; }
    // Hộp thoại không như mong đợi (thiếu cảnh giới, hết lượt…): ghi lại, đóng.
    dcDlg = null;
    H.closeDialog();
    dcFail('Hộp thoại "' + String(title || '') + '" không có nút cần bấm: ' + String(text || '').replace(/\s+/g, ' ').slice(0, 90));
  }

  // Map chứa vật / NPC có id này (dò trong dữ liệu bản đồ của game).
  function propMap(P, id) {
    if (propMapCache[id]) return propMapCache[id];
    var MD = P.MapData || {}, found = null;
    Object.keys(MD).some(function (k) {
      var m = MD[k];
      if (!m || typeof m !== 'object' || typeof m.id !== 'string') return false;
      return ['props', 'flatProps', 'interactables'].some(function (f) {
        return Array.isArray(m[f]) && m[f].some(function (p) { return p && p.id === id && (found = m.id); });
      });
    });
    if (found) propMapCache[id] = found;
    return found;
  }

  function findHere(g, id) {
    var m = g.sw.map, lists = [m.props || [], m.flatProps || [], m.interactables || []];
    for (var i = 0; i < lists.length; i++) for (var j = 0; j < lists[i].length; j++) if (lists[i][j] && lists[i][j].id === id) return lists[i][j];
    return null;
  }

  // Đi sang map có vật id. Trả về true khi đang đi (chưa tới map).
  function dcGoMap(g, mapId) {
    var d = st.dc;
    if (!mapId) { dcFail('Không biết vật cần tới nằm ở map nào'); return true; }
    if (g.mapId === mapId) { if (st.travel) stopTravel(); return false; }
    if (!st.travel || st.travel.map !== mapId) {
      if (++d.travels > 6) { dcFail('Không đi được tới ' + mapName(mapId)); return true; }
      startTravel(mapId, null, null, 'Dược Công: đi tới ' + mapName(mapId));
    }
    tickTravel(g);
    return true;
  }

  // Chạm vật thì game cho từ (r||40)+24, nhưng đang chặt (Trúc Già, Cổ Thụ) mà cách giữa ô vật quá
  // (r||40)+16 là game huỷ lần chặt. Nên đi vào hẳn trong (r||40)+10 rồi mới chạm.
  var DC_STAND_PAD = 10;
  function dcReach(g, p) { return Math.min(propReach(g, p) - 2, (p.r || 40) + DC_STAND_PAD); }

  // Đi tới trong tầm vật rồi chạm vào nó như bấm chuột. 'walk' | 'sent' | 'fail'.
  // d: trạng thái của việc đang làm (touches, touchAt, routeAt).
  function dcTouch(g, p) { return touchProp(g, st.dc, p); }
  function touchProp(g, d, p) {
    var me = g.me, c = propCenter(g, p), R = dcReach(g, p);
    setAuto(g, false);
    if (dist(me.x, me.y, c.x, c.y) <= R) {
      if (d.touchAt && now() - d.touchAt < DC_REPLY_MS) return 'sent';
      if (++d.touches > DC_TRIES) return 'fail';
      if (me.path && me.path.length) me.path.length = 0;
      g.sw.tuChiDuong = false;
      g.sw.approach = { obj: p, until: g.P.Game.time + 2 };
      d.touchAt = now();
      return 'sent';
    }
    if (me.path && me.path.length && now() - d.routeAt < 3000) return 'walk';
    var r = harvestRoute(g, p, R - 4);
    if (!r) return 'fail';
    if (me.state === 'sit') g.P.Player.stand(me);
    me.setPath(r.path);
    d.routeAt = now();
    return 'walk';
  }

  function dcStep(name) {
    var d = st.dc;
    if (d.step !== name) { d.step = name; d.touches = 0; d.touchAt = 0; d.stepAt = now(); }
  }

  function dcStop(msg) {
    if (msg) dcLog(msg);
    st.dc = null;
    dcDlg = null;
    cfg.dcRun = false;
    save();
    if (ui.root) syncInputs();
  }

  function dcToday() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }

  // Lỗi giữa chừng: dọn trạng thái dở (đường đi, hộp thoại, lệnh chạm), chờ một lúc rồi làm lại.
  // Một việc lỗi liền nhiều lần thì bỏ qua việc đó hôm nay, sang việc khác.
  function dcFail(msg) {
    var d = st.dc, g = game();
    if (!d) return;
    d.fails++;
    d.taskFails++;
    var wait = Math.min(DC_RETRY_MAX_MS, DC_RETRY_MS * d.fails);
    dcLog(msg + ' → thử lại sau ' + Math.round(wait / 1000) + 's (lần ' + d.fails + ')');
    if (d.task && d.taskFails >= DC_TASK_FAILS) {
      dcSkip[d.task] = dcToday();
      dcLog('Việc ' + d.task + ' lỗi ' + d.taskFails + ' lần liền → bỏ qua hôm nay');
      d.taskFails = 0;
    }
    if (st.travel) stopTravel();
    dcDlg = null;
    if (g) {
      if (g.sw.approach) g.sw.approach = null;
      if (g.me.path && g.me.path.length) g.me.path.length = 0;
      var H = g.P.HUD;
      if (H && H.dialogOpen && H.closeDialog) H.closeDialog();
    }
    d.step = ''; d.touches = 0; d.touchAt = 0; d.travels = 0; d.prop = null;
    d.waitUntil = now() + wait;
    d.seenAt = now();
  }

  // Xong hết: về chỗ farm lúc bật Dược Công, tới nơi thì bật lại auto.
  function dcFinish(msg) {
    var back = cfg.dcReturn;
    dcStop(msg);
    if (back && back.map) goBack(back.map, back.x, back.y, 'Xong Dược Công → về chỗ farm ' + mapName(back.map), 'dc', back.khu);
  }

  // Kẹt: không đổi bước, không đổi chỗ, không thêm nguyên liệu trong một lúc lâu.
  function dcWatch(g, t) {
    var d = st.dc, Q = g.P.Quest, me = g.me;
    var sig = [d.step, g.mapId, Math.round(me.x / 24), Math.round(me.y / 24), t ? t.id : '', t ? Q.seedQuestProgress() : '',
    st.travel ? st.travel.map : ''].join('|');
    if (sig !== d.sig) { d.sig = sig; d.seenAt = now(); return false; }
    if (d.step.indexOf('chờ') === 0) return false;
    var fishing = g.sw.fishing || g.sw.fishingAuto, limit = fishing ? DC_STALL_FISH_MS : DC_STALL_MS;
    if (now() - d.seenAt < limit) return false;
    if (fishing && g.sw.stopFishing) g.sw.stopFishing();
    dcFail('Kẹt ' + Math.round(limit / 1000) + 's ở bước "' + (d.step || '—') + '"');
    return true;
  }

  // Việc Đại Hội: chỉ nhận khi bật Tự đánh Đại Hội và kỳ này đang mở sổ mà mình đủ tư cách (nhận rồi thì giữ tới khi thắng).
  function dcDhPending(Q) { return cfg.dhRun && cfg.dc_dai_hoi !== false && dcSkip.dai_hoi !== dcToday() && Q.seedTaskRunsLeft('dai_hoi') > 0; }
  function dcDhNow() { var g = game(), L = g && dhLich(g.P); return !!(cfg.dhRun && L && L.giaiDoan === 'DANG_KY' && dhBang(g, L)); }
  function dcNextTask(Q) {
    for (var i = 0; i < DC_TASKS.length; i++) {
      var id = DC_TASKS[i][0];
      if (cfg['dc_' + id] !== false && dcSkip[id] !== dcToday() && Q.seedTaskRunsLeft(id) > 0 && (id !== 'dai_hoi' || dcDhNow())) return id;
    }
    return null;
  }

  // Nói chuyện với NPC để bấm một chuỗi nút; xong khi done() đúng.
  function dcTalk(g, npcId, want, name, done) {
    var d = st.dc;
    if (done()) return 'done';
    if (dcGoMap(g, propMap(g.P, npcId))) return 'busy';
    var npc = findHere(g, npcId);
    if (!npc) { dcFail('Không thấy ' + npcId + ' trong map'); return 'busy'; }
    if (g.P.HUD && g.P.HUD.dialogOpen) return 'busy';
    var r = dcTouch(g, npc);
    if (r === 'fail') { dcFail('Không nói chuyện được với ' + (npc.name || npcId)); return 'busy'; }
    if (r === 'sent' && (!dcDlg || dcDlg.at !== d.touchAt)) dcDlg = { want: want, name: name, until: now() + DC_DLG_MS, at: d.touchAt };
    return 'busy';
  }

  function dcCollect(g, t) {
    var d = st.dc, Q = g.P.Quest, sw = g.sw, me = g.me;
    if (t.id === 'duoc_moc') {
      if (dcGoMap(g, propMap(g.P, 'co_thu_linh_moc'))) return;
      // Cành đã rụng thì nhặt trước (đi vào trong Loot.PICK_R là game tự nhặt).
      var branch = (sw.drops || []).filter(function (r) { return r.task === t.id && r.state === 'ground'; })
        .sort(function (a, b) { return dist(me.x, me.y, a.x, a.y) - dist(me.x, me.y, b.x, b.y); })[0];
      if (branch) {
        dcStep('nhặt cành');
        if (me.path && me.path.length && now() - d.routeAt < 3000) return;
        var pr = spotCheck(g).route(branch.x, branch.y);
        me.setPath(pr ? pr.path : [{ x: branch.x, y: branch.y }]);
        d.routeAt = now();
        return;
      }
      if ((sw.drops || []).some(function (r) { return r.task === t.id; })) return; // cành đang rơi
      if (sw.chopping) { dcStep('chặt cây'); return; }
      if (!Q.chopAvailable(t.id)) return;
      var tree = findHere(g, 'co_thu_linh_moc');
      if (!tree) return dcFail('Không thấy Cổ Thụ trong map');
      dcStep('chặt cây ' + Q.seedQuestProgress());
      if (dcTouch(g, tree) === 'fail') dcFail('Không chặt được Cổ Thụ');
      return;
    }
    // Linh Chi (hái) / Trúc Già (chặt): chạm lần lượt từng vật còn hiện.
    if (dcGoMap(g, propMap(g.P, t.propIds[0]))) return;
    if (sw.chopping) return;
    var list = t.propIds.map(function (id) { return findHere(g, id); }).filter(function (p) { return p && !p.hidden && !p.harvestPending; });
    var p = d.prop && list.indexOf(d.prop) >= 0 ? d.prop : list.sort(function (a, b) {
      return dist(me.x, me.y, a.x, a.y) - dist(me.x, me.y, b.x, b.y);
    })[0];
    if (!p) { dcStep('chờ ' + t.itemName + ' mọc lại'); return; }
    if (p !== d.prop) { d.prop = p; dcStep(t.itemName + ' ' + p.id); }
    if (dcTouch(g, p) === 'fail') { d.prop = null; d.touches = 0; }
  }

  function dcFish(g, t) {
    var d = st.dc, sw = g.sw, T = g.P.Targeting;
    if (sw.fishing || sw.fishingAuto) { dcStep('đang câu ' + g.P.Quest.seedQuestProgress() + '/' + t.need); setAuto(g, false); return; }
    var id = DC_WATERS.filter(function (w) { return propMap(g.P, w); })[0];
    if (dcGoMap(g, propMap(g.P, id))) return;
    var w = findHere(g, id);
    if (!w) return dcFail('Không thấy chỗ câu cá');
    if (g.P.HUD && g.P.HUD.dialogOpen) return;
    dcStep('thả câu');
    setAuto(g, false);
    // Mặt nước là cảnh vật: bấm E khi đang chọn nó thì game mở "Thả câu / Tự động câu".
    if (!inPropReach(g, w)) {
      if (g.me.path && g.me.path.length && now() - d.routeAt < 3000) return;
      var r = harvestRoute(g, w);
      if (!r) return dcFail('Không có đường tới chỗ câu cá');
      g.me.setPath(r.path);
      d.routeAt = now();
      return;
    }
    if (d.touchAt && now() - d.touchAt < DC_REPLY_MS) return;
    if (++d.touches > DC_TRIES) return dcFail('Không thả câu được');
    var key = 'scn:' + w.id;
    if (T && T.list && T.list.some(function (e) { return e.key === key; })) { T.key = key; T.manual = true; }
    if (!T || T.key !== key) return;
    if (g.me.path && g.me.path.length) g.me.path.length = 0;
    d.touchAt = now();
    dcDlg = { want: 'fish', until: now() + DC_DLG_MS, at: d.touchAt };
    g.P.Input.pressInteract();
  }

  function tickDuocCong(g) {
    if (!cfg.dcRun) { if (st.dc) st.dc = null; return false; }
    if (cfg.planRun && !planIs('dc')) return false; // Lịch đang làm việc khác: không chạy chen
    if (st.bh || st.bd || st.xc || st.td) return false; // tạm dừng khi đang đi đánh boss / quái biến dị
    var P = g.P, Q = P.Quest;
    if (!Q || !Q.seedTaskInfo || !Q.startSeedQuest) { dcStop('Bản game này không có việc Dược Công'); return false; }
    if (Q.canOpenSeedMenu && !Q.canOpenSeedMenu()) { dcStop('Chưa mở việc Dược Công (cần làm tới đoạn gặp Đại Phu)'); return false; }
    if (g.P.Input.hasManualMove()) return true;
    var d = st.dc || (st.dc = {
      step: '', touches: 0, touchAt: 0, routeAt: 0, stepAt: now(), travels: 0, task: null, prop: null,
      fails: 0, taskFails: 0, waitUntil: 0, sig: '', seenAt: now(), prog: null
    });
    // Làm Dược Công thì không đánh quái: auto luôn tắt (né chiêu / thiền vẫn chạy trước phần này).
    setAuto(g, false);
    if (now() < d.waitUntil) return true;
    var t = Q.seedTaskInfo();
    if (dcWatch(g, t)) return true;
    if (t && t.kind === 'tournament') {
      if (!cfg.dhRun) { dcStop('Đang giữ việc Đại Hội — bật "Tự đánh Đại Hội" hoặc huỷ ở Đại Phu rồi bật lại'); return false; }
      st.dc = null; return false; // thắng một trận Đại Hội là game tự ghi công
    }
    if (!t) {
      var next = dcNextTask(Q);
      if (!next && dcDhPending(Q)) { if (!d.dhWait) { d.dhWait = 1; dcLog('Còn việc Thắng Trận Đại Hội → chờ kỳ Đại Hội mở sổ mới nhận'); } d.step = 'chờ Đại Hội mở sổ để nhận việc'; return false; }
      if (!next) { dcFinish('Đã làm hết các việc được chọn hôm nay'); return false; }
      var def = DC_TASKS.filter(function (x) { return x[0] === next; })[0];
      if (d.task !== next) { d.task = next; d.travels = 0; d.taskFails = 0; d.fails = 0; dcStep('nhận ' + def[1]); dcLog('Đi nhận việc ' + def[1] + ' (còn ' + Q.seedTaskRunsLeft(next) + ' lượt)'); }
      dcTalk(g, DC_NPC, 'start', def[1], function () { return !!Q.seedTaskInfo(); });
      return true;
    }
    if (d.task !== t.id) { d.task = t.id; d.travels = 0; d.prop = null; d.taskFails = 0; }
    var prog = Q.seedQuestProgress();
    if (prog !== d.prog) { d.prog = prog; d.fails = 0; d.taskFails = 0; }
    if (t.kind === 'escort') {
      dcStep('đưa cháu về làng');
      var r = dcTalk(g, DC_ESCORT_NPC, 'escort', null, function () { return !Q.seedTaskInfo(); });
      if (r === 'done') dcLog('Xong ' + t.shortName);
      return true;
    }
    if (Q.seedQuestComplete()) {
      if (g.sw.fishing || g.sw.fishingAuto) { g.sw.stopFishing && g.sw.stopFishing(); return true; }
      if (d.step.indexOf('giao') !== 0) { d.travels = 0; dcStep('giao ' + t.shortName); }
      dcTalk(g, DC_NPC, 'turnin', null, function () { return !Q.seedTaskInfo(); });
      return true;
    }
    if (t.kind === 'fishing') dcFish(g, t);
    else dcCollect(g, t);
    return true;
  }

  /* ================= Đi nhặt nguyên liệu chế tạo (mạch khoáng, linh thảo) ================= */
  // Vật nhặt được trên bản đồ: chạm vào là máy chủ cho luôn (resource.harvest), vật ẩn đi rồi mọc …
  var GATHER_TYPES = [
    ['mach_han_tinh', 'han_tinh_thach', 'Hàn Tinh Thạch'], ['mach_tu_tinh', 'tu_tinh_thach', 'Tử Tinh Thạch'],
    ['mach_luc_tinh', 'luc_tinh_thach', 'Lục Tinh Thạch'], ['phong_tinh_mach', 'phong_tinh_thach', 'Phong Tinh Thạch'],
    ['phong_linh_thao', 'phong_linh_thao', 'Phong Linh Thảo'], ['ling_chi_prop', 'nam_linh_chi', 'Nấm Linh Chi']
  ];
  var GA_KHU_REVISIT_MS = 4 * 60000;  // khu vừa vét trong chừng này thì chưa quay lại (vật chưa kịp mọc)
  var GA_MAP_REST_MS = 3 * 60000;     // map vét hết mọi khu: nghỉ chừng này mới quay lại
  var GA_PROP_SKIP_MS = 60000;        // chạm mãi không được: bỏ vật đó một lúc
  var GA_KHU_WAIT_MS = 10000;         // chọn khu rồi mà chưa sang được thì thử lại
  var GA_SETTLE_MS = 2500;           // vào map / đổi khu xong chờ máy chủ gửi trạng thái vật
  var GA_FIGHT_R = 140;               // quái đang đuổi trong khoảng này: đánh trước (nếu bật)
  var gaVisited = {};                 // 'map:khu' → lúc vét xong
  var gaMapRest = {};                 // map → nghỉ tới lúc
  var gaPropSkip = {};                // 'map:khu:id' → bỏ tới lúc
  var gaMapsCache = null;
  var khuList = null;                 // {mapId, dem[], toiDa, tran[]}: số người mỗi khu (khi Bảng Khu mở)
  var khuListAt = 0;                  // lúc nhận danh sách đó
  var khuOpenAt = 0;                  // lúc Bảng Khu được mở gần nhất (ai mở cũng tính)
  var KHU_LIST_WAIT_MS = 1500;        // Bảng Khu mở rồi chờ danh sách số người chừng này rồi mới chọn

  function gaLog(msg) { klog('[Nhặt NL] ' + msg); say('Nhặt nguyên liệu: ' + msg); }
  function gaTypeOf(type) { for (var i = 0; i < GATHER_TYPES.length; i++) if (GATHER_TYPES[i][0] === type) return GATHER_TYPES[i]; return null; }
  function gaKhu(P) { return P.KhuUI && P.KhuUI.khu || 1; }
  function gaSoKhu(P) { return P.KhuUI && P.KhuUI.soKhu || 1; }

  // Danh sách số người mỗi khu chỉ về khi Bảng Khu mở: nghe lại để tránh chọn khu đầy.
  function hookKhu(P) {
    var K = P.KhuUI;
    if (!K || K._ttHooked || !K.onList) return;
    K._ttHooked = true;
    var on = K.onList;
    K.onList = function (t) { if (t && t.mapId) { khuList = t; khuListAt = now(); } return on.apply(this, arguments); };
    if (K.open) { var op = K.open; K.open = function () { khuOpenAt = now(); return op.apply(this, arguments); }; }
  }

  // Map nào có những loại vật nào (đếm trong dữ liệu bản đồ của game).
  function gaMaps(P) {
    if (gaMapsCache) return gaMapsCache;
    var out = {}, MD = P.MapData || {};
    Object.keys(MD).forEach(function (k) {
      var m = MD[k];
      if (!m || typeof m !== 'object' || typeof m.id !== 'string' || out[m.id]) return;
      var types = {}, n = 0;
      ['props', 'flatProps'].forEach(function (f) {
        (m[f] || []).forEach(function (p) { if (p && gaTypeOf(p.type)) { types[p.type] = (types[p.type] || 0) + 1; n++; } });
      });
      if (n) out[m.id] = { id: m.id, types: types };
    });
    if (Object.keys(out).length) gaMapsCache = out;
    return out;
  }

  // Loại nào đã đủ mục tiêu hoặc túi không còn chỗ chứa thì tắt luôn loại đó, sang nhặt loại khác.
  function gaOffFull(P) {
    if (st.gaOverride) return;
    var inv = P.Inventory, off = [];
    GATHER_TYPES.forEach(function (t) {
      if (cfg['ga_' + t[0]] === false) return;
      var have = inv && inv.count ? inv.count(t[1]) : 0;
      if (cfg.gatherGoal > 0 && have >= cfg.gatherGoal) off.push([t, 'đủ ' + have + '/' + cfg.gatherGoal]);
      else if (inv && inv.canFit && !inv.canFit(t[1])) off.push([t, 'túi đầy']);
    });
    off.forEach(function (o) { cfg['ga_' + o[0][0]] = false; gaLog(o[0][2] + ': ' + o[1] + ' → tắt, nhặt loại khác'); });
    if (off.length) { save(); if (ui.root) syncInputs(); }
  }

  // Loại vật đang cần: được chọn, chưa đủ mục tiêu, túi còn chỗ.
  function gaWanted(P) {
    var inv = P.Inventory, out = {};
    // Đang nhặt cho việc tông môn: chỉ các loại việc đó cần, tới khi đủ số.
    if (st.gaOverride) {
      var o = st.gaOverride, have = 0;
      (o.items || []).forEach(function (id) { have += inv && inv.count ? inv.count(id) : 0; });
      if (have < o.until) (o.types || []).forEach(function (ty) { var t = gaTypeOf(ty); if (t && !(inv && inv.canFit && !inv.canFit(t[1]))) out[ty] = t; });
      return out;
    }
    GATHER_TYPES.forEach(function (t) {
      if (cfg['ga_' + t[0]] === false) return;
      if (cfg.gatherGoal > 0 && inv && inv.count && inv.count(t[1]) >= cfg.gatherGoal) return;
      if (inv && inv.canFit && !inv.canFit(t[1])) return;
      out[t[0]] = t;
    });
    return out;
  }

  function gaVisible(g, wanted) {
    var key = g.mapId + ':' + gaKhu(g.P) + ':', tw = towerZones(g);
    return (g.sw.map.props || []).concat(g.sw.map.flatProps || []).filter(function (p) {
      return p && wanted[p.type] && !p.hidden && !p.off && !p.harvestPending && isFinite(p.x) &&
        !(gaPropSkip[key + p.id] > now()) && !inHazard(tw, p.x, p.y);
    });
  }

  // Map đích: ở map hiện tại nếu còn việc, không thì map có nhiều vật cần nhất mà đi được tới.
  function gaPickMap(g, wanted) {
    var maps = gaMaps(g.P), graph = mapGraph(g.P), best = null;
    Object.keys(maps).forEach(function (id) {
      var n = 0;
      Object.keys(maps[id].types).forEach(function (t) { if (wanted[t]) n += maps[id].types[t]; });
      if (!n || gaMapRest[id] > now()) return;
      if (id !== g.mapId && !nextHop(graph, g.mapId, id)) return; // bí cảnh, không có cổng tới
      var score = n + (id === g.mapId ? 1000 : 0);
      if (!best || score > best.score) best = { id: id, score: score, n: n };
    });
    return best;
  }

  // Khu kế tiếp: lâu chưa ghé nhất (chưa ghé bao giờ là tốt nhất), bỏ khu đầy, ít người hơn thì hơn.
  function gaNextKhu(g) {
    var P = g.P, cur = gaKhu(P), n = gaSoKhu(P), best = null;
    var list = khuList && khuList.mapId === g.mapId ? khuList : null;
    for (var k = 1; k <= n; k++) {
      if (k === cur) continue;
      var dem = list && list.dem ? list.dem[k - 1] | 0 : 0, cap = list ? (list.tran && list.tran[k - 1]) || list.toiDa || 0 : 0;
      if (cap && dem >= cap) continue;
      var ago = now() - (gaVisited[g.mapId + ':' + k] || -1e12);
      var score = ago - dem * 1000;
      if (!best || score > best.score) best = { khu: k, ago: ago, score: score };
    }
    return best;
  }

  function gaStep(name) {
    var a = st.ga;
    if (a.step !== name) { a.step = name; a.touches = 0; a.touchAt = 0; a.seenAt = now(); }
  }

  function gaFail(msg) {
    var a = st.ga, g = game();
    if (!a) return;
    a.fails++;
    var wait = Math.min(DC_RETRY_MAX_MS, DC_RETRY_MS * a.fails);
    gaLog(msg + ' → thử lại sau ' + Math.round(wait / 1000) + 's');
    if (st.travel) stopTravel();
    if (g) { if (g.sw.approach) g.sw.approach = null; if (g.me.path && g.me.path.length) g.me.path.length = 0; }
    if (g && g.P.KhuUI && g.P.KhuUI.isOpen && g.P.KhuUI.isOpen()) g.P.KhuUI.close();
    a.step = ''; a.touches = 0; a.touchAt = 0; a.prop = null; a.khuWant = 0; a.travels = 0;
    a.waitUntil = now() + wait;
  }

  function gaStop(msg) {
    if (msg) gaLog(msg);
    st.ga = null;
    cfg.gatherRun = false;
    save();
    if (ui.root) syncInputs();
  }

  function gaGoMap(g, mapId) {
    var a = st.ga;
    if (g.mapId === mapId) { if (st.travel) stopTravel(); return false; }
    if (!st.travel || st.travel.map !== mapId) {
      if (++a.travels > 6) {
        gaMapRest[mapId] = now() + 10 * 60000;
        gaFail('Không đi được tới ' + mapName(mapId) + ' (có thể chưa đủ cảnh giới) → bỏ map này 10 phút');
        return true;
      }
      startTravel(mapId, null, null, 'Nhặt nguyên liệu: đi tới ' + mapName(mapId));
    }
    tickTravel(g);
    return true;
  }

  // Đổi khu: tới Bảng Khu gần nhất, chạm vào (game mở bảng chọn khu), chọn số khu như bấm tay.
  function gaSwitchKhu(g, want) {
    var a = st.ga, P = g.P, K = P.KhuUI;
    if (gaKhu(P) === want) { a.khuWant = 0; a.waitUntil = now() + GA_SETTLE_MS; return true; }
    if (!a.khuAt && lootBeforeLeave(g)) { gaStep('nhặt đồ rơi trước khi đổi khu'); return true; }
    if (a.khuWant === want && a.khuAt) {
      if (now() - a.khuAt < GA_KHU_WAIT_MS) return true;
      gaFail('Chọn khu ' + want + ' mà chưa sang được');
      return true;
    }
    var boards = (g.sw.map.props || []).filter(function (p) { return p && p.type === 'khu_board'; });
    if (!boards.length) { gaFail('Map này không có Bảng Khu'); return true; }
    var me = g.me, board = boards.sort(function (x, y) { return dist(me.x, me.y, x.x, x.y) - dist(me.x, me.y, y.x, y.y); })[0];
    if (K && K.isOpen && K.isOpen()) {
      // Bảng vừa mở thì game hỏi số người từng khu: chờ danh sách về rồi chọn lại khu cho đúng.
      if (!a.boardAt) a.boardAt = now();
      if (khuListAt < a.boardAt && now() - a.boardAt < KHU_LIST_WAIT_MS) return true;
      var nb = gaNextKhu(g);
      if (nb) want = nb.khu;
      a.boardAt = 0;
      var G = P.Gateway;
      if (!G || !G.connected || !G.send || !G.send({ op: 'khu', act: 'chon', khu: want })) { gaFail('Không gửi được lệnh đổi khu (mất kết nối?)'); return true; }
      K.close();
      a.khuWant = want; a.khuAt = now();
      gaLog('Đổi sang khu ' + want);
      return true;
    }
    gaStep('tới Bảng Khu → khu ' + want);
    var r = touchProp(g, a, board);
    if (r === 'fail') gaFail('Không chạm được Bảng Khu');
    return true;
  }

  function gaWatch(g) {
    var a = st.ga, me = g.me;
    var sig = [a.step, g.mapId, gaKhu(g.P), Math.round(me.x / 24), Math.round(me.y / 24), st.travel ? st.travel.map : ''].join('|');
    if (sig !== a.sig) { a.sig = sig; a.seenAt = now(); return false; }
    if (a.step.indexOf('chờ') === 0 || now() - a.seenAt < DC_STALL_MS) return false;
    gaFail('Kẹt ' + DC_STALL_MS / 1000 + 's ở bước "' + (a.step || '—') + '"');
    return true;
  }

  function tickGather(g) {
    if (!cfg.gatherRun && !st.gaOverride) { if (st.ga) st.ga = null; return false; }
    if (cfg.planRun && !planIs('gather') && !st.gaOverride) return false; // Lịch đang làm việc khác: không chạy chen
    if (st.bh || st.bd || st.xc || st.td) return false; // tạm dừng khi đang đi đánh boss / quái biến dị
    if (g.P.Input.hasManualMove()) return true;
    var P = g.P, me = g.me;
    var a = st.ga || (st.ga = {
      step: '', touches: 0, touchAt: 0, routeAt: 0, prop: null, fails: 0, waitUntil: 0,
      sig: '', seenAt: now(), khuWant: 0, khuAt: 0, travels: 0, got: 0, target: null
    });
    // Quái đang đuổi sát: để auto + hit & run đánh trước (nếu bật), xong nhặt tiếp.
    var chased = cfg.gatherFightOn && mobsAlive(g).some(function (m) {
      return m.def.contactDmg > 0 && (m.state === 'chase' || m.state === 'attack') && dist(me.x, me.y, m.x, m.y) <= GA_FIGHT_R;
    });
    if (chased) { if (st.travel) stopTravel(); setAuto(g, true); return false; }
    setAuto(g, false);
    if (now() < a.waitUntil) return true;
    if (gaWatch(g)) return true;
    gaOffFull(P);
    var wanted = gaWanted(P);
    if (!Object.keys(wanted).length) {
      if (st.gaOverride) { st.gaOverride = null; st.ga = null; return false; }
      gaStop(cfg.gatherGoal > 0 ? 'Đã đủ ' + cfg.gatherGoal + ' mỗi loại (hoặc túi đầy) → dừng' : 'Không còn loại nào để nhặt (chưa chọn loại nào / túi đầy) → dừng');
      return false;
    }
    // Đang chờ sang khu mới.
    if (a.khuWant && gaSwitchKhu(g, a.khuWant)) return true;
    // Vật phẩm rơi quanh mình (quái vừa chết, người khác bỏ lại): hút trước rồi nhặt mạch tiếp.
    if (cfg.autoLoot && !a.prop && tickLoot(g)) { gaStep('nhặt vật phẩm rơi'); return true; }
    var target = gaPickMap(g, wanted);
    if (!target) {
      var soonest = Object.keys(gaMapRest).reduce(function (m, k) { return Math.min(m, gaMapRest[k]); }, Infinity);
      gaStep('chờ vật mọc lại' + (isFinite(soonest) ? ' (~' + Math.max(0, Math.round((soonest - now()) / 1000)) + 's)' : ''));
      return true;
    }
    if (a.target !== target.id) { a.target = target.id; a.travels = 0; gaLog('Map nhặt: ' + mapName(target.id) + ' (' + target.n + ' điểm cần nhặt)'); }
    if (gaGoMap(g, target.id)) { gaStep('đi tới ' + mapName(target.id)); return true; }
    var here = g.mapId + ':' + gaKhu(P);
    if (a.here !== here) { a.here = here; a.prop = null; a.waitUntil = now() + GA_SETTLE_MS; gaStep('vào ' + mapName(g.mapId) + ' khu ' + gaKhu(P)); return true; }
    // Vật vừa chạm: ẩn đi là nhặt được.
    if (a.prop) {
      var p = a.prop;
      if (p.hidden || p.off) {
        a.got++; a.fails = 0;
        var tp = gaTypeOf(p.type);
        klog('[Nhặt NL] +1 ' + (tp ? tp[2] : p.type) + (P.Inventory && P.Inventory.count && tp ? ' (có ' + P.Inventory.count(tp[1]) + ')' : ''));
        a.prop = null;
      } else if (p.harvestPending) {
        return true;
      } else {
        var r0 = touchProp(g, a, p);
        if (r0 === 'fail') { gaPropSkip[g.mapId + ':' + gaKhu(P) + ':' + p.id] = now() + GA_PROP_SKIP_MS; a.prop = null; a.touches = 0; }
        return true;
      }
    }
    var list = gaVisible(g, wanted);
    if (list.length) {
      var pick = list.sort(function (x, y) { return dist(me.x, me.y, x.x, x.y) - dist(me.x, me.y, y.x, y.y); })[0];
      var tp2 = gaTypeOf(pick.type);
      a.prop = pick;
      gaStep('nhặt ' + (tp2 ? tp2[2] : pick.type) + ' · khu ' + gaKhu(P) + ' · còn ' + list.length + ' điểm');
      if (touchProp(g, a, pick) === 'fail') { gaPropSkip[g.mapId + ':' + gaKhu(P) + ':' + pick.id] = now() + GA_PROP_SKIP_MS; a.prop = null; }
      return true;
    }
    // Khu này hết vật: ghi lại, sang khu lâu chưa ghé nhất; ghé hết rồi thì nghỉ map này.
    var vk = g.mapId + ':' + gaKhu(P);
    if (!(now() - (gaVisited[vk] || 0) < 5000)) { gaVisited[vk] = now(); gaLog('Khu ' + gaKhu(P) + ' ở ' + mapName(g.mapId) + ' đã hết vật'); }
    var next = gaSoKhu(P) > 1 ? gaNextKhu(g) : null;
    if (next && next.ago >= GA_KHU_REVISIT_MS) { gaSwitchKhu(g, next.khu); return true; }
    gaMapRest[g.mapId] = now() + GA_MAP_REST_MS;
    gaLog(mapName(g.mapId) + ': các khu vừa vét hết → sang map khác / chờ mọc lại');
    a.target = null;
    return true;
  }

  /* ================= Bùa tự động (Kim Long / Kim Giáp, Thanh Tâm, Tốc Hành, Thổ Độn) ================= */
  // Dùng qua nút bùa của game (TalismanBar.use = bấm ô bùa); game tự xét hồi chiêu, Thần Thức, còn …
  var TAL_GAP_MS = 800;       // giữa hai lần dùng bùa (bất kỳ)
  var talLastAt = -1e9;
  function talOk(P, me, id) {
    var T = P.Talismans, TB = P.TalismanBar;
    if (!T || !TB || !TB.use || !T.defOf || !T.canUse) return false;
    var def = T.defOf(id);
    if (!def) return false;
    var r = T.canUse(me, def, P);
    return !!(r && r.ok);
  }
  function talUse(g, id, why) {
    if (now() - talLastAt < TAL_GAP_MS || !talOk(g.P, g.me, id) || ((cfg.ylRun || planIs('yl')) && ylPhase(g.P))) return false;
    talLastAt = now();
    g.P.TalismanBar.use(id);
    var def = g.P.Talismans.defOf(id);
    klog('Dùng ' + (def && def.name || id) + ': ' + why);
    return true;
  }
  function tickTalismans(g) {
    var me = g.me;
    if (me.downed || !g.P.TalismanBar || fishingCalm(g)) return;
    var hpPct = me.hpMax ? me.hp / me.hpMax * 100 : 100, hurt = incomingDps(g) > 0;
    if (cfg.autoShield && hpPct < cfg.shieldHp && hurt) {
      if (!talUse(g, 'kim_long', 'máu ' + Math.round(hpPct) + '%')) talUse(g, 'kim_giap', 'máu ' + Math.round(hpPct) + '%');
    }
    if (now() - (st.kimKiemAt || -1e9) < 2500) {
      if (!talUse(g, 'kim_long', 'Kim Quang Cự Kiếm khoá mình')) talUse(g, 'kim_giap', 'Kim Quang Cự Kiếm khoá mình');
    }
    if (cfg.autoMpTal && me.mpMax > 0 && me.mp / me.mpMax < 0.15 && (hurt || stillFighting(g))) {
      talUse(g, 'thanh_tam', 'linh lực ' + Math.round(me.mp) + '/' + Math.round(me.mpMax));
    }
    if (cfg.autoHaste && !(me.hasteT > 0) && (st.healMoving || (st.dodging && st.dodgeFar))) {
      talUse(g, 'toc_hanh', st.healMoving ? 'chạy ra chỗ thiền' : 'né chiêu xa');
    }
    if (cfg.autoDash && me.rootT > 0 && (hurt || inHazard(hazards(g), me.x, me.y))) talUse(g, 'tho_don', 'bị trói chân');
    if (cfg.bossMaxDmg) bossTalismans(g);
  }

  /* ================= Trận bàn tự dựng ================= */
  // Trận pháp (FormationUI.blocked kiểm đủ điều kiện): Tụ Linh khi thiếu linh lực; trận sát thương dưới chân boss / cụm quái.
  var TRAN_DMG = ['tu_tuong', 'dao_gia', 'ma_dao', 'loan_loi_hoa', 'liet_hoa'], TRAN_GAP_MS = 1200;
  function tranOwned(P, def) { return !!(def && P.Inventory && P.Inventory.count && P.Inventory.count(def.item) > 0); }
  function tranBegin(g, def, pt) {
    var P = g.P, U = P.FormationUI, F = P.Formations, G = P.Gateway, me = g.me;
    var why = U.blocked(def, me);
    if (why) return false;
    var req = G.formationBegin(def.id, F.fullBudget ? F.fullBudget(def) : 0, pt);
    if (!req) return false;
    var c = pt || { x: me.x, y: me.y };
    U.pending = { requestId: req, at: performance.now(), defId: def.id, x: c.x, y: c.y, radius: def.radius || 96, windupMs: def.windupMs || 900 };
    return true;
  }
  function tickTran(g) {
    var P = g.P, F = P.Formations, U = P.FormationUI, G = P.Gateway, me = g.me;
    if (fishingCalm(g)) return;
    if (!cfg.autoTran || !F || !F.DEFS || !U || !U.blocked || !G || !G.formationBegin || me.downed || me.state === 'sit') return;
    if (now() - (st.tranAt || -1e9) < TRAN_GAP_MS || (U.realmOk && !U.realmOk(me))) return;
    if (U.activeId || U.pending) return; // trận cũ còn vận / đang chờ máy chủ
    var fighting = stillFighting(g) || incomingDps(g) > 0, mpPct = me.mpMax ? me.mp / me.mpMax * 100 : 100;
    var t = st.farmTarget && !st.farmTarget.dead && (g.sw.enemies || []).indexOf(st.farmTarget) >= 0 ? st.farmTarget : kiteTarget(g);
    if (t && (t.dead || !t.def || (g.sw.enemies || []).indexOf(t) < 0 || dist(me.x, me.y, t.x, t.y) > 320)) t = null;
    var tl = F.DEFS.tu_linh;
    if (cfg.tran_tu_linh && tl && tranOwned(P, tl) && fighting && mpPct < cfg.tranMp && tranBegin(g, tl, null)) {
      st.tranAt = now();
      klog('[Trận] Dựng ' + tl.name + ': linh lực ' + Math.round(mpPct) + '% (hồi ' + (tl.restoreMp || 0) + '/giây trong ' + Math.round(tl.durationMs / 1000) + 's)');
      return;
    }
    if (!t || !fighting) return;
    var boss = isBoss(t), mobs = mobsAlive(g);
    for (var i = 0; i < TRAN_DMG.length; i++) {
      var def = F.DEFS[TRAN_DMG[i]];
      if (!def || cfg['tran_' + def.id] === false || !tranOwned(P, def)) continue;
      var R = def.radius || 96, n = mobs.filter(function (m) { return dist(m.x, m.y, t.x, t.y) <= R; }).length;
      if (!boss && n < cfg.tranMobs) continue;
      var pt = null;
      if (def.aim === (F.AIM && F.AIM.POINT || 'point')) {
        var d = dist(me.x, me.y, t.x, t.y), rg = (def.range || 112) - 6, k = d > rg ? rg / d : 1;
        pt = { x: me.x + (t.x - me.x) * k, y: me.y + (t.y - me.y) * k };
      }
      if (tranBegin(g, def, pt)) {
        st.tranAt = now();
        klog('[Trận] Dựng ' + def.name + ' dưới chân ' + mobLabel(t) + (boss ? ' (boss)' : ' (' + n + ' con trong vòng)'));
        return;
      }
    }
  }

  /* ================= Khôi Lỗi / Thi Khôi tự triệu hồi ================= */
  // Gọi qua nút của game (KhoiLoiUI.batTat); KhoiLoi.xetGoi báo lý do không gọi được (chưa Trúc Cơ, …
  var KL_PREF = {
    auto: ['khoi_loi_yeu_cot', 'khoi_loi_huyen_thiet', 'thi_khoi_bach', 'thi_khoi_dong', 'khoi_loi_bich_moc', 'thi_khoi_thanh'],
    dps: ['khoi_loi_yeu_cot', 'thi_khoi_bach', 'khoi_loi_bich_moc', 'thi_khoi_thanh', 'khoi_loi_huyen_thiet', 'thi_khoi_dong'],
    tank: ['khoi_loi_huyen_thiet', 'thi_khoi_dong', 'khoi_loi_bich_moc', 'thi_khoi_thanh', 'khoi_loi_yeu_cot', 'thi_khoi_bach']
  };
  var KL_FIGHT_R = 350, KL_GAP_MS = 2500;
  function tickKhoiLoi(g) {
    if (fishingCalm(g)) return;
    if (!cfg.autoKhoiLoi || st.dc || (st.ga && !cfg.gatherFightOn)) return;
    var P = g.P, K = P.KhoiLoi, KU = P.KhoiLoiUI, G = P.Gateway, me = g.me;
    if (!K || !KU || !KU.batTat || !KU.dangRaDs || !G || !G.connected || !G.ready || me.downed) return;
    if (K.dungDuoc && !K.dungDuoc(P)) return;
    if (K.mapCam && K.mapCam(g.sw.map && g.sw.map.data)) return;
    if (now() - (st.klAt || 0) < KL_GAP_MS) return;
    var out = KU.dangRaDs();
    if (out.length >= (K.TRAN || 2)) return;
    var boss = null;
    var fight = mobsAlive(g).some(function (m) {
      if (dist(me.x, me.y, m.x, m.y) > KL_FIGHT_R) return false;
      if (isBoss(m)) boss = m;
      return K.danhDuoc ? K.danhDuoc(m.def) : m.def.contactDmg > 0;
    });
    if (!fight) return;
    var pref = cfg.khoiLoiPref === 'auto' && boss ? 'dps' : cfg.khoiLoiPref;
    var list = KL_PREF[pref] || KL_PREF.auto;
    for (var i = 0; i < list.length; i++) {
      var id = list[i];
      if (out.indexOf(id) >= 0 || (K.xetGoi && K.xetGoi(P, id, out, me.sp))) continue;
      st.klAt = now();
      var def = K.byId ? K.byId(id) : null;
      KU.batTat(id, function (res) { if (res && res.ok === false) klog('Gọi khôi lỗi không được: ' + (res.why || '')); });
      klog('Triệu hồi ' + (def && def.ten || id) + (boss ? ' đánh boss' : ''));
      return;
    }
  }


  /* ================= Bí Tịch Hóa Thân (Biến hình) ================= */
  // Kim Cương Hóa Thân (Chính Đạo), Xích Ma Hóa Thân (Ma Đạo), Bàn Thạch Hộ Thể (Thể Tu)
  // Kích hoạt khi: Săn Boss, PK đối kháng, hoặc máu nguy hiểm (<= 50%) để nhận Giáp, Tốc chạy và Tốc đánh hút máu.
  function formSkillDef(g) {
    var S = g.P.Skills;
    if (!S || !S.learnedSlots || !S.slotDef) return null;
    var slots = S.learnedSlots();
    for (var i = 0; i < slots.length; i++) {
      var d = S.slotDef(slots[i]);
      if (d && d.bienHinh) return d;
    }
    return null;
  }

  function isFormActive(g) {
    var me = g.me, P = g.P;
    if (!me) return false;
    if (P.Player && P.Player.formDef && P.Player.formDef(me)) return true;
    return !!(me.hinhT > 0 && me.hinhId);
  }

  function tickHoaThan(g) {
    if (cfg.autoHoaThan === false || !enabled || g.me.downed || g.me.state === 'sit' || busyUI(g.P) || fishingCalm(g)) return false;
    var def = formSkillDef(g);
    if (!def) return false;
    if (isFormActive(g)) return false; // đang biến hình: đợi hết giờ

    var P = g.P, S = P.Skills, PL = P.Player, me = g.me;
    if (!PL || !PL.castSpell || !S) return false;
    if (S.ready && !S.ready(me, def)) return false;
    if (me.spellCd > 0 || (me.spellCds && me.spellCds[def.id] > 0)) return false;
    if (me.mp < (def.mp || 0) || (def.sp && me.sp < def.sp)) return false;

    // Điều kiện kích hoạt:
    // 1. PK: có người thù địch trong vòng 350px
    var pkThreat = hostilePlayers(g).some(function (r) { return isFinite(r.x) && dist(me.x, me.y, r.x, r.y) <= 350; });
    // 2. Boss: đang nhắm boss hoặc boss đang gần (450px)
    var t = st.farmTarget;
    var bossFight = (t && !t.dead && isBoss(t) && dist(me.x, me.y, t.x, t.y) <= 450) ||

  // Phẩm cấp thật của vật phẩm (ITEMS.grade): Thiên > Địa > Linh > Phàm, thượng > trung > hạ.
  function gradeScore(P, itemId) {
    if (!itemId) return 0;
    if (LOOT_SPECIAL_SCORES[itemId]) return LOOT_SPECIAL_SCORES[itemId];
    if (/^bi_tich_/.test(itemId)) return 12000;
    if (/^yeu_dan_/.test(itemId)) return 5000;
    var gr = String(P.ITEMS && P.ITEMS[itemId] && P.ITEMS[itemId].grade || '');
    var s = /^Thiên/.test(gr) ? 5000 : /^Địa/.test(gr) ? 3000 : /^Linh/.test(gr) ? 1200 : /^Phàm/.test(gr) ? 200 : 50;
    return s + (/thượng/.test(gr) ? 100 : /trung/.test(gr) ? 60 : /hạ/.test(gr) ? 20 : 0) + (itemId === 'linh_thach' ? 10 : 0);
  }
  // Danh sách "chỉ nhặt" (để trống = nhặt hết): khớp mã vật phẩm hoặc một phần tên, không phân biệt hoa thường.
  function lootFilterOk(P, itemId) {
    var f = String(cfg.lootOnly || '').toLowerCase().split(/[,;\n]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!f.length || !itemId) return true;
    var id = String(itemId).toLowerCase(), nm = String(P.ITEMS && P.ITEMS[itemId] && P.ITEMS[itemId].name || '').toLowerCase();
    return f.some(function (k) { return id.indexOf(k) >= 0 || nm.indexOf(k) >= 0; });
  }

  /* ================= Chăm vườn (Luống Thuốc) ================= */
  // Như người chơi: tới vườn, chạm từng luống cần làm. Luống chín → game thu luôn; luống trống → …
  var FA_CHECK_MS = 60000, FA_TOUCH_WAIT_MS = 1500;
  function faPlots(g) { return (g.sw.map.props || []).filter(function (p) { return p && p.type === 'herb_plot'; }); }
  function faNeeds(P, id) {
    var F = P.Farm, I = P.Inventory;
    if (!F) return '';
    if (F.ready && F.ready(id)) return 'thu';
    if (F.isEmpty && F.isEmpty(id) && F.seedsInBag && F.seedsInBag().length) return 'gieo';
    if (F.canWater && F.canWater(id) && ((F.hasWaterAccess && F.hasWaterAccess()) || (I && I.has && I.has('linh_tuyen_thuy', 1)))) return 'tưới';
    return '';
  }
  function faWork(P) {
    var F = P.Farm, n = 0;
    if (!F || !F.PLOT_COUNT) return 0;
    for (var i = 1; i <= F.PLOT_COUNT; i++) if (faNeeds(P, 'plot_' + i)) n++;
    return n;
  }
  function faStart(why) {
    var g = game();
    if (!g || !g.P.Farm) { say('Chưa vào game / game chưa có vườn'); return; }
    if (!faWork(g.P)) { say('Vườn chưa có việc gì (chưa chín, hết hạt, chưa có nước)'); return; }
    st.fa = {
      step: '', touches: 0, touchAt: 0, routeAt: 0, done: {}, plot: null, travels: 0, at: now(),
      back: st.fa && st.fa.back || takeBack(g), got: { thu: 0, gieo: 0, 'tưới': 0 }
    };
    if (!enabled) setEnabled(true);
    klog('[Vườn] Đi chăm vườn' + (why ? ' (' + why + ')' : '') + ': ' + faWork(g.P) + ' luống cần làm');
  }
  function faFinish(g, msg) {
    var a = st.fa, back = a && a.back;
    st.fa = null;
    klog('[Vườn] ' + msg);
    say('Vườn: ' + msg);
    if (back && back.map && g && (g.mapId !== back.map || dist(g.me.x, g.me.y, back.x, back.y) > 60 || (back.khu && gaKhu(g.P) !== back.khu))) goBack(back.map, back.x, back.y, 'Chăm vườn xong → về chỗ cũ', 'fa', back.khu);
  }
  function tickFarmCare(g) {
    var P = g.P;
    if (st.bh || st.bd || st.xc || st.td) return false;
    if (!st.fa) {
      if (cfg.farmAuto && !cfg.planRun && P.Farm && !cfg.dcRun && !st.travel && now() - (st.faCheckAt || -1e9) > FA_CHECK_MS) {
        st.faCheckAt = now();
        if (faWork(P) && !stillFighting(g)) faStart('tự động');
      }
      if (!st.fa) return false;
    }
    var a = st.fa, me = g.me;
    if (g.P.Input.hasManualMove()) return true;
    setAuto(g, false);
    if (now() - a.at > 5 * 60000) { faFinish(g, 'Quá 5 phút chưa xong → dừng'); return false; }
    var mapId = propMap(P, 'plot_1');
    if (!mapId) { faFinish(g, 'Không tìm thấy vườn trong dữ liệu bản đồ'); return false; }
    if (g.mapId !== mapId) {
      if (!st.travel || st.travel.map !== mapId) {
        if (++a.travels > 6) { faFinish(g, 'Không đi được tới vườn'); return false; }
        startTravel(mapId, null, null, 'Đi chăm vườn ở ' + mapName(mapId));
      }
      tickTravel(g);
      return true;
    }
    if (st.travel) stopTravel();
    if (P.HUD && P.HUD.dialogOpen) return true;
    // Đang làm một luống: đi tới, chạm, chờ game xử lý một chút rồi sang luống khác.
    if (a.plot) {
      var r = a.touchAt ? 'sent' : touchProp(g, a, a.plot);
      // Mỗi việc (thu / gieo / tưới) của một luống chỉ thử một lần; luống vừa thu xong thì gieo luôn, vừa gieo thì tưới
      // luôn — làm hết trong một lần vào vườn, không ra rồi vào lại.
      if (r === 'fail' || (a.touchAt && now() - a.touchAt >= FA_TOUCH_WAIT_MS)) { a.done[a.plot.id + ':' + a.job] = true; a.plot = null; }
      return true;
    }
    var list = faPlots(g).filter(function (p) { var j = faNeeds(P, p.id); return j && !a.done[p.id + ':' + j]; });
    if (!list.length) {
      faFinish(g, 'Xong: thu ' + (a.got.thu || 0) + ' · gieo ' + (a.got.gieo || 0) + ' · tưới ' + (a.got['tưới'] || 0) + ' luống');
      return false;
    }
    var p = list.sort(function (x, y) { return dist(me.x, me.y, x.x, x.y) - dist(me.x, me.y, y.x, y.y); })[0];
    var job = faNeeds(P, p.id);
    a.plot = p; a.job = job; a.touches = 0; a.touchAt = 0;
    a.step = job + ' ' + (p.name || p.id);
    a.got[job] = (a.got[job] || 0) + 1;
    if (job === 'gieo') dcDlg = { want: 'sow', until: now() + 8000, at: now() };
    touchProp(g, a, p);
    return true;
  }

  // Không tự chạy đi xem nữa: chỉ khi Bảng Khu được mở (người chơi tự mở, hoặc bấm "Tìm khu ít người ngay" — script chạy …

  function fkBoard(g) {

  }
  // Khu ít người nhất (bỏ khu đầy) so với khu đang đứng; null nếu khu đang đứng đã ít người nhất.
  function fkBest(g) {
    var P = g.P, cur = gaKhu(P), n = gaSoKhu(P), L = khuList && khuList.mapId === g.mapId ? khuList : null;
    if (!L || !L.dem) return null;
    var mine = Math.max(0, (L.dem[cur - 1] | 0) - 1), best = null;
    for (var k = 1; k <= n; k++) {
      if (k === cur) continue;
      var dem = L.dem[k - 1] | 0, cap = (L.tran && L.tran[k - 1]) || L.toiDa || 0;
      if (cap && dem >= cap) continue;
      if (!best || dem < best.dem) best = { khu: k, dem: dem };
    }
    return best && best.dem < mine ? { khu: best.khu, dem: best.dem, mine: mine } : { khu: 0, mine: mine };
  }
  function fkStart(why) {
    var g = game();
    if (!g) return;
    if (gaSoKhu(g.P) <= 1) { if (why === 'bấm nút') say('Map này không chia khu'); st.fkCheckAt = now(); return; }
    var fb = cfg.farm && cfg.farm.map === g.mapId ? { x: cfg.farm.x, y: cfg.farm.y, map: g.mapId } : { x: g.me.x, y: g.me.y, map: g.mapId };
    st.fk = { step: 'board', at: now(), askAt: 0, touches: 0, touchAt: 0, routeAt: 0, want: 0, back: fb };
    if (!enabled) setEnabled(true);
  }
  function fkDone(g, msg) {
    var f = st.fk;
    st.fk = null;
    st.fkCheckAt = now();
    if (msg) fkLog(msg);
    if (g && g.P.KhuUI && g.P.KhuUI.isOpen && g.P.KhuUI.isOpen() && !(f && f.manual)) g.P.KhuUI.close(); // tự mở thì để bảng cho người chơi
    if (f && f.back && g && g.mapId === f.back.map && dist(g.me.x, g.me.y, f.back.x, f.back.y) > 60) startTravel(f.back.map, f.back.x, f.back.y, 'Về chỗ farm ở khu mới');
  }
  // Đang thật sự đánh nhau: có quái đang đuổi / cắn mình, hoặc mình đang mất máu. (Bãi farm lúc nào cũng có quái đứng
  // gần, nên không lấy "có quái quanh đây" làm lý do chờ — trước đây vì thế mà không bao giờ tới lượt đổi khu.)
  function fkEngaged(g) { return !!engagedBy(g); }
  // Quái / người đang đánh chính mình (game không báo quái đang đuổi ai): quái hung hăng đang đuổi / vồ mà người gần nó
  // nhất là mình (quái đuổi người chơi khác đứng cạnh thì không tính), hoặc mình vừa mất máu mà có quái hung hăng sát bên.
  function mobOnMe(g, m) {
    var me = g.me, dm = dist(me.x, me.y, m.x, m.y), R = g.P.Gateway && g.P.Gateway.remotes || {};
    return !Object.keys(R).some(function (id) { var r = R[id]; return r && !r.downed && isFinite(r.x) && dist(r.x, r.y, m.x, m.y) + 30 < dm; });
  }
  function engagedBy(g) {
    var me = g.me, mobs = mobsAlive(g).filter(function (m) { return m.def.contactDmg > 0 && m.state !== 'return'; });
    var chasing = mobs.filter(function (m) { return (m.state === 'chase' || m.state === 'attack') && dist(me.x, me.y, m.x, m.y) <= 260 && mobOnMe(g, m); });
    var hit = 0;
    hpLog.forEach(function (e) { hit += e.d; });
    if (hit >= Math.max(1, (me.hpMax || 100) * 0.005)) {
      var near = mobs.filter(function (m) { return dist(me.x, me.y, m.x, m.y) <= mobBaseReach(g, m) + 60; });
      if (near.length) chasing = chasing.concat(near);
    }
    var foe = hostilePlayers(g).filter(function (r) { return dist(me.x, me.y, r.x, r.y) <= 260; })[0];
    if (foe) return foe;
    return chasing.sort(function (a, b) { return dist(me.x, me.y, a.x, a.y) - dist(me.x, me.y, b.x, b.y); })[0] || null;
  }
  // Đang câu yên ổn (không ai đánh mình): các phần tự động khác (bùa, trận, khôi lỗi, gọi Âm Hồn) không được động vào.
  function fishingCalm(g) { return !!((g.sw.fishing || g.sw.fishingAuto) && !engagedBy(g)); }
  function tickFarmKhu(g) {
    var P = g.P, G = P.Gateway, K = P.KhuUI;
    if (!st.fk) {
      // Bảng Khu vừa được mở (mỗi lần mở xét một lần): đọc số người, có khu vắng hơn thì sang.
      var opened = K && K.isOpen && K.isOpen() && khuOpenAt && khuOpenAt !== st.fkOpenSeen;
      st.fkWhy = !cfg.farmKhu ? 'đang tắt' : gaSoKhu(P) <= 1 ? 'map này không chia khu' : 'chờ mở Bảng Khu';
      if (!opened) {
        // Tự xem định kỳ: cứ farmKhuMin phút (lúc rảnh, đang tự đánh) chạy ra Bảng Khu, xong về đúng chỗ farm.
        if (!cfg.farmKhuAuto || gaSoKhu(P) <= 1) return false;
        var why = !g.sw.autoOn ? 'Tự Động đang tắt' : st.bh ? 'đang đi boss' : st.bd || st.xc || st.td ? 'đang săn sự kiện' : st.hon ? 'đang săn hồn' :
          st.dc ? 'đang làm Dược Công' : st.ga ? 'đang nhặt nguyên liệu' : st.fa ? 'đang chăm vườn' : st.travel ? 'đang đi đường' : st.healing ? 'đang thiền' : '';
        if (!why && now() - (st.fkCheckAt || -1e9) < cfg.farmKhuMin * 60000) why = 'chờ tới lượt xem';
        if (!why && fkEngaged(g)) why = 'đang bị quái đuổi đánh, đánh xong đã';
        if (!why && dropsLeft(g).length) why = 'đang chờ nhặt đồ rơi';
        st.fkWhy = why;
        if (why) return false;
        fkStart('định kỳ');
        if (!st.fk) return false;
        fkLog('Tới lượt xem (mỗi ' + cfg.farmKhuMin + ' phút) → ra Bảng Khu tìm khu ít người');
      } else {
        st.fkOpenSeen = khuOpenAt;
        if (!cfg.farmKhu || gaSoKhu(P) <= 1) return false;
        fkStart('mở bảng');
        if (!st.fk) return false;
        st.fk.at = khuOpenAt - 50; // danh sách có thể về ngay sau lúc mở
        st.fk.back = null;         // người chơi tự mở bảng: không kéo về chỗ farm
        st.fk.manual = true;
      }
    }
    var f = st.fk;
    if (!f || P.Input.hasManualMove()) return false;
    if (!G || !G.connected) { fkDone(g, 'Mất kết nối → để lần sau'); return false; }
    if (now() - f.at > 60000) { fkDone(g, 'Quá 1 phút chưa xong → để lần sau'); return false; }
    // Đang bị đánh thì để đánh xong (trừ lúc đã chọn khu, đang chờ sang).
    if (f.step !== 'wait' && fkEngaged(g)) return false;
    setAuto(g, false);
    if (f.step === 'board') {
      if (K && K.isOpen && K.isOpen()) {
        if (!f.openAt) f.openAt = now();
        // Bảng mở là game hỏi máy chủ ngay; ping thấp thì danh sách về trước cả nhịp kiểm tra kế (150ms) → tính mọi danh …
        if (khuListAt >= f.at && khuList && khuList.mapId === g.mapId) { f.step = 'decide'; fkLog('Đứng ở Bảng Khu, xem số người từng khu'); }
        else if (now() - f.openAt < FK_ASK_WAIT_MS * (f.asked ? 2 : 1)) return true;
        else if (!f.asked && G.send) { f.asked = true; G.send({ op: 'khu', act: 'xem' }); return true; } // hỏi lại một lần
        else { fkDone(g, 'Bảng Khu không báo số người → để lần sau'); return false; }
      } else {
        var b = fkBoard(g);
        if (!b) { fkDone(g, 'Map này không có Bảng Khu'); return false; }
        if (touchProp(g, f, b) === 'fail') { fkDone(g, 'Không chạm được Bảng Khu'); return false; }
        st.fkWhy = 'tới Bảng Khu xem số người';
        return true;
      }
    }
    if (f.step === 'decide') {
      var best = fkBest(g);
      if (!best || !best.khu) { fkDone(g, 'Khu ' + gaKhu(P) + ' đã ít người nhất' + (best ? ' (' + best.mine + ' người khác)' : '')); return false; }
      f.want = best.khu;
      fkLog('Khu ' + gaKhu(P) + ' có ' + best.mine + ' người khác, khu ' + best.khu + ' có ' + best.dem + ' → sang khu ' + best.khu);
      f.step = 'switch'; f.touches = 0; f.touchAt = 0;
    }
    if (f.step === 'switch') {
      if (gaKhu(P) === f.want) { fkDone(g, 'Đã sang khu ' + f.want); return false; }
      if (lootBeforeLeave(g)) return true;
      if (K && K.isOpen && K.isOpen()) {
        if (!G.send || !G.send({ op: 'khu', act: 'chon', khu: f.want })) { fkDone(g, 'Không gửi được lệnh đổi khu'); return false; }
        K.close();
        f.step = 'wait'; f.waitAt = now();
        return true;
      }
      var b2 = fkBoard(g);
      if (!b2) { fkDone(g, 'Map này không có Bảng Khu'); return false; }
      if (touchProp(g, f, b2) === 'fail') { fkDone(g, 'Không chạm được Bảng Khu'); return false; }
      return true;
    }
    if (f.step === 'wait') {
      if (gaKhu(P) === f.want) { fkDone(g, 'Đã sang khu ' + f.want + (f.back ? ' → về chỗ farm đánh tiếp' : '')); return false; }
      if (now() - f.waitAt < FK_SWITCH_WAIT_MS) return true;
      fkDone(g, 'Chọn khu ' + f.want + ' mà chưa sang được → để lần sau');
      return false;
    }
    return true;
  }

  /* ================= Vũ khí đánh lan: tự đo tầm lan, chọn chỗ đứng trúng nhiều con ================= */
  // Đo tầm lan đòn đánh thường theo gói "hit" của máy chủ (20px một ô), rồi chọn chỗ đứng trúng nhiều con nhất.
  var SPLASH_BIN = 20;          // px mỗi ô khoảng cách
  var SPLASH_WAIT_MS = 800;     // chờ gói trúng từ máy chủ sau nhát đánh
  var SPLASH_MIN_SEEN = 3;      // một ô cần chừng này mẫu mới tin
  var SPLASH_SINGLE_N = 10;     // chừng này mẫu không trúng con nào ngoài mục tiêu → vũ khí đánh đơn
  var SPLASH_THREAT_COST = 25;  // điểm trừ mỗi con cắn tới được chỗ đứng (1 con trúng thêm = 100)
  var pendingSplash = null, splashSaveAt = 0;

  function weaponId(P) { var w = P.Player && P.Player.weaponDef && P.Player.weaponDef(); return w ? w.id : 'tay_khong'; }
  function weaponName(P) { var w = P.Player && P.Player.weaponDef && P.Player.weaponDef(); return w ? w.name : 'Tay không'; }
  function attackOrigin(P) { return P.CONFIG.PLAYER && P.CONFIG.PLAYER.ATTACK_ORIGIN || 14; }
  function dirVec(dir) { return { x: dir === 1 ? -1 : dir === 2 ? 1 : 0, y: dir === 0 ? 1 : dir === 3 ? -1 : 0 }; }
  // Hướng game quay mặt khi đánh mục tiêu: trục lớn hơn của vector tới mục tiêu.
  function dirToward(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 1) : (dy > 0 ? 0 : 3); }

  // Những con mà nhát đánh từ chỗ p (quay mặt dir) có thể trúng nếu vũ khí đánh lan: trong tầm R
  // (từ điểm ra đòn) và ở nửa phía trước.
  function frontInReach(g, px, py, dir, R) {
    var v = dirVec(dir), o = attackOrigin(g.P), ox = px + v.x * o, oy = py + v.y * o;
    return mobsAlive(g).filter(function (m) {
      var d = dist(ox, oy, m.x, m.y);
      if (d > R + (m.def && m.def.bodyRadius || 0)) return false;
      return dist(px, py, m.x, m.y) <= 2 || (m.x - px) * v.x + (m.y - py) * v.y > 0;
    }).map(function (m) { return { m: m, d: dist(ox, oy, m.x, m.y) }; });
  }

  function splashLearn(w) {
    var L = cfg.splashLearn2 || (cfg.splashLearn2 = {});
    return L[w] || (L[w] = { b: {}, sw: 0 });
  }
  function splashFinalize() {
    var p = pendingSplash;
    if (!p) return;
    pendingSplash = null;
    if (!p.hits.has(p.target)) return; // nhát hụt / mục tiêu ngoài tầm: không tính
    var L = splashLearn(p.w);
    L.sw++;
    p.cands.forEach(function (c) {
      if (c.m === p.target) return;
      var k = Math.floor(c.d / SPLASH_BIN), b = L.b[k] || (L.b[k] = [0, 0]);
      b[0]++;
      if (p.hits.has(c.m)) b[1]++;
    });
    if (now() - splashSaveAt > 10000) { splashSaveAt = now(); save(); }
  }
  function splashSwing(g) {
    splashFinalize();
    var me = g.me, t = me.attackTarget;
    if (!t || !t.def) return;
    var R = g.P.Player.reach ? g.P.Player.reach() : 26;
    pendingSplash = { at: now(), w: weaponId(g.P), target: t, hits: new Set(), cands: frontInReach(g, me.x, me.y, me.dir, R) };
  }
  function splashHit(m) { if (pendingSplash && m && now() - pendingSplash.at < SPLASH_WAIT_MS) pendingSplash.hits.add(m); }
  function tickSplash() { if (pendingSplash && now() - pendingSplash.at >= SPLASH_WAIT_MS) splashFinalize(); }

  // Tầm lan đã đo của vũ khí: null = chưa đủ mẫu; 0 = đánh đơn; > 0 = con cách điểm ra đòn tới …
  var SPLASH_NEAR_SHARE = 0.55;
  function splashEstimate(w, reach) {
    var L = cfg.splashLearn2 && cfg.splashLearn2[w];
    if (!L) return { r: null, n: 0, sw: 0, nearN: 0 };
    var keys = Object.keys(L.b).map(Number).sort(function (a, b) { return a - b; }), n = 0, r = 0, nearN = 0, nearHit = 0, hit = 0;
    var nearMax = (reach || 240) * SPLASH_NEAR_SHARE;
    keys.forEach(function (k) {
      n += L.b[k][0]; hit += L.b[k][1];
      if ((k + 1) * SPLASH_BIN <= nearMax) { nearN += L.b[k][0]; nearHit += L.b[k][1]; }
    });
    if (nearN >= SPLASH_SINGLE_N && nearHit === 0) return { r: 0, n: n, sw: L.sw, nearN: nearN, hit: hit };
    for (var i = 0; i < keys.length; i++) {
      var b = L.b[keys[i]];
      if (b[0] < SPLASH_MIN_SEEN) continue;
      var ratio = b[1] / b[0];
      if (ratio >= 0.5) r = (keys[i] + 1) * SPLASH_BIN;
      else if (ratio < 0.25 && r > 0) break;
    }
    return { r: r > 0 ? r : null, n: n, sw: L.sw, nearN: nearN, hit: hit };
  }
  // Tầm lan dùng để chọn chỗ đứng. Chưa đo ra thì với vũ khí tầm xa tạm coi là nửa tầm (vào gần
  // hơn vừa đánh vừa đo); đo ra "đánh đơn" thì 0.
  var SPLASH_EXPLORE_MIN_REACH = 80;
  // Theo mã game (Player.singleTargetWeapon): mọi vũ khí trừ Trúc Kiếm chỉ đánh một mục tiêu; online
  // máy mình cũng chỉ gửi đúng một targetId. Vũ khí như vậy không đi đo (không vào gần vô ích).
  function gameSingleTarget(g) {
    var PL = g.P.Player;
    try { return !!(PL && PL.singleTargetWeapon && PL.singleTargetWeapon(g.me)); } catch (e) { return false; }
  }
  function splashR(g) {
    var reach = g.P.Player.reach ? g.P.Player.reach() : 26;
    if (cfg.splashManual > 0) return { r: Math.min(cfg.splashManual, reach) };
    var e = splashEstimate(weaponId(g.P), reach);
    if (e.r > 0) return { r: Math.min(e.r, reach) };
    if (e.r === 0 || gameSingleTarget(g)) return { r: 0 };
    return reach >= SPLASH_EXPLORE_MIN_REACH ? { r: Math.round(reach * 0.5), explore: true } : { r: 0 };
  }

  // Chỗ đứng đánh lan tốt nhất quanh mục tiêu t: {x, y, count, r, here}; null nếu không đáng (chưa
  // biết tầm lan, vũ khí đánh đơn, hoặc quanh mục tiêu không có con nào khác).
  function splashSpot(g, t) {
    if (!cfg.splashPos || !t || !t.def) return null;
    var ri = splashR(g), r = ri.r;
    if (!(r > 0)) return null;
    var P = g.P, me = g.me, reach = P.Player.reach ? P.Player.reach() : 26, o = attackOrigin(P);
    var mobs = mobsAlive(g), near = mobs.filter(function (m) { return dist(m.x, m.y, t.x, t.y) <= r * 2 + 40; });
    if (near.length < 2) return null;
    var sc = spotCheck(g), avoid = hazards(g).concat(towerAvoid(g)), keep = leashKeep(g, t);
    function evalAt(px, py) {
      var dir = dirToward(t.x - px, t.y - py), v = dirVec(dir);
      if (dist(px + v.x * o, py + v.y * o, t.x, t.y) > reach + (t.def.bodyRadius || 0) - 2) return null; // mục tiêu phải trong tầm
      var count = frontInReach(g, px, py, dir, r).length;
      var threats = mobs.filter(function (m) { return m.def.contactDmg > 0 && dist(px, py, m.x, m.y) <= mobBaseReach(g, m) + 4; }).length;
      return { x: px, y: py, count: count, threats: threats, score: count * 100 - threats * SPLASH_THREAT_COST - dist(me.x, me.y, px, py) * 0.25 };
    }
    var here = evalAt(me.x, me.y), best = here;
    var maxR = Math.min(r, reach) - 4;
    for (var rr = 16; rr <= maxR; rr += 16) {
      for (var k = 0; k < 16; k++) {
        var a = k / 16 * Math.PI * 2, x = t.x + Math.cos(a) * rr, y = t.y + Math.sin(a) * rr;
        if (!sc.standable(x, y) || inHazard(avoid, x, y) || (keep && !keep(x, y))) continue;
        var c = evalAt(x, y);
        if (c && (!best || c.score > best.score)) best = c;
      }
    }
    if (!best || best.count < 2) return null;
    if (here && here.count >= best.count) return { x: me.x, y: me.y, count: here.count, r: r, here: true, explore: ri.explore };
    best.r = r;
    best.explore = ri.explore;
    return best;
  }

  /* ================= Tự đi đánh boss thế giới theo giờ ================= */
  // Theo lịch boss toàn máy chủ (hoatdong.xem, như bảng Hoạt Động): boss đang sống hoặc sắp ra trong …
  var BH_NEAR = 260;            // px quanh chỗ boss hồi sinh coi là đã tới
  var BH_LOOT_MS = 25000;       // boss chết rồi đứng thêm 25s (server bốc thăm quà lúc 20s, bán kính 700px)
  var BH_SKIP_MS = 3 * 60000;   // vừa đánh xong một boss: chừng này mới xét lại boss đó (lịch còn cũ)
  var BH_MAX_MS = 15 * 60000;   // tối đa 15 phút săn một boss thế giới (quá hạn tự hủy tránh treo)
  var BH_FAIL_SKIP_MS = 30 * 60000;
  var BH_LOOK_MS = 2500;        // vào khu rồi mà lịch báo boss đang sống, chừng này chưa thấy thì sang khu khác
  var BH_SPAWN_GRACE = 15;      // giây sau giờ hồi sinh mới tính là boss phải có mặt
  var BH_NOKHU_MS = 60000;      // map không chia khu: boss phải có mà chừng này không thấy thì thôi
  var bhSkip = {};
  var bossSpawnCache = {};
  function bhLog(msg) { klog('[Boss] ' + msg); say('Boss: ' + msg); }
  // Chỗ boss hồi sinh: tìm trong danh sách quái của dữ liệu bản đồ theo id điểm hồi sinh.
  function bossSpawnPos(P, b) {
    if (bossSpawnCache[b.spawn]) return bossSpawnCache[b.spawn];
    var MD = P.MapData || {}, T = P.CONFIG.TILE || 32, found = null;
    Object.keys(MD).some(function (k) {
      var m = MD[k];
      if (!m || typeof m !== 'object' || m.id !== b.map || !Array.isArray(m.enemies)) return false;
      return m.enemies.some(function (e) { if (e && e.id === b.spawn) { found = { x: (e.tx + 0.5) * T, y: (e.ty + 1) * T }; return true; } return false; });
    });
    if (found) bossSpawnCache[b.spawn] = found;
    return found;
  }
  var BH_NAMES = { than_thu_xich_long: 'Thần Thú Xích Long', linh_ho_tran_son: 'Linh Hổ Trấn Sơn', song_duc_ma_bao: 'Song Dực Ma Báo', nhen_bach_ngoc: 'Nhện Bạch Ngọc' };
