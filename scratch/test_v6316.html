  <script>
    window.testResults = { passed: 0, failed: 0, logs: [] };
    function log(msg, pass) {
      var d = document.createElement('div');
      d.textContent = (pass === true ? '[PASS] ' : pass === false ? '[FAIL] ' : '[INFO] ') + msg;
      document.getElementById('logs').appendChild(d);
      if (pass === true) window.testResults.passed++;
      if (pass === false) { window.testResults.failed++; window.testResults.logs.push(msg); }
      console.log(d.textContent);
    }
  </script>

  <script>
    try {
      log('--- 1. TEST INITIALIZATION & VERSION ---', null);
      var TB = window.TTBot || window._ttbot;
      log('TB dev interface available', !!(TB && TB.dev && TB.dev.eval));

      var v = TB.dev.eval('VERSION');

      log('--- 2. TEST NEW SECTS, WEAPONS & LOOT SCORES ---', null);

      var scoreVanKhuc = TB.dev.eval('LOOT_SPECIAL_SCORES["van_khuc_thu"]');
      var scoreHuyetPhach = TB.dev.eval('LOOT_SPECIAL_SCORES["huyet_phach_chau"]');
      var scoreMacTu = TB.dev.eval('LOOT_SPECIAL_SCORES["mac_tu"]');
      var scoreHuyetHon = TB.dev.eval('LOOT_SPECIAL_SCORES["huyet_hon"]');
      log('Trấn phái Văn Khúc Thư (17800): ' + scoreVanKhuc, scoreVanKhuc === 17800);
      log('Trấn phái Huyết Phách Châu (17800): ' + scoreHuyetPhach, scoreHuyetPhach === 17800);

      var scoreDanHon = TB.dev.eval('LOOT_SPECIAL_SCORES["dan_hon_dang"]');

      log('gradeScore(bi_tich_thanh_an_ho_the) === 18500: ' + gsThanhAn, gsThanhAn === 18500);
      log('gradeScore(bi_tich_huyet_te_ma_dong) === 18000: ' + gsHuyetTe, gsHuyetTe === 18000);

      log('--- 4. TEST CORE SAFETY & MECHANICS ---', null);
      // Test Yêu thú xổng chuồng áp sát chạm d <= 2px ngay từ đầu
      TB.dev.eval('st.xc = { id: 999, name: "Bạch Hổ Tuyết" };');
      var isHugClose = TB.dev.eval('!!(st.xc || isLastHitOnly({}))');
      log('Săn Yêu thú xổng chuồng kích hoạt chế độ hugClose d <= 2px: ' + isHugClose, isHugClose === true);
      TB.dev.eval('st.xc = null;');

      var isJailedNormal = TB.dev.eval('isJailed(game())');
      log('Normal map is NOT jailed: ' + (isJailedNormal === false), isJailedNormal === false);

      P.Progress.hacThi.giamDen = Date.now() + 600000;
      var isJailedGiam = TB.dev.eval('isJailed(game())');
      log('isJailed detects Progress.hacThi.giamDen: ' + (isJailedGiam === true), isJailedGiam === true);
      P.Progress.hacThi.giamDen = 0;

      // Test Thạch Quỷ biến dị advance warning handler
      var bdEventsArr = TB.dev.eval('Array.isArray(bdEvents)');
      log('bdEvents array exists: ' + bdEventsArr, bdEventsArr === true);

      // Test Trận Bàn restriction to world boss & thương đội
      TB.dev.eval('st.bh = true; st.td = false;');
      var tbWorld = TB.dev.eval('isTranAllowed(game())');
      TB.dev.eval('st.bh = false; st.td = true;');
      var tbThuongDoi = TB.dev.eval('isTranAllowed(game())');
      TB.dev.eval('st.bh = false; st.td = false;');
      var tbFarm = TB.dev.eval('isTranAllowed(game())');
      log('isTranAllowed cho phép khi săn boss world (st.bh): ' + tbWorld, tbWorld === true);
      log('isTranAllowed cho phép khi săn thương đội (st.td): ' + tbThuongDoi, tbThuongDoi === true);
      log('isTranAllowed chặn tuyệt đối khi farm thường / khác: ' + (tbFarm === false), tbFarm === false);

      // Test Vết Nứt: Cấm thiền trong Vết Nứt
      fakeMap.data.id = 'khong_gian_vet_nut';
      fakeSw.mapId = 'khong_gian_vet_nut';
      var isVnIn = TB.dev.eval('vnIn(game())');
      log('vnIn nhận diện chính xác bản đồ Vết Nứt: ' + isVnIn, isVnIn === true);

      TB.dev.eval('st.healing = true;');
      TB.dev.eval('tickHeal(game());');
      var healingAfterVn = TB.dev.eval('st.healing');
      log('tickHeal lập tức hủy thiền (st.healing === false) khi ở trong Vết Nứt: ' + (healingAfterVn === false), healingAfterVn === false);

      fakeMap.data.id = 'thon_da_do';
      fakeSw.mapId = 'thon_da_do';

      log('=== TOTAL: ' + window.testResults.passed + ' passed, ' + window.testResults.failed + ' failed. ===');
    } catch (err) {
      log('Test exception: ' + err.message, false);
    }
